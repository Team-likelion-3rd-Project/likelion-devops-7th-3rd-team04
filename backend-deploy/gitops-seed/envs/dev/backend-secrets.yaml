# 온프레미스 dev backend Secret 매핑 (ArgoCD backend-secrets 앱 — apps/dev/backend-secrets.yaml)
# 차트: GitHub 모노레포 backend-deploy/charts/backend-secrets (기본값은 그 values.yaml)
#
# 값은 OpenBao(secret/team04-hotel/dev/<경로>)에만 있고, 여기에는 "Secret key ← 경로.속성" 이름만 적습니다.
# main 에 merge 하면 ArgoCD 가 ExternalSecret 을 갱신하고 ESO 가 Secret 에 반영합니다. Pod 는 기동 때만 읽으므로
# 반영 뒤 해당 Deployment 를 재시작하거나 다음 배포를 기다립니다 (infra/ansible README 16-4).
#
# 새 비밀 추가:
#   1) OpenBao backend-env 경로에 속성 추가 (속성 이름 = 환경변수 이름 권장, UI 의 Create new version 또는 bao kv patch)
#   2) 아래 backend-env 에 "환경변수 이름: 속성 이름" 추가 — 원본에 속성이 없으면 이 ExternalSecret 전체가 동기화에 실패하므로 1) 먼저
#   3) envs/dev/values.yaml 의 그 서비스 secretEnv 에 이름 추가
#   다른 경로를 새로 만들 때만 ESO 읽기 정책(infra/ansible group_vars/all.yml eso_read_paths → db.yml --tags openbao)도 고칩니다.
#
# 아래 기존 경로는 db.yml · gitlab.yml · payment.yml 도 직접 읽으므로 경로 · 속성 이름을 바꾸지 마세요.
data:
  main-db:
    DB_HOST: host
    DB_DATABASE: dbname
    DB_USERNAME: username
    DB_PASSWORD: password
  main-valkey:
    REDIS_HOST: host
    REDIS_PASSWORD: password
  backend-app:
    JWT_ACCESS_SECRET: jwt_access_secret
    JWT_REFRESH_SECRET: jwt_refresh_secret
    MOCK_PG_SECRET: mock_pg_secret
  kakao-login:
    KAKAO_CLIENT_ID: client_id
    KAKAO_CLIENT_SECRET: client_secret
  # ── dev 전용 (운영은 S3 · DynamoDB 를 IAM 으로) ──
  minio-app:
    S3_ENDPOINT: endpoint
    S3_ACCESS_KEY_ID: access_key
    S3_SECRET_ACCESS_KEY: secret_key
  minio-rag:
    VECTOR_OBJECT_ENDPOINT: endpoint
    VECTOR_OBJECT_ACCESS_KEY: access_key
    VECTOR_OBJECT_SECRET_KEY: secret_key
  dynamodb:
    DYNAMODB_ENDPOINT: endpoint
  n8n:
    N8N_INIT_OWNER_PASSWORD: init_owner_password
  gcp-sa:
    GCP_SA_KEY_JSON: key_json_b64
  # 새 backend 비밀값은 여기에 (위 "새 비밀 추가")
  backend-env: {}

# OpenBao 에 base64 로 둔 key — JSON 문자열은 Ansible 이 dict 로 바꿔 버리므로 base64 로 저장 (ESO 가 풀어서 Secret 에 넣음)
base64Keys: [GCP_SA_KEY_JSON]

# seed Job 의 관리자 계정 Secret seed-admin — OpenBao seed-admin 의 속성을 이름 그대로 전부 가져옴 (infra/ansible README 7-5)
seedAdmin:
  enabled: true
