{{- with .Values.migrations.payment }}
{{- if .enabled }}
# 결제 DB 스키마 마이그레이션 (Flyway, backend/apps/payment-service/migrations).
# 앱 Deployment 보다 먼저 실행되는 hook — 실패하면 helm upgrade 가 실패하고 --atomic 이 릴리스를 되돌림.
# 실패한 Job 은 로그 확인을 위해 남기고, 다음 배포 때 before-hook-creation 으로 정리
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-db-migration
  labels:
    {{- include "backend.labels" (dict "root" $ "name" "payment-db-migration") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "backend.labels" (dict "root" $ "name" "payment-db-migration") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "backend.imagePullSecrets" $ | trim | nindent 6 }}
      containers:
        - name: flyway
          image: {{ include "backend.image" (dict "root" $ "image" .image) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["migrate"]
          env:
            {{- range $key := list "PAYMENT_DB_HOST" "PAYMENT_DB_PORT" "PAYMENT_DB_DATABASE" "PAYMENT_DB_USERNAME" "PAYMENT_DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: {{ $key }}
            {{- end }}
            # $(VAR) 는 위에서 정의한 env 를 참조 (k8s 변수 치환)
            - name: FLYWAY_URL
              value: "jdbc:mariadb://$(PAYMENT_DB_HOST):$(PAYMENT_DB_PORT)/$(PAYMENT_DB_DATABASE)"
            - name: FLYWAY_USER
              value: "$(PAYMENT_DB_USERNAME)"
            - name: FLYWAY_PASSWORD
              value: "$(PAYMENT_DB_PASSWORD)"
            - name: FLYWAY_CONNECT_RETRIES
              value: "10"
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- with $.Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
