{{- /* seed Job 의 spec (root 컨텍스트). 아래 Job 이름의 해시를 이 렌더 결과로 만든다 */}}
{{- define "backend.seedJobSpec" -}}
{{- $s := .Values.seed }}
{{- $env := merge (dict) ($s.env | default dict) .Values.global.env -}}
backoffLimit: {{ $s.backoffLimit }}
activeDeadlineSeconds: {{ $s.activeDeadlineSeconds }}
ttlSecondsAfterFinished: {{ $s.ttlSecondsAfterFinished }}
template:
  metadata:
    labels:
      {{- include "backend.labels" (dict "root" . "name" "seed") | nindent 6 }}
  spec:
    restartPolicy: Never
    {{- include "backend.imagePullSecrets" . | trim | nindent 4 }}
    {{- if .Values.serviceAccounts.create }}
    serviceAccountName: seed
    {{- end }}
    {{- with .Values.podSecurityContext }}
    securityContext:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    containers:
      - name: seed
        image: {{ include "backend.image" (dict "root" . "image" $s.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
          {{- range $key := keys $env | sortAlpha }}
          - name: {{ $key }}
            value: {{ tpl (get $env $key | toString) $ | quote }}
          {{- end }}
          {{- range $key := $s.secretEnv }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ $.Values.global.secretName }}
                key: {{ $key }}
          {{- end }}
          {{- if $s.adminSecretName }}
          # 관리자 계정 — 비밀번호가 backend-secrets 와 섞이지 않게 별도 Secret (prod: backend-secrets 앱의 ExternalSecret)
          # 이름은 없으면 seed.ts 기본값('관리자')
          {{- range $key := list "SEED_ADMIN_EMAIL" "SEED_ADMIN_PASSWORD" "SEED_ADMIN_NAME" }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ $s.adminSecretName }}
                key: {{ $key }}
                {{- if eq $key "SEED_ADMIN_NAME" }}
                optional: true
                {{- end }}
          {{- end }}
          {{- end }}
          {{- if $s.db.caConfigMap }}
          - name: DB_SSL
            value: "true"
          - name: DB_SSL_CA_PATH
            value: /certs/{{ $s.db.caFile }}
          {{- end }}
        resources:
          {{- toYaml $s.resources | nindent 10 }}
        {{- with .Values.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if $s.db.caConfigMap }}
        volumeMounts:
          - name: db-ca
            mountPath: /certs
            readOnly: true
    volumes:
      - name: db-ca
        configMap:
          name: {{ $s.db.caConfigMap }}
        {{- end }}
{{- end }}

{{- if .Values.seed.enabled }}
{{- $s := .Values.seed }}
{{- $tag := $s.image.tag | default .Values.global.imageTag | toString }}
{{- $spec := include "backend.seedJobSpec" . }}
{{- $jobName := printf "seed-%s-%s" ($tag | trunc 8) (sha256sum $spec | trunc 6) }}
{{- if .Values.serviceAccounts.create }}
---
# 시드 Job 의 ServiceAccount — IRSA 매핑(prod pod-identity-webhook ConfigMap)은 backend/seed 기준 (객실 사진 올리기)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed
  labels:
    {{- include "backend.labels" (dict "root" $ "name" "seed") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
# 초기 데이터 시딩 (backend/scripts/seed.ts — 관리자 계정 · 호텔 · 객실 · 호실 · 편의시설 · 예약 가능일 · 객실 사진)
# 운영은 DB 를 매일 새로 만들므로 배포 때마다 자동으로 채운다 (LDP-141).
# 온프레미스 dev 도 gitops 에서 켬 — 롤백으로 DB 를 다시 만들면(migrations.*.resetOnDowngrade) 그 버전의 seed.ts 가 다시 채운다
#   (ArgoCD 는 이 Job 을 일반 리소스로 sync — ttlSecondsAfterFinished 로 지워지면 selfHeal 이 다시 만들지만 멱등이라 영향 없음)
#
# hook 이 아닌 일반 Job 이다 — 마이그레이션(pre-install/pre-upgrade hook)이 끝난 뒤 앱 Deployment 와 같이 만들어진다.
#   helm --wait 는 Job 완료를 기다리지 않으므로(--wait-for-jobs 없음) 시드가 실패해도 서비스 배포는 롤백되지 않는다
# Job spec 은 만든 뒤 바꿀 수 없어 이름 = seed-<이미지 태그 8자>-<spec 해시 6자>.
#   이름이 같은 채 spec 만 바뀌면 helm 이 field is immutable 로 실패하고 --atomic 이 backend 릴리스 전체를 되돌린다.
#   새 릴리스 · seed 설정 변경 · 차트 변경이면 새 이름 → 이전 Job 은 helm 이 지우고 새 Job 으로 다시 시딩
# seed.ts 는 멱등(이미 있으면 건너뜀)이라 같은 DB 에 여러 번 돌아도 데이터 · 사진이 늘지 않는다
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "backend.labels" (dict "root" $ "name" "seed") | nindent 4 }}
spec:
  {{- $spec | nindent 2 }}
{{- end }}
