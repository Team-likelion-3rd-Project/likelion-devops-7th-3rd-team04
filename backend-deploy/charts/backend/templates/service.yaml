{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
# 서비스 간 gRPC/HTTP 호출은 <이름>:<포트> (예: user-service:3001) 로 연결
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "backend.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "backend.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: app
      port: {{ $svc.port }}
      targetPort: app
{{- end }}
{{- end }}
