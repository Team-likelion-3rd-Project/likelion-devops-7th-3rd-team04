{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
# 서비스 간 gRPC/HTTP 호출은 <이름>:<포트> (예: user-service:3001) 로 연결
# nodePort 를 지정한 서비스만 NodePort — 클러스터 밖(결제 노드)에서 <노드 IP>:<nodePort> 로도 호출 가능 (ClusterIP 도 그대로 유지)
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "backend.labels" $ctx | nindent 4 }}
spec:
  type: {{ if $svc.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  selector:
    {{- include "backend.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: app
      port: {{ $svc.port }}
      targetPort: app
      {{- with $svc.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
{{- if .Values.grpcHeadless.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (has $name $.Values.grpcHeadless.services) }}
{{- $ctx := dict "root" $ "name" $name }}
---
# gRPC 로드 밸런싱용 Headless Service (LDP-159). 대표 IP 없이 DNS 로 Ready Pod 주소 목록을 알려 준다.
# 클라이언트는 dns:///{{ $name }}-headless:{{ $svc.port }} 로 연결해 요청마다 Pod 를 돌아가며 부른다 (round_robin)
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "backend.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "backend.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: app
      port: {{ $svc.port }}
      targetPort: app
{{- end }}
{{- end }}
{{- end }}
