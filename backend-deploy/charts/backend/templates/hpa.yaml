{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.hpa.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
# metrics-server 필요. HPA 를 켜면 Deployment 에 replicas 를 렌더링하지 않음 (dev ArgoCD 는 HPA 가 바꾼 replicas 를 ignoreDifferences 로 무시)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "backend.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.hpa.minReplicas | default 1 }}
  maxReplicas: {{ $svc.hpa.maxReplicas | default 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.cpuUtilization | default 70 }}
{{- end }}
{{- end }}
