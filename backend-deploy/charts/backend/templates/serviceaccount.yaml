{{- if .Values.serviceAccounts.create }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
# 서비스별 ServiceAccount — IRSA 매핑(prod pod-identity-webhook ConfigMap)은 backend/<서비스 이름> 기준
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "backend.labels" (dict "root" $ "name" $name) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
