# backend 서비스들이 secretEnv 로 읽는 Secret. 값은 OpenBao, key 매핑은 values 의 data
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    {{- range $remote, $keys := .Values.data }}
    {{- range $key, $property := $keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.remotePrefix $remote }}
        property: {{ $property }}
        {{- if has $key $.Values.base64Keys }}
        decodingStrategy: Base64
        {{- end }}
    {{- end }}
    {{- end }}
