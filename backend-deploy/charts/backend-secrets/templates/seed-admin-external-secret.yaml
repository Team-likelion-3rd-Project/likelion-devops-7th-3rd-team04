{{- with .Values.seedAdmin }}
{{- if .enabled }}
# 시드 관리자 계정 (backend 차트 seed.adminSecretName). backend-secrets 와 따로 두는 이유:
#   이 값이 없거나 읽지 못해도 서비스용 Secret(backend-secrets) 동기화는 영향을 받지 않고 seed Job 만 기다린다
# 매핑 없이 경로의 속성을 모두 이름 그대로 가져옴 → 속성 이름 = 환경변수 이름 (SEED_ADMIN_EMAIL, SEED_SEOUL_MANAGER_PASSWORD …)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.clusterSecretStore }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $.Values.remotePrefix .remotePath }}
{{- end }}
{{- end }}
