# 온프레미스 GitLab(team04/hotel) 파이프라인 — GitHub 에서 관리하고 미러(.github/workflows/mirror-gitlab.yml)로 전달됩니다.
# GitLab 쪽에서 직접 고치면 다음 미러링 때 덮어써집니다.
#
#   test        : lint · jest (현재 기존 실패가 있어 non-blocking) · nest build · helm lint
#                 frontend:build: 프론트 변경 시 운영 값(VITE_PAYMENT_MODE 만 MOCK)으로 lint · 빌드 검증 (배포 없음)
#   build       : kaniko 로 이미지 10개 빌드 → 후보 태그 ci-<sha> 로 push (develop 만, 그 외는 빌드만)
#   image-test  : 파이프라인 전용 DB(ci_<id>, ci_main_<id>) 준비 → 후보 이미지를 띄워 /health smoke test
#   push        : 통과한 후보를 최종 태그 <sha> 로 승격 (crane tag — 레이어 재업로드 없음)
#                 push:ghcr: 승격한 이미지를 GHCR 에 커밋 SHA 40자 태그로 복사 — 운영 릴리스가 ECR 로 옮겨 갈 원본
#                 ghcr:reuse-resolve · push:ghcr-reuse: 프론트만 바뀐 커밋은 백엔드가 같은 직전 커밋의 GHCR 이미지에 이 SHA 태그를 붙임
#                 (보존: .github/workflows/ghcr-retention.yml, infra/ansible README 12-4)
#
# 백엔드 경로(.paths backend)가 바뀐 커밋은 백엔드 job 이, 프론트 경로(.paths frontend)가 바뀐 커밋은 frontend:build 가 돈다.
# 프론트만 바뀐 커밋에는 백엔드 빌드 · smoke test · deploy-dev 가 없다 (Run pipeline 으로 실행하면 전체가 돈다).
#   deploy      : (수동) deploy-dev: develop → GitLab gitops 에 커밋 1개 (envs/dev 이미지 태그 + apps/dev 차트 revision)
#                 + 배포 태그 dev/p<pipeline id>-<sha> → 온프레미스 ArgoCD 가 sync (클러스터에 직접 배포하지 않음)
#                 롤백: Run pipeline 에 ROLLBACK_TO=<gitops 태그 | previous> → rollback-dev:resolve · check → rollback-dev ▶
#                 (롤백 파이프라인에는 다른 job 이 생기지 않음. infra/ansible README 12-5)
#
# main 파이프라인은 없습니다. 운영 릴리스는 GitHub Actions(.github/workflows/release.yml)가 main push 때 위 push:ghcr 이미지를
# 재빌드 없이 ECR 로 복사하고 prod gitops 레포에 PR 을 만듭니다 (infra/gitops/prod/README.md "릴리스").
# 그래서 릴리스할 커밋의 develop 파이프라인이 push:ghcr(· push:ghcr-reuse)까지 통과해야 합니다.
#
# 파이프라인은 클러스터에 접근하지 않습니다 (kubeconfig · GitLab Agent 없음). 배포 구성은 infra/ansible/README.md 12절.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "push" && $CI_PIPELINE_SOURCE != "web"
      when: never
    # main 은 GitHub Actions release.yml 이 릴리스한다 (GitLab 에서 할 일 없음)
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
    # 아래 .paths 의 backend + frontend (workflow 는 anchor 보다 앞이라 직접 나열)
    #   ⚠️ infra/gitops/scripts/image-sha.sh 의 WORKFLOW_PATHS 와 같아야 함 — 운영 릴리스(release.yml)가 이 경로를 마지막으로 바꾼
    #      커밋(= 파이프라인이 돌아 GHCR 이미지가 있는 커밋)의 이미지를 ECR 로 복사하고, ghcr-retention.yml 이 그 태그를 보존
    - changes:
        - backend/**/*
        - backend-deploy/**/*
        - langchain_rag/**/*
        - frontend/**/*
        - infra/gitops/prod/frontend/**/*
        - .gitlab-ci.yml
  auto_cancel:
    on_new_commit: interruptible

stages:
  - test
  - build
  - image-test
  - push
  - deploy

variables:
  # ── 이미지 버전 고정 ──
  NODE_IMAGE: node:20-alpine
  # kaniko 업스트림은 2025년 archive — 마지막 릴리스로 고정. 문제가 생기면 buildah 로 교체
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  CRANE_IMAGE: gcr.io/go-containerregistry/crane/debug:v0.20.3
  # kubectl · helm · yq · git 포함. kubectl 은 클러스터(v1.33)와 맞춤
  DEPLOY_IMAGE: alpine/k8s:1.33.4
  # DB 노드(infra/ansible group_vars/db.yml)와 같은 버전
  MARIADB_IMAGE: mariadb:11.4.13
  SMOKE_CLIENT_IMAGE: alpine:3.22
  # llm-service(langchain_rag/llm-service/Dockerfile 의 베이스와 같은 버전)
  PYTHON_IMAGE: python:3.12-slim
  # n8n 은 빌드하지 않고 Docker Hub 이미지를 레지스트리로 미러링 (온프레미스: push job, 운영 ECR: release.yml).
  # 차트 n8n.image.tag · langchain_rag/docker-compose.yml 과 같은 값으로 올림
  N8N_VERSION: "2.35.3"

  # ── 이미지 태그: 커밋 SHA (latest 미사용) ──
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  CANDIDATE_TAG: ci-$CI_COMMIT_SHORT_SHA
  # build 와 push 가 같은 목록을 써야 함 (8 서비스 + llm-service + 메인 / 결제 DB 마이그레이션 + 시딩)
  #   seed: backend 차트 seed Job (backend/scripts/Dockerfile.seed) — 운영과 온프레미스 dev 모두 배포 버전과 같은 태그로 실행
  #         (dev 는 롤백으로 DB 를 다시 만든 뒤 그 버전의 seed.ts 가 다시 채움)
  #   ⚠️ .github/workflows/release.yml 의 IMAGES 와 같아야 함 (GHCR → ECR 복사 목록)
  IMAGES: "api-gateway auth-service booking-service chat-bot-service hotel-service payment-service pg-mock-service user-service llm-service main-migrations payment-migrations seed"

  # ── GHCR: develop 을 통과한 이미지의 운영 릴리스용 사본 (push:ghcr) ──
  # GHCR 은 소문자 이름만 받음. 저장소 이름은 ECR(team04-hotel/<서비스>)과 같은 구조
  GHCR_IMAGE_PREFIX: ghcr.io/team-likelion-3rd-project/team04-hotel
  # 이미지 label org.opencontainers.image.source — GHCR 이 이 값으로 패키지를 모노레포에 연결 (Actions GITHUB_TOKEN 접근)
  GITHUB_REPO_URL: https://github.com/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team04

  # ── 차트 (helm-lint) · 배포 ──
  CHART_PATH: backend-deploy/charts/backend
  HELM_RELEASE: backend
  K8S_NAMESPACE: backend
  # dev 전용 gitops 레포 (prod 는 GitHub 별도 레포). ArgoCD 가 이 레포를 sync
  GITOPS_REPO: team04/infra/backend-gitops

  # ── smoke test: dev DB 서버를 쓰되 database 는 파이프라인 전용 ──
  # 후보 이미지의 마이그레이션을 빈 DB 에 처음부터 적용해 보고 그 위에서 앱을 띄움 (dev 데이터와 분리).
  # Flyway 히스토리는 DB 당 하나라 메인 / 결제 마이그레이션을 서로 다른 DB 에 적용 (ci_ 접두어 = ci_smoke 권한 범위)
  SMOKE_DB: ci_$CI_PIPELINE_ID
  SMOKE_MAIN_DB: ci_main_$CI_PIPELINE_ID
  SMOKE_REDIS_DB: "15"

  GIT_DEPTH: "20"

default:
  interruptible: true

# ── 공통 rules ─────────────────────────────────────────────
# job 을 나누는 변경 경로. rules:changes 는 push 가 아닌 파이프라인(Run pipeline · 롤백)에서는 항상 참
#   backend : 백엔드 이미지에 들어가는 경로 — ghcr:reuse-resolve 의 git diff 경로, release-plan.sh BACKEND_PATHS ·
#             release.yml BACKEND_PATHS(운영 릴리스의 백엔드 변경 판단)와 같게 유지
#   frontend: 프론트 소스 + 운영 빌드 값(infra/gitops/prod/frontend/values.yaml)
.paths:
  backend: &backend-paths
    - backend/**/*
    - backend-deploy/**/*
    - langchain_rag/**/*
    - .gitlab-ci.yml
  frontend: &frontend-paths
    - frontend/**/*
    - infra/gitops/prod/frontend/**/*
    - .gitlab-ci.yml

# 롤백 파이프라인(Run pipeline + ROLLBACK_TO)에는 rollback-dev:* 만 생긴다 — 아래 rules 와 smoke:db-drop · deploy-dev 에서 제외
.rules-develop:
  rules:
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *backend-paths

# main 파이프라인은 workflow 가 이미 막는다 (main 은 release.yml). job 에서도 한 번 더 제외
.rules-not-main:
  rules:
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - changes: *backend-paths

.backend-npm:
  image: $NODE_IMAGE
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [backend/package-lock.json]
    paths: [.npm/]
    policy: pull-push
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund

# ── test ──────────────────────────────────────────────────
# lint / jest 는 기존 코드의 실패가 남아 있어 우선 non-blocking. 정리되면 allow_failure 를 지웁니다.
lint:
  extends: [.backend-npm, .rules-not-main]
  stage: test
  needs: []
  script:
    - npx eslint "{src,apps,libs,test}/**/*.ts"
  allow_failure: true

test:unit:
  extends: [.backend-npm, .rules-not-main]
  stage: test
  needs: []
  script:
    - npm test -- --runInBand --passWithNoTests
  allow_failure: true

compile:
  extends: [.backend-npm, .rules-not-main]
  stage: test
  needs: []
  script:
    - npx nest build common
    - for app in api-gateway auth-service booking-service chat-bot-service hotel-service payment-service pg-mock-service user-service; do npx nest build "$app"; done

# llm-service(Python) 단위 테스트 — 의도 검증 · 벡터 스토어 · LLM 공급자 선택 (외부 호출 없음)
test:llm-service:
  extends: .rules-not-main
  stage: test
  image: $PYTHON_IMAGE
  needs: []
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip
  cache:
    key:
      files: [langchain_rag/llm-service/requirements.txt]
    paths: [.pip/]
  script:
    - cd langchain_rag/llm-service
    - pip install -q -r requirements-dev.txt
    - python -m pytest tests -q

helm-lint:
  extends: .rules-not-main
  stage: test
  image: $DEPLOY_IMAGE
  needs: []
  script:
    - helm lint "$CHART_PATH" --set global.imageTag=lint
    - helm template "$HELM_RELEASE" "$CHART_PATH" -n "$K8S_NAMESPACE" --set global.imageTag=lint --set ingress.enabled=true > /dev/null
    # dev 의 결제 노드 연동(booking-service / pg-mock-service NodePort) 렌더링
    - helm template "$HELM_RELEASE" "$CHART_PATH" -n "$K8S_NAMESPACE" --set global.imageTag=lint --set services.booking-service.nodePort=30303 > /dev/null
    # dev 의 챗봇 AI 스택(llm-service · n8n) 렌더링
    - helm template "$HELM_RELEASE" "$CHART_PATH" -n "$K8S_NAMESPACE" --set global.imageTag=lint --set services.llm-service.enabled=true --set n8n.enabled=true > /dev/null
    # dev 의 Prometheus 메트릭(METRICS_PORT · PodMonitor) 렌더링
    - helm template "$HELM_RELEASE" "$CHART_PATH" -n "$K8S_NAMESPACE" --set global.imageTag=lint --set metrics.enabled=true --set services.llm-service.enabled=true > /dev/null
    # dev 의 롤백 대비(마이그레이션 resetOnDowngrade) · 시딩 Job 렌더링
    - helm template "$HELM_RELEASE" "$CHART_PATH" -n "$K8S_NAMESPACE" --set global.imageTag=lint --set migrations.main.resetOnDowngrade=true --set seed.enabled=true > /dev/null
    # 차트의 n8n 워크플로 · 활성화 스크립트(files/n8n)는 langchain_rag/n8n 의 사본 — 원본만 고치고 복사를 잊지 않도록 검사
    - |
      for pair in "workflows/chat-orchestration.json:chat-orchestration.json" "scripts/activate-workflow.js:activate-workflow.js"; do
        src="langchain_rag/n8n/${pair%%:*}"; dst="$CHART_PATH/files/n8n/${pair##*:}"
        # 원본은 CRLF 로 커밋돼 있을 수 있어 줄끝을 맞춘 뒤 비교 (POSIX sh 라 프로세스 치환 대신 임시 파일)
        tr -d '\r' < "$src" > /tmp/src; tr -d '\r' < "$dst" > /tmp/dst
        if ! cmp -s /tmp/src /tmp/dst; then
          echo "$dst 가 $src 와 다릅니다 — 원본을 복사해 커밋하세요"; exit 1
        fi
      done
    # 결제 마이그레이션 이미지의 migrate.sh 는 메인 쪽 사본 (빌드 컨텍스트가 달라서)
    - |
      tr -d '\r' < backend/migrations/migrate.sh > /tmp/src; tr -d '\r' < backend/apps/payment-service/migrations/migrate.sh > /tmp/dst
      if ! cmp -s /tmp/src /tmp/dst; then
        echo "backend/apps/payment-service/migrations/migrate.sh 가 backend/migrations/migrate.sh 와 다릅니다 — 원본을 복사해 커밋하세요"; exit 1
      fi

# 프론트 빌드 검증 — 운영 빌드 값(infra/gitops/prod/frontend/values.yaml)으로 빌드하되 결제만 MOCK
#   TOSS 모드(토스 클라이언트 키)는 키가 있는 운영 릴리스 쪽에서 검증. 빌드 결과는 배포하지 않음 (각자 로컬 Vite)
#   실패하면 파이프라인이 실패 → 릴리스 전 "develop 파이프라인 passed" 확인에 프론트도 포함
frontend:build:
  stage: test
  image: $NODE_IMAGE
  needs: []
  rules:
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - changes: *frontend-paths
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
    FRONTEND_PAYMENT_MODE: MOCK
    FRONTEND_LINT: "true"
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.npm/]
  script:
    - apk add --no-cache yq-go > /dev/null
    - sh infra/gitops/scripts/frontend-build.sh

# ── build: kaniko (Docker 데몬 / DinD 불필요) ────────────────────
build:
  extends: .rules-not-main
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  needs: [compile, helm-lint]
  parallel:
    matrix:
      - SERVICE:
          - api-gateway
          - auth-service
          - booking-service
          - chat-bot-service
          - hotel-service
          - payment-service
          - pg-mock-service
          - user-service
          - llm-service
          - main-migrations
          - payment-migrations
          - seed
  script:
    - |
      if [ "$SERVICE" = "llm-service" ]; then
        CONTEXT="$CI_PROJECT_DIR/langchain_rag/llm-service"
        DOCKERFILE="$CONTEXT/Dockerfile"
      elif [ "$SERVICE" = "main-migrations" ]; then
        CONTEXT="$CI_PROJECT_DIR/backend/migrations"
        DOCKERFILE="$CONTEXT/Dockerfile"
      elif [ "$SERVICE" = "payment-migrations" ]; then
        CONTEXT="$CI_PROJECT_DIR/backend/apps/payment-service/migrations"
        DOCKERFILE="$CONTEXT/Dockerfile"
      elif [ "$SERVICE" = "seed" ]; then
        # 시딩(scripts/seed.ts) — 차트 seed Job 이 배포 버전과 같은 태그로 실행
        CONTEXT="$CI_PROJECT_DIR/backend"
        DOCKERFILE="$CONTEXT/scripts/Dockerfile.seed"
      else
        CONTEXT="$CI_PROJECT_DIR/backend"
        DOCKERFILE="$CONTEXT/apps/$SERVICE/Dockerfile"
      fi
    # 사설 CA 를 쓰는 경우 Runner 가 넘겨주는 CA 를 신뢰 (기본 구성에서는 비어 있음)
    - if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then cat "$CI_SERVER_TLS_CA_FILE" >> /kaniko/ssl/certs/ca-certificates.crt; fi
    - mkdir -p /kaniko/.docker
    - >-
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY"
      "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      > /kaniko/.docker/config.json
    # develop 만 후보 태그로 push. 작업 브랜치는 빌드 검증만
    - |
      if [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        set -- --destination "$CI_REGISTRY_IMAGE/$SERVICE:$CANDIDATE_TAG"
      else
        set -- --no-push
      fi
      /kaniko/executor \
        --context "$CONTEXT" \
        --dockerfile "$DOCKERFILE" \
        --cache=true --cache-repo "$CI_REGISTRY_IMAGE/cache/$SERVICE" --cache-ttl=168h \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$GITHUB_REPO_URL" \
        "$@"

# ── image-test: 후보 이미지 smoke test ─────────────────────────
smoke:db-create:
  extends: .rules-develop
  stage: image-test
  image: $MARIADB_IMAGE
  needs: []
  script:
    - export MYSQL_PWD="$SMOKE_DB_PASSWORD"
    - |
      for db in "$SMOKE_DB" "$SMOKE_MAIN_DB"; do
        mariadb -h "$SMOKE_DB_HOST" -P "$SMOKE_DB_PORT" -u "$SMOKE_DB_USER" -e "CREATE DATABASE IF NOT EXISTS \`$db\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      done

# 마이그레이션 이미지를 전용 DB 에 먼저 적용 (마이그레이션 자체 검증 겸 앱 기동 준비 — 앱은 synchronize: false)
#   main    : backend/migrations                 → $SMOKE_MAIN_DB (user/auth/hotel/booking)
#   payment : apps/payment-service/migrations    → $SMOKE_DB      (payment-service)
smoke:migrate:
  extends: .rules-develop
  stage: image-test
  image:
    name: $CI_REGISTRY_IMAGE/$MIGRATIONS-migrations:$CANDIDATE_TAG
    entrypoint: [""]
  parallel:
    matrix:
      - MIGRATIONS: [main, payment]
  needs:
    - smoke:db-create
    - job: build
      parallel:
        matrix:
          - SERVICE: main-migrations
          - SERVICE: payment-migrations
  variables:
    GIT_STRATEGY: none
    # 이미지 진입점(migrate.sh)을 그대로 거치게 해 dev 와 같은 경로로 검증 (빈 DB 라 되돌릴 버전은 없음)
    MIGRATE_RESET_ON_DOWNGRADE: "true"
  script:
    - if [ "$MIGRATIONS" = "main" ]; then DB="$SMOKE_MAIN_DB"; else DB="$SMOKE_DB"; fi
    - >-
      /flyway/migrate.sh migrate
      -url="jdbc:mariadb://$SMOKE_DB_HOST:$SMOKE_DB_PORT/$DB"
      -user="$SMOKE_DB_USER" -password="$SMOKE_DB_PASSWORD"
      -connectRetries=5

# 시딩 이미지가 이 커밋의 메인 DB 스키마에 맞는지 (seed.ts 는 스키마와 같이 바뀌어야 함 — 롤백 후 그 버전 데이터를 다시 채우는 이미지)
# 객실 사진(S3_*) · 관리자 계정(SEED_ADMIN_*)은 넣지 않아 그 단계는 건너뜀
smoke:seed:
  extends: .rules-develop
  stage: image-test
  image:
    name: $CI_REGISTRY_IMAGE/seed:$CANDIDATE_TAG
    entrypoint: [""]
  needs:
    - job: smoke:migrate
      parallel:
        matrix:
          - MIGRATIONS: main
    - job: build
      parallel:
        matrix:
          - SERVICE: seed
  variables:
    GIT_STRATEGY: none
    DB_HOST: $SMOKE_DB_HOST
    DB_PORT: $SMOKE_DB_PORT
    DB_USERNAME: $SMOKE_DB_USER
    DB_PASSWORD: $SMOKE_DB_PASSWORD
    DB_DATABASE: $SMOKE_MAIN_DB
    SEED_AVAILABILITY_DAYS: "7"
  script:
    - cd /usr/src/app
    # 두 번 실행해 멱등(두 번째는 "이미 존재 — 건너뜀")까지 확인
    - npx ts-node --transpile-only -r tsconfig-paths/register scripts/seed.ts
    - npx ts-node --transpile-only -r tsconfig-paths/register scripts/seed.ts

test:image:
  extends: .rules-develop
  stage: image-test
  image: $SMOKE_CLIENT_IMAGE
  needs: [build, smoke:migrate]
  parallel:
    matrix:
      - SERVICE:
          - api-gateway
          - auth-service
          - booking-service
          - chat-bot-service
          - hotel-service
          - payment-service
          - pg-mock-service
          - user-service
          - llm-service
  # job 변수는 service 컨테이너(app)에도 전달됨 → 앱 환경변수
  services:
    - name: $CI_REGISTRY_IMAGE/$SERVICE:$CANDIDATE_TAG
      alias: app
  variables:
    GIT_STRATEGY: none
    # 실패 시 앱 로그를 job 로그에 출력
    CI_DEBUG_SERVICES: "true"
    NODE_ENV: production
    DB_HOST: $SMOKE_DB_HOST
    DB_PORT: $SMOKE_DB_PORT
    DB_USERNAME: $SMOKE_DB_USER
    DB_PASSWORD: $SMOKE_DB_PASSWORD
    DB_DATABASE: $SMOKE_MAIN_DB
    PAYMENT_DB_HOST: $SMOKE_DB_HOST
    PAYMENT_DB_PORT: $SMOKE_DB_PORT
    PAYMENT_DB_USERNAME: $SMOKE_DB_USER
    PAYMENT_DB_PASSWORD: $SMOKE_DB_PASSWORD
    PAYMENT_DB_DATABASE: $SMOKE_DB
    REDIS_HOST: $SMOKE_DB_HOST
    REDIS_PORT: $SMOKE_REDIS_PORT
    REDIS_PASSWORD: $SMOKE_REDIS_PASSWORD
    REDIS_DB: $SMOKE_REDIS_DB
    REDIS_TLS: "false"
    # 기동 시 필수값(getRequiredEnv) — smoke test 전용 더미
    JWT_ACCESS_SECRET: ci-smoke-access-secret
    JWT_REFRESH_SECRET: ci-smoke-refresh-secret
    JWT_ACCESS_EXPIRES_IN: 15m
    JWT_REFRESH_EXPIRES_IN: 7d
    JWT_REFRESH_ABSOLUTE_MAX_DAYS: "30"
    MOCK_PG_SECRET: ci-smoke-mock-pg-secret
    N8N_WEBHOOK_URL: http://n8n.invalid/webhook/chat
    DYNAMODB_REGION: ap-northeast-2
    # 서비스 간 호출 대상 (smoke test 에서는 연결하지 않음 — 기동만 확인)
    USER_SERVICE_HOST: user-service:3001
    HOTEL_SERVICE_HOST: hotel-service:3002
    BOOKING_SERVICE_HOST: booking-service:3003
    PAYMENT_SERVICE_HOST: payment-service:3004
    CHAT_BOT_SERVICE_HOST: chat-bot-service:3005
    AUTH_SERVICE_HOST: auth-service:3006
    PG_MOCK_SERVICE_URL: http://pg-mock-service:3007
    # llm-service: 외부(Ollama · Vertex · 벡터 스토어) 없이 기동 · /health 만 확인 (클라이언트는 첫 요청 때 생성)
    LLM_PROVIDER: ollama
    VECTOR_STORE: none
  script:
    # 헬스체크 포트: HTTP 서비스는 서비스 포트, gRPC 서비스는 gRPC 포트 + 100 (차트 values.yaml 의 healthPort 와 같음)
    - |
      case "$SERVICE" in
        api-gateway)      HEALTH_PORT=3000 ;;
        user-service)     HEALTH_PORT=3101 ;;
        hotel-service)    HEALTH_PORT=3102 ;;
        booking-service)  HEALTH_PORT=3103 ;;
        payment-service)  HEALTH_PORT=3104 ;;
        chat-bot-service) HEALTH_PORT=3105 ;;
        auth-service)     HEALTH_PORT=3106 ;;
        pg-mock-service)  HEALTH_PORT=3007 ;;
        llm-service)      HEALTH_PORT=8000 ;;
        *) echo "알 수 없는 서비스: $SERVICE"; exit 1 ;;
      esac
    - |
      for i in $(seq 1 45); do
        if wget -q -T 3 -O - "http://app:$HEALTH_PORT/health"; then
          echo; echo "$SERVICE:$CANDIDATE_TAG /health OK (${i}회차)"; exit 0
        fi
        sleep 2
      done
      echo "$SERVICE 이 90초 안에 /health 에 응답하지 않음 — 위의 service 로그(app)를 확인하세요"; exit 1

# 파이프라인 결과와 관계없이 전용 DB 삭제 (남은 ci_% 는 README 12-5 의 정리 쿼리)
smoke:db-drop:
  stage: .post
  image: $MARIADB_IMAGE
  # needs 를 지정하면 .post 라도 바로 시작되므로 지정하지 않음 (모든 stage 가 끝난 뒤 실행)
  interruptible: false
  rules:
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *backend-paths
      when: always
  variables:
    GIT_STRATEGY: none
  script:
    - export MYSQL_PWD="$SMOKE_DB_PASSWORD"
    - |
      for db in "$SMOKE_DB" "$SMOKE_MAIN_DB"; do
        mariadb -h "$SMOKE_DB_HOST" -P "$SMOKE_DB_PORT" -u "$SMOKE_DB_USER" -e "DROP DATABASE IF EXISTS \`$db\`"
      done

# ── push: 후보 → 최종 태그 승격 ───────────────────────────────
# 모든 smoke test 가 통과해야 실행 (같은 커밋의 이미지 10개를 한 번에 배포하므로 전부 함께 승격)
push:
  extends: .rules-develop
  stage: push
  image:
    name: $CRANE_IMAGE
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - |
      for svc in $IMAGES; do
        crane tag "$CI_REGISTRY_IMAGE/$svc:$CANDIDATE_TAG" "$IMAGE_TAG"
        echo "$CI_REGISTRY_IMAGE/$svc:$IMAGE_TAG  ($(crane digest "$CI_REGISTRY_IMAGE/$svc:$IMAGE_TAG"))"
      done
    # n8n: Docker Hub 이미지를 버전 태그 그대로 미러링 (클러스터는 레지스트리에서만 pull). 이미 있으면 건너뜀
    - |
      if crane digest "$CI_REGISTRY_IMAGE/n8n:$N8N_VERSION" > /dev/null 2>&1; then
        echo "$CI_REGISTRY_IMAGE/n8n:$N8N_VERSION 이미 있음"
      else
        crane copy "docker.io/n8nio/n8n:$N8N_VERSION" "$CI_REGISTRY_IMAGE/n8n:$N8N_VERSION" --platform linux/amd64
      fi

# 승격한 이미지를 GHCR 로 복사 — 운영 릴리스(GitHub Actions)가 Tailscale 없이 GHCR → ECR 로 옮김. 재빌드 없이 같은 digest
#   태그 = 커밋 SHA 40자 (release/* 가 가리키는 develop 커밋과 바로 대응). 이미 있으면 건너뜀 (재시도 멱등)
#   deploy-dev 는 push 만 기다림 — GHCR 장애가 dev 배포를 막지 않음. n8n 은 운영이 Docker Hub 에서 직접 옮김
#   GHCR_USER · GHCR_TOKEN: 봇 계정 classic PAT(write:packages) — OpenBao ghcr-push → gitlab.yml --tags bootstrap (README 12-4)
push:ghcr:
  extends: .rules-develop
  stage: push
  image:
    name: $CRANE_IMAGE
    entrypoint: [""]
  needs: [push]
  interruptible: false
  retry: 1
  variables:
    GIT_STRATEGY: none
  script:
    - 'test -n "${GHCR_TOKEN:-}" || { echo "CI 변수 GHCR_USER · GHCR_TOKEN 이 없습니다 — infra/ansible README 12-4 (OpenBao ghcr-push → gitlab.yml --tags bootstrap)"; exit 1; }'
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    # 토큰을 명령 인자로 넘기지 않음
    - printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io -u "$GHCR_USER" --password-stdin
    - |
      for svc in $IMAGES; do
        dst="$GHCR_IMAGE_PREFIX/$svc:$CI_COMMIT_SHA"
        src_digest="$(crane digest "$CI_REGISTRY_IMAGE/$svc:$IMAGE_TAG")"
        dst_digest="$(crane digest "$dst" 2>/dev/null || true)"
        if [ "$dst_digest" = "$src_digest" ]; then
          echo "이미 있음: $dst"
        else
          # 같은 커밋을 새 파이프라인으로 다시 빌드하면 digest 가 달라짐 — 이번에 승격한 이미지로 맞춤
          [ -z "$dst_digest" ] || echo "덮어씀: $dst ($dst_digest → $src_digest)"
          crane copy "$CI_REGISTRY_IMAGE/$svc:$IMAGE_TAG" "$dst"
          dst_digest="$(crane digest "$dst")"
        fi
        [ "$src_digest" = "$dst_digest" ] || { echo "$svc digest 불일치 — GitLab $src_digest / GHCR $dst_digest"; exit 1; }
        echo "$dst  ($dst_digest)"
      done

# ── 프론트만 바뀐 develop 커밋: 직전 이미지 재태깅 ─────────────────
# 이 커밋에는 백엔드 빌드가 없지만 릴리스 커밋으로 고를 수 있어야 함 (운영 릴리스는 GHCR <svc>:<release SHA> 를 찾음).
# 백엔드 경로가 이 커밋과 같은 직전 develop 커밋(first-parent)의 GHCR 이미지에 이 커밋 SHA 태그를 추가 — 같은 digest, 업로드 없음.
# smoke test 는 그 커밋 파이프라인에서 통과한 이미지라 다시 돌리지 않음
.rules-frontend-only:
  rules:
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *backend-paths
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"

# 후보: first-parent 로 거슬러 올라가며 백엔드 경로(.paths backend)가 이 커밋과 같은 커밋들 (처음 달라지는 곳에서 멈춤)
ghcr:reuse-resolve:
  extends: .rules-frontend-only
  stage: push
  image: $DEPLOY_IMAGE
  needs: [frontend:build]
  interruptible: false
  variables:
    GIT_DEPTH: "50"
  script:
    - |
      set -eu
      candidates=""
      for c in $(git rev-list --first-parent --max-count=30 HEAD^); do
        git diff --quiet "$c" HEAD -- backend backend-deploy langchain_rag .gitlab-ci.yml || break
        candidates="$candidates $c"
      done
      [ -n "$candidates" ] || { echo "백엔드가 이 커밋과 같은 직전 develop 커밋이 없습니다 (최근 30개 · clone 깊이 50) — develop 에서 Run pipeline 으로 전체 파이프라인을 실행하세요"; exit 1; }
      echo "REUSE_CANDIDATES=$(echo $candidates)" > reuse.env
      echo "후보(최신순):$candidates"
  artifacts:
    reports:
      dotenv: reuse.env
    expire_in: 1 day

# 후보 중 GHCR 에 12개 이미지가 모두 있는 첫 커밋(= 그 파이프라인 통과)을 base 로 → 이 커밋 SHA 태그 추가
push:ghcr-reuse:
  extends: .rules-frontend-only
  stage: push
  image:
    name: $CRANE_IMAGE
    entrypoint: [""]
  needs: [ghcr:reuse-resolve]
  interruptible: false
  retry: 1
  variables:
    GIT_STRATEGY: none
  script:
    - 'test -n "${GHCR_TOKEN:-}" || { echo "CI 변수 GHCR_USER · GHCR_TOKEN 이 없습니다 — infra/ansible README 12-4 (OpenBao ghcr-push → gitlab.yml --tags bootstrap)"; exit 1; }'
    - printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io -u "$GHCR_USER" --password-stdin
    - |
      base=""
      for c in $REUSE_CANDIDATES; do
        missing=""
        for svc in $IMAGES; do
          crane digest "$GHCR_IMAGE_PREFIX/$svc:$c" > /dev/null 2>&1 || { missing="$svc"; break; }
        done
        if [ -z "$missing" ]; then base="$c"; break; fi
        echo "$c: GHCR 에 $missing 없음 — 이전 후보 확인"
      done
      [ -n "$base" ] || { echo "후보 커밋 모두 GHCR 이미지가 없습니다 (그 파이프라인이 통과하지 않음) — develop 에서 Run pipeline 으로 전체 파이프라인을 실행하세요"; exit 1; }
      echo "base: $base → $CI_COMMIT_SHA"
      for svc in $IMAGES; do
        crane tag "$GHCR_IMAGE_PREFIX/$svc:$base" "$CI_COMMIT_SHA"
        echo "$GHCR_IMAGE_PREFIX/$svc:$CI_COMMIT_SHA  ($(crane digest "$GHCR_IMAGE_PREFIX/$svc:$CI_COMMIT_SHA"))"
      done

# ── deploy (수동) ─────────────────────────────────────────────
# gitops 레포(dev) 에 커밋 1개 + 배포 태그 1개를 만듭니다. 클러스터 반영은 ArgoCD 의 backend Application(자동 sync)이 합니다 (infra/ansible README 12-9)
#   envs/<env>/values.yaml    global.imageTag                 = DEPLOY_IMAGE_TAG (이미지 태그 = 모노레포 short SHA)
#   apps/<env>/backend.yaml   spec.sources[0].targetRevision  = DEPLOY_CHART_REV (차트도 이미지와 같은 커밋에 고정)
#   태그 <env>/p<pipeline id>-<이미지 태그> (annotated) — 메시지에 pipeline · job · 모노레포 commit · 실행자. 어느 파이프라인의 배포인지,
#        롤백 대상(ROLLBACK_TO)을 이 이름으로 가리킴. 같은 파이프라인의 job 을 다시 실행하면 같은 이름으로 갱신
# job 성공 = gitops 커밋 성공. 배포 결과(sync · health · 마이그레이션 hook · seed Job)는 ArgoCD UI 에서 확인합니다.
# deploy-dev 와 rollback-dev 가 이 job 을 같이 씀 (DEPLOY_KIND = deploy | rollback)
.gitops-commit:
  stage: deploy
  image: $DEPLOY_IMAGE
  interruptible: false
  variables:
    # 모노레포 체크아웃 불필요 (gitops 레포만 clone)
    GIT_STRATEGY: none
  script:
    - |
      set -eu
      git config --global user.name "GitLab CI ($CI_PROJECT_PATH)"
      git config --global user.email "ci@$CI_SERVER_HOST"
      git clone --depth 20         "$CI_SERVER_PROTOCOL://ci-gitops:${GITOPS_PUSH_TOKEN}@$CI_SERVER_HOST/$GITOPS_REPO.git" gitops
      VALUES="gitops/envs/$GITOPS_ENV/values.yaml"
      APP="gitops/apps/$GITOPS_ENV/backend.yaml"
      DEPLOY_TAG="$GITOPS_ENV/p$CI_PIPELINE_ID-$DEPLOY_IMAGE_TAG"

      # sources[0] 이 차트 source 인지 확인 (순서가 바뀌면 values source 의 브랜치를 SHA 로 덮어쓰게 됨)
      CHART_SOURCE_PATH="$(yq '.spec.sources[0].path' "$APP")"
      if [ "$CHART_SOURCE_PATH" != "$CHART_PATH" ]; then
        echo "$APP 의 sources[0].path 가 $CHART_PATH 가 아닙니다 ($CHART_SOURCE_PATH) — 차트 source 를 첫 번째로 두세요"; exit 1
      fi

      yq -i ".global.imageTag = \"$DEPLOY_IMAGE_TAG\"" "$VALUES"
      yq -i ".spec.sources[0].targetRevision = \"$DEPLOY_CHART_REV\"" "$APP"
      if git -C gitops diff --quiet; then
        CURRENT_TAGS="$(git -C gitops tag --points-at HEAD -l "$GITOPS_ENV/p*" | tr '\n' ' ')"
        echo "gitops 가 이미 $DEPLOY_IMAGE_TAG — 변경 없음 (ArgoCD 가 지금 상태를 유지, 현재 배포 태그: ${CURRENT_TAGS:-없음})"
        exit 0
      fi

      if [ "$DEPLOY_KIND" = "rollback" ]; then
        SUBJECT="chore(gitops): $GITOPS_ENV backend rollback → $DEPLOY_IMAGE_TAG (from $ROLLBACK_FROM)"
      else
        SUBJECT="chore(gitops): $GITOPS_ENV backend → $DEPLOY_IMAGE_TAG"
      fi
      git -C gitops commit -qam "$SUBJECT" -m "pipeline: $CI_PIPELINE_URL" -m "commit: $CI_PROJECT_URL/-/commit/$DEPLOY_CHART_REV"

      TAG_MESSAGE="$(printf '%s\n\nkind: %s\nimage tag: %s\nchart revision: %s\npipeline: %s\njob: %s\ncommit: %s\nby: %s' \
        "$SUBJECT" "$DEPLOY_KIND" "$DEPLOY_IMAGE_TAG" "$DEPLOY_CHART_REV" "$CI_PIPELINE_URL" "$CI_JOB_URL" \
        "$CI_PROJECT_URL/-/commit/$DEPLOY_CHART_REV" "${GITLAB_USER_LOGIN:-unknown}")"
      if [ "$DEPLOY_KIND" = "rollback" ]; then TAG_MESSAGE="$(printf '%s\nrollback from: %s' "$TAG_MESSAGE" "$ROLLBACK_FROM")"; fi

      # rebase 후 커밋이 바뀌면 태그도 새 커밋을 가리키도록 시도마다 다시 만듦 (같은 이름이면 -f 로 갱신)
      for i in 1 2 3; do
        git -C gitops tag -fa "$DEPLOY_TAG" -m "$TAG_MESSAGE"
        git -C gitops push origin HEAD && git -C gitops push -f origin "refs/tags/$DEPLOY_TAG" && break
        [ "$i" = 3 ] && { echo "gitops push 실패 (3회)"; exit 1; }
        git -C gitops pull --rebase origin "$(git -C gitops rev-parse --abbrev-ref HEAD)"
      done
      echo "gitops $GITOPS_REPO 커밋 완료 ($(git -C gitops rev-parse --short HEAD)), 태그 $DEPLOY_TAG — ArgoCD 의 backend 앱이 최대 3분 안에 sync 합니다"

deploy-dev:
  extends: .gitops-commit
  needs: [push]
  variables:
    GITOPS_ENV: dev
    DEPLOY_KIND: deploy
    DEPLOY_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DEPLOY_CHART_REV: $CI_COMMIT_SHA
  # 같은 환경의 gitops 커밋이 겹치지 않게 직렬화
  resource_group: dev
  environment:
    name: dev
  rules:
    - if: $ROLLBACK_TO
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *backend-paths
      when: manual

# ── rollback (Run pipeline + 변수 ROLLBACK_TO) ─────────────────────
# ROLLBACK_TO = gitops 배포 태그(dev/p<pipeline id>-<sha>) 또는 previous(지금 배포 바로 전에 배포됐던 다른 이미지)
#   resolve : 태그에서 이미지 태그 · 차트 revision 을 꺼냄 (values 의 다른 값은 되돌리지 않음 — values 는 MR revert)
#   check   : 그 태그의 이미지가 레지스트리에 모두 있는지, 마이그레이션 이미지가 DB 를 그 버전으로 맞출 수 있는지(label) 확인
#   rollback-dev ▶ : resolve 결과로 gitops 커밋 + 태그 (.gitops-commit). DB 는 ArgoCD sync 때 그 버전의 마이그레이션 hook 이
#                   비우고 다시 만들고(resetOnDowngrade), seed Job 이 채움 → dev DB 데이터는 시드 상태로 초기화됨
# 결제 노드는 따로: 롤백 후 ansible-playbook payment.yml -K --tags deploy (infra/ansible README 12-5)
# 이전 파이프라인이 남아 있으면 Deployments → Environments → dev 에서 그 deploy-dev 를 다시 실행해도 같은 결과입니다.
.rules-rollback:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $ROLLBACK_TO && $CI_COMMIT_BRANCH == "develop"

rollback-dev:resolve:
  extends: .rules-rollback
  stage: deploy
  image: $DEPLOY_IMAGE
  interruptible: false
  needs: []
  variables:
    GIT_STRATEGY: none
    GITOPS_ENV: dev
  script:
    - |
      set -eu
      # 태그 이력이 필요하므로 전체 clone (작은 레포)
      git clone -q "$CI_SERVER_PROTOCOL://ci-gitops:${GITOPS_PUSH_TOKEN}@$CI_SERVER_HOST/$GITOPS_REPO.git" gitops
      VALUES_PATH="envs/$GITOPS_ENV/values.yaml"
      APP_PATH="apps/$GITOPS_ENV/backend.yaml"
      CURRENT="$(yq '.global.imageTag' "gitops/$VALUES_PATH")"

      if [ "$ROLLBACK_TO" = "previous" ]; then
        TARGET=""
        for t in $(git -C gitops tag -l "$GITOPS_ENV/p*" --sort=-creatordate); do
          if [ "$(git -C gitops show "$t:$VALUES_PATH" | yq '.global.imageTag')" != "$CURRENT" ]; then TARGET="$t"; break; fi
        done
        [ -n "$TARGET" ] || { echo "지금($CURRENT)과 다른 이미지의 배포 태그($GITOPS_ENV/p*)가 없습니다 — gitops Tags 를 확인하세요"; exit 1; }
      else
        git -C gitops rev-parse -q --verify "refs/tags/$ROLLBACK_TO" > /dev/null \
          || { echo "gitops 에 태그 $ROLLBACK_TO 가 없습니다 — $GITOPS_REPO 의 Repository → Tags 에서 이름을 확인하세요"; exit 1; }
        TARGET="$ROLLBACK_TO"
      fi

      IMAGE="$(git -C gitops show "$TARGET:$VALUES_PATH" | yq '.global.imageTag')"
      CHART_REV="$(git -C gitops show "$TARGET:$APP_PATH" | yq '.spec.sources[0].targetRevision')"
      [ "$IMAGE" != "$CURRENT" ] || { echo "$TARGET 의 이미지($IMAGE)가 이미 배포돼 있습니다"; exit 1; }
      printf 'DEPLOY_IMAGE_TAG=%s\nDEPLOY_CHART_REV=%s\nROLLBACK_FROM=%s\n' "$IMAGE" "$CHART_REV" "$TARGET" > rollback.env

      echo "롤백 대상: $TARGET → 이미지 $IMAGE, 차트 $CHART_REV (지금 $CURRENT)"
      git -C gitops tag -l -n20 "$TARGET"
  artifacts:
    reports:
      dotenv: rollback.env
    # rollback-dev 는 수동(▶)이라 늦게 눌러도 받을 수 있게 하루 둔다
    expire_in: 1 day

rollback-dev:check:
  extends: .rules-rollback
  stage: deploy
  image:
    name: $CRANE_IMAGE
    entrypoint: [""]
  interruptible: false
  needs: [rollback-dev:resolve]
  variables:
    GIT_STRATEGY: none
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - |
      missing=""
      for svc in $IMAGES; do
        if digest="$(crane digest "$CI_REGISTRY_IMAGE/$svc:$DEPLOY_IMAGE_TAG" 2>/dev/null)"; then
          echo "$svc:$DEPLOY_IMAGE_TAG  $digest"
        elif [ "$svc" = "seed" ]; then
          # 온프레미스 레지스트리의 seed 이미지는 이 기능 이후 버전부터 있음 (그 전에는 운영 ECR 에만 올림)
          echo "경고: seed:$DEPLOY_IMAGE_TAG 가 없습니다 — 롤백 후 dev 데이터는 ansible-playbook db.yml -K --tags seed -e db_seed_mariadb=true 로 채우세요"
        else
          missing="$missing $svc"
        fi
      done
      [ -z "$missing" ] || { echo "레지스트리에 $DEPLOY_IMAGE_TAG 태그가 없는 이미지:$missing — 이 버전으로는 롤백할 수 없습니다"; exit 1; }
    # 마이그레이션 이미지가 migrate.sh(롤백 때 DB 를 그 버전으로 다시 만듦)를 가진 버전인지
    - |
      if crane config "$CI_REGISTRY_IMAGE/main-migrations:$DEPLOY_IMAGE_TAG" | grep -q '"team04.migrations.reset":"1"'; then
        echo "main-migrations:$DEPLOY_IMAGE_TAG — 롤백 때 메인 DB 를 이 버전으로 다시 만듭니다 (dev DB 데이터는 시드 상태로 초기화)"
      else
        echo "경고: main-migrations:$DEPLOY_IMAGE_TAG 는 DB 를 내리지 못하는 이전 이미지입니다 — 스키마는 지금 버전 그대로 남고, 이전 앱이 새 스키마 위에서 돕니다"
      fi

rollback-dev:
  extends: .gitops-commit
  needs: [rollback-dev:resolve, rollback-dev:check]
  variables:
    GITOPS_ENV: dev
    DEPLOY_KIND: rollback
  resource_group: dev
  environment:
    name: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $ROLLBACK_TO && $CI_COMMIT_BRANCH == "develop"
      when: manual
