name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 각 job은 해당 디렉터리가 없으면 자동으로 건너뜁니다(초록 통과).
# 프로젝트가 시작되면 자연스럽게 활성화됩니다.
jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json 없음 — 건너뜁니다."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run build

  # PR 단계 검증. 이미지 빌드·배포는 GitLab 파이프라인(.gitlab-ci.yml)이 담당합니다.
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # lint / jest 는 기존 코드의 실패가 남아 있어 우선 non-blocking (GitLab 파이프라인과 동일)
      - name: Lint
        continue-on-error: true
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        continue-on-error: true
        run: npm test -- --runInBand --passWithNoTests

      - name: Build
        run: |
          npx nest build common
          for app in api-gateway auth-service booking-service chat-bot-service hotel-service payment-service pg-mock-service user-service; do
            npx nest build "$app"
          done

  helm-chart:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint / Template
        run: |
          helm lint backend-deploy/charts/backend --set global.imageTag=lint
          helm template backend backend-deploy/charts/backend -n backend \
            --set global.imageTag=lint --set ingress.enabled=true > /dev/null

  # 운영 Grafana 대시보드(infra/gitops/prod/monitoring)는 온프레미스 원본의 사본 — 원본만 고치고 복사를 잊지 않도록 검사.
  # 원본의 team04-payment-node(외부 노드) · team04-db 는 운영에서 뺀다 (운영 결제 지표는 AMP, 운영 DB 는 RDS · ElastiCache 라 exporter 지표가 없음)
  monitoring-copies:
    name: Monitoring Dashboard Copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare dashboards
        run: |
          src=infra/ansible/roles/monitoring/files/dashboards
          dst=infra/gitops/prod/monitoring/chart/dashboards
          diff -r -x team04-payment-node.json -x team04-db.json "$src" "$dst" || {
            echo "::error::$dst 가 $src 와 다릅니다 — 원본을 복사해 커밋하세요 (team04-payment-node.json · team04-db.json 제외)"
            exit 1
          }

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$'; then
            echo "::error::.env 파일이 커밋되어 있습니다. 제거 후 다시 PR 하세요."
            exit 1
          fi
          echo "커밋된 .env 파일 없음"
