name: Jira Sync Test (임시)

# ⚠️ feat 브랜치 테스트 전용 — PR 올리기 전에 이 파일을 삭제합니다.
#
# issues 이벤트는 기본 브랜치(develop)의 워크플로우만 실행되므로,
# 커밋 메시지로 "이슈 생성/닫기" 이벤트를 흉내 내 스크립트를 실행합니다.
#
#   git commit --allow-empty -m "test: jira-test:opened #99"
#   git commit --allow-empty -m "test: jira-test:closed #99"
on:
  push:
    branches-ignore: [main, develop]

permissions:
  contents: read
  issues: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'jira-test:')
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build fake issues event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" =~ jira-test:(opened|closed)\ \#([0-9]+) ]]; then
            action="${BASH_REMATCH[1]}"; number="${BASH_REMATCH[2]}"
          else
            echo "::error::형식: jira-test:opened #번호 또는 jira-test:closed #번호"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$number" \
            | jq --arg action "$action" '{action: $action, issue: .}' > "$RUNNER_TEMP/event.json"
          echo "이슈 #$number / $action 이벤트로 실행합니다."

      - name: Sync
        run: node .github/scripts/jira-sync.mjs
        env:
          SYNC_EVENT_NAME: issues
          SYNC_EVENT_PATH: ${{ runner.temp }}/event.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          GH_PROJECT_NUMBER: ${{ vars.GH_PROJECT_NUMBER }}
          JIRA_BASE_URL: https://likelion-devops-7th-3rd-team04.atlassian.net
          JIRA_PROJECT_KEY: LDP
          JIRA_BOARD_ID: "2"
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
