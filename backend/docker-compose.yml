version: '3.8'

# 실행 모드 2가지:
#   1) docker compose --profile local-infra up
#      기존과 동일한 풀 로컬 스택 (mariadb/redis/dynamodb-local 등 로컬 인프라 컨테이너 전부 포함)
#   2) docker compose up (profile 없이)
#      app 7개 서비스만 실행됩니다. 이 경우 .env의 DB_HOST/REDIS_HOST 등을 실제 AWS
#      리소스(EC2 MariaDB/ElastiCache) 값으로 채워야 정상 동작합니다.

services:

  # 1. MariaDB 서비스 (로컬 개발용. 운영에서는 EC2 MariaDB를 사용하며, 그때는 DB_HOST만
  #    바꾸면 되고 코드 변경은 필요 없습니다.)
  mariadb:
    image: mariadb:11.2
    container_name: mariadb
    restart: always
    profiles: ["local-infra"]
    env_file:
      - .env
    # mariadb 공식 이미지 엔트리포인트는 최초 초기화 시 MARIADB_ROOT_PASSWORD(또는
    # MARIADB_ALLOW_EMPTY_ROOT_PASSWORD 등) 중 하나가 없으면 즉시 종료됩니다. env_file로
    # 주입되는 DB_*는 TypeORM(앱)이 접속할 때 쓰는 이름이라 이 이미지가 찾는 이름이
    # 아니므로, 아래에서 명시적으로 매핑해줍니다. 볼륨을 안 쓰기 때문에(아래 "볼륨 사용하지
    # 않았습니다" 주석 참고) 매 기동마다 이 초기화가 처음부터 다시 성공해야 합니다.
    # 앱은 root 가 아닌 앱 전용 계정(DB_USERNAME)으로 접속합니다 — 이미지가 DB_DATABASE 에 대한
    # 전체 권한으로 생성해 줍니다. MARIADB_USER=root 는 이미지가 거부하므로 기존 .env 에
    # DB_USERNAME=root 가 남아 있다면 .env.example 을 참고해 DB_USERNAME / DB_ROOT_PASSWORD 를 갱신하세요.
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 5
    # 컨테이너가 처음 초기화될 때 결제 DB(PAYMENT_DB_DATABASE)와 결제 전용 계정도 함께 만듭니다.
    volumes:
      - ./scripts/mariadb-init:/docker-entrypoint-initdb.d:ro
    # 현재 DB 구축을 하지 않았기 때문에 볼륨 사용하지 않았습니다. 사용하려면 아래의 주석 해제
    # volumes:
    #   - mariadb_data:/var/lib/mysql

  # 1-2. 결제 DB 마이그레이션 (Flyway). apps/payment-service/migrations의 SQL을 버전 순서대로 적용하고
  #      종료합니다. payment-service는 이게 성공해야 시작합니다(synchronize: false라 테이블을 직접 안 만듦).
  #      이미 적용된 버전은 건너뛰므로 docker compose up을 반복해도 안전합니다.
  payment-db-migration:
    image: flyway/flyway:11.3.4-alpine
    command: migrate
    environment:
      - FLYWAY_URL=jdbc:mariadb://${PAYMENT_DB_HOST}:${PAYMENT_DB_PORT:-3306}/${PAYMENT_DB_DATABASE}
      - FLYWAY_USER=${PAYMENT_DB_USERNAME}
      - FLYWAY_PASSWORD=${PAYMENT_DB_PASSWORD}
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql
      # DB가 막 켜지는 중이면 바로 실패하지 않고 재시도합니다.
      - FLYWAY_CONNECT_RETRIES=10
    volumes:
      - ./apps/payment-service/migrations:/flyway/sql:ro
    depends_on:
      # local-infra profile 없이(실제 AWS DB 사용) 실행할 때는 mariadb 서비스가 없으므로 required: false
      mariadb:
        condition: service_healthy
        required: false
    restart: "no"

  # 1-3. ElasticMQ (로컬 개발용 SQS 대체). 결제 결과 이벤트 큐 payment-result.fifo (+ DLQ)를 만듭니다.
  #      payment-service가 payment_outbox를 이 큐로 발행하고 booking-service가 받아 예약에 반영합니다 (LDP-26).
  #      운영(AWS)에서는 실제 SQS FIFO를 쓰며, 코드는 그대로 두고 SQS_ENDPOINT만 비웁니다.
  #      볼륨을 쓰지 않아서 재기동하면 큐가 비워집니다 (보내지 못한 이벤트는 payment_outbox에 남아 다시 발행됨).
  elasticmq:
    image: softwaremill/elasticmq:1.7.1
    profiles: ["local-infra"]
    volumes:
      - ./scripts/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://127.0.0.1:9324/?Action=ListQueues' > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # 1-1. DB 시딩 (관리자 계정 + 호텔/객실 3개 + 객실 재고). mariadb가 healthy해지면 1회 실행 후 종료됩니다.
  #      매번 재실행해도 이미 존재하는 데이터는 건너뛰므로(멱등) docker compose up을 반복해도 안전합니다.
  #      hotels/rooms 등은 이제 main-db-migration이 만들기 때문에, 그게 끝난 뒤에 실행되어야 합니다.
  db-seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile.seed
    profiles: ["local-infra"]
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      mariadb:
        condition: service_healthy
      main-db-migration:
        condition: service_completed_successfully
    restart: "no"

  # 1-1b. 메인 DB 마이그레이션 (Flyway). migrations/의 SQL을 버전 순서대로 적용하고 종료합니다.
  #       hotel-service/booking-service는 이게 성공해야 시작합니다(synchronize: false라 테이블을
  #       직접 안 만듦). 이미 적용된 버전은 건너뛰므로 docker compose up을 반복해도 안전합니다.
  main-db-migration:
    image: flyway/flyway:11.3.4-alpine
    command: migrate
    environment:
      - FLYWAY_URL=jdbc:mariadb://${DB_HOST}:${DB_PORT:-3306}/${DB_DATABASE}
      - FLYWAY_USER=${DB_USERNAME}
      - FLYWAY_PASSWORD=${DB_PASSWORD}
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql
      # DB가 막 켜지는 중이면 바로 실패하지 않고 재시도합니다.
      - FLYWAY_CONNECT_RETRIES=10
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      # local-infra profile 없이(실제 AWS DB 사용) 실행할 때는 mariadb 서비스가 없으므로 required: false
      mariadb:
        condition: service_healthy
        required: false
    restart: "no"

  # 2. Redis (로컬 개발용. 운영에서는 AWS ElastiCache를 사용하며, 그때는 auth-service의
  #    REDIS_HOST/REDIS_PORT/REDIS_PASSWORD/REDIS_TLS 값만 바꾸면 되고 코드 변경은 필요 없습니다.)
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    profiles: ["local-infra"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2-1. DynamoDB Local (chat-bot-service의 세션/대화 이력 저장용 로컬 개발 대체재.
  #      운영에서는 실제 AWS DynamoDB를 사용하며, 그때는 chat-bot-service의
  #      DYNAMODB_ENDPOINT를 비우면 되고 코드 변경은 필요 없습니다.)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    restart: always
    profiles: ["local-infra"]
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  # 2-2. DynamoDB 테이블 부트스트랩 (ChatSessions/ChatMessages). dynamodb-local은 완전히 빈
  #      상태로 뜨기 때문에 1회 실행 후 종료됩니다. db-seed와 동일한 이미지(scripts/Dockerfile.seed)를
  #      재사용하고 command만 다른 스크립트로 덮어씁니다. dynamodb-local에 healthcheck가 없어서
  #      depends_on은 컨테이너 시작만 기다리고, 실제 연결 재시도는 스크립트 안에서 처리합니다.
  #      매번 재실행해도 이미 존재하는 테이블은 건너뛰므로(멱등) docker compose up을 반복해도 안전합니다.
  dynamodb-init:
    build:
      context: .
      dockerfile: scripts/Dockerfile.seed
    profiles: ["local-infra"]
    command: ["npx", "ts-node", "--transpile-only", "-r", "tsconfig-paths/register", "scripts/dynamodb-init.ts"]
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_REGION=ap-northeast-2
    depends_on:
      - dynamodb-local
    restart: "no"

  # 3. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - USER_SERVICE_HOST=user-service:3001
      - HOTEL_SERVICE_HOST=hotel-service:3002
      - BOOKING_SERVICE_HOST=booking-service:3003
      - PAYMENT_SERVICE_HOST=payment-service:3004
      - CHAT_BOT_SERVICE_HOST=chat-bot-service:3005
      - AUTH_SERVICE_HOST=auth-service:3006
      # pg-mock-service가 보내는 결제 웹훅의 HMAC 서명을 검증하는 데 씁니다. pg-mock-service의
      # MOCK_PG_SECRET과 반드시 같은 값이어야 합니다.
      - MOCK_PG_SECRET=${MOCK_PG_SECRET:-mock-pg-secret}

    depends_on:
      - user-service
      - hotel-service
      - booking-service
      - payment-service
      - chat-bot-service
      - auth-service

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    ports:
      - "3001:3001"
    # gRPC 전용 서비스라 헬스체크용 HTTP 포트(3101)를 따로 엽니다 — 컨테이너 내부 확인용이라 ports:에는 노출하지 않습니다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3101/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    # users/deleted_user/admins는 main-db-migration(Flyway V6)이 만듭니다
    # (synchronize: false라 user-service 자신은 테이블을 안 만듦).
    depends_on:
      main-db-migration:
        condition: service_completed_successfully

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    ports:
      - "3006:3006"
    # gRPC 전용 서비스라 헬스체크용 HTTP 포트(3106)를 따로 엽니다 — 컨테이너 내부 확인용이라 ports:에는 노출하지 않습니다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3106/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    # REDIS_HOST/REDIS_PORT는 .env(env_file)에서 옵니다 — 여기서 하드코딩하면 실제 AWS
    # ElastiCache 테스트 시 .env 값이 무시되므로, env_file이 그대로 반영되게 둡니다.
    environment:
      - NODE_ENV=development
      - USER_SERVICE_HOST=user-service:3001
    # credentials/admin_credentials도 main-db-migration(Flyway V6)이 만듭니다.
    depends_on:
      user-service:
        condition: service_started
      redis:
        condition: service_started
      main-db-migration:
        condition: service_completed_successfully

  hotel-service:
    build:
      context: .
      dockerfile: apps/hotel-service/Dockerfile
    ports:
      - "3002:3002"
    # gRPC 전용 서비스라 헬스체크용 HTTP 포트(3102)를 따로 엽니다 — 컨테이너 내부 확인용이라 ports:에는 노출하지 않습니다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3102/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    # hotels/rooms/facilities/room_images/room_availabilities는 main-db-migration이 만듭니다
    # (synchronize: false라 hotel-service 자신은 테이블을 안 만듦).
    depends_on:
      main-db-migration:
        condition: service_completed_successfully


# DB 볼륨 사용 시 아래 주속 해제
# volumes:
#   mariadb_data:
  booking-service:
    build:
      context: .
      dockerfile: apps/booking-service/Dockerfile
    ports:
      - "3003:3003"
    # gRPC 전용 서비스라 헬스체크용 HTTP 포트(3103)를 따로 엽니다 — 컨테이너 내부 확인용이라 ports:에는 노출하지 않습니다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3103/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOTEL_SERVICE_HOST=hotel-service:3002
      # 예약 취소 시 환불 요청(RefundPayment)에 사용. payment-service도 이 서비스를 호출하는
      # 반대 방향 의존(getBookingById/ConfirmBooking)이 있어 순환 의존이 되므로, 여기서는
      # depends_on을 걸지 않는다 — gRPC 클라이언트는 연결을 지연 생성/재시도한다.
      - PAYMENT_SERVICE_HOST=payment-service:3004
      # 결제 결과 이벤트 큐 (LDP-26). .env에 값이 없으면 로컬 ElasticMQ를 씁니다.
      - SQS_ENDPOINT=${SQS_ENDPOINT-http://elasticmq:9324}
      - SQS_REGION=${SQS_REGION:-ap-northeast-2}
      - PAYMENT_RESULT_QUEUE_URL=${PAYMENT_RESULT_QUEUE_URL:-http://elasticmq:9324/000000000000/payment-result.fifo}
    # reservations/reservation_facilities도 main-db-migration이 만듭니다
    # (synchronize: false라 booking-service 자신은 테이블을 안 만듦).
    depends_on:
      hotel-service:
        condition: service_started
      main-db-migration:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
        required: false

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    ports:
      - "3004:3004"
    # gRPC 전용 서비스라 헬스체크용 HTTP 포트(3104)를 따로 엽니다 — 컨테이너 내부 확인용이라 ports:에는 노출하지 않습니다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3104/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PG_MOCK_SERVICE_URL=http://pg-mock-service:3007
      # 결제 결과 이벤트 큐 (LDP-26). .env에 값이 없으면 로컬 ElasticMQ를 씁니다.
      - SQS_ENDPOINT=${SQS_ENDPOINT-http://elasticmq:9324}
      - SQS_REGION=${SQS_REGION:-ap-northeast-2}
      - PAYMENT_RESULT_QUEUE_URL=${PAYMENT_RESULT_QUEUE_URL:-http://elasticmq:9324/000000000000/payment-result.fifo}
    # 결제 DB 접속 정보(PAYMENT_DB_*)는 .env(env_file)에서 옵니다.
    depends_on:
      pg-mock-service:
        condition: service_started
      payment-db-migration:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
        required: false

  # 4-1. PG 목업 서버 — 실제 PG사(토스페이먼츠 등) 서버를 대신하는 목업. payment-service가
  #      HTTP로 결제 생성/승인을 요청하고, 이 서버는 결과를 웹훅으로 통보합니다. 웹훅 수신
  #      엔드포인트는 payment-service가 아니라 api-gateway(POST /api/payments/webhook)에
  #      있습니다 — payment-service는 gRPC 전용이라 HTTP를 직접 받을 수 없기 때문입니다.
  pg-mock-service:
    build:
      context: .
      dockerfile: apps/pg-mock-service/Dockerfile
    ports:
      - "3007:3007"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3007/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    environment:
      - NODE_ENV=development
      - PAYMENT_SERVICE_WEBHOOK_URL=${PAYMENT_SERVICE_WEBHOOK_URL:-http://api-gateway:3000/api/payments/webhook}
      # api-gateway와 반드시 같은 값이어야 서명 검증이 통과합니다.
      # ⚠️ api-gateway를 depends_on에 추가하지 않습니다 — api-gateway→payment-service→
      # pg-mock-service로 이미 의존 관계가 있어서 여기 추가하면 순환 의존이 됩니다. 웹훅은
      # 결제 처리 시점에만 호출되므로 시작 순서를 강제하지 않아도 실질적인 문제가 없습니다.
      - MOCK_PG_SECRET=${MOCK_PG_SECRET:-mock-pg-secret}

  chat-bot-service:
    build:
      context: .
      dockerfile: apps/chat-bot-service/Dockerfile
    ports:
      - "3005:3005"
    # gRPC 전용 서비스라 헬스체크용 HTTP 포트(3105)를 따로 엽니다 — 컨테이너 내부 확인용이라 ports:에는 노출하지 않습니다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3105/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    # DYNAMODB_ENDPOINT/DYNAMODB_REGION은 .env(env_file)에서 옵니다 — 여기서 하드코딩하면
    # 실제 AWS DynamoDB 테스트 시 .env 값이 무시됩니다.
    # local-infra profile 없이 실행할 경우 이 depends_on 때문에 dynamodb-local이 함께
    # 켜질 수 있습니다 (docker compose 버전에 따라 다름) — 필요하면 수동으로 무시하세요.
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    # 리눅스 Docker에는 host.docker.internal이 기본으로 없어서, 호스트에서 도는 n8n 웹훅을
    # 호출하려면 직접 매핑해야 합니다 (Docker Desktop(Mac/Windows)에서는 없어도 동작).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dynamodb-local
