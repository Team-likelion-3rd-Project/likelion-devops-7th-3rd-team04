# 로컬 docker compose 전용 ElasticMQ 설정 — prod 의 SQS FIFO 를 흉내냅니다.
# 큐 이름·DLQ·횟수·visibility timeout 은 온프레미스 dev 결제 서버 설정과 같게 맞춥니다
# (infra/ansible/roles/payment_stack/templates/elasticmq.conf.j2, group_vars/payment.yml).
include classpath("application.conf")

# 큐 URL 에 들어가는 주소 — 같은 compose 네트워크의 서비스가 그대로 접속할 수 있게 서비스 이름으로 고정
node-address {
  protocol = http
  host = "elasticmq"
  port = 9324
  context-path = ""
}
generate-node-address = false

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = ap-northeast-2
  accountId = "000000000000"
}

queues {
  # 5번 받아도 처리 못 한 결제 결과 메시지가 옮겨지는 곳
  "payment-result-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
  # 결제 결과 이벤트 (payment_outbox -> booking-service payment_result_inbox)
  # MessageGroupId = reservation_id (같은 예약 이벤트는 순서대로), MessageDeduplicationId = outbox event_id
  "payment-result.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "payment-result-dlq.fifo"
      maxReceiveCount = 5
    }
  }
}
