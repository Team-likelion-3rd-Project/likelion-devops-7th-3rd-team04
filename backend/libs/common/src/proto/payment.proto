syntax = "proto3";

package payment;

service PaymentService {
  rpc GetHello (Empty) returns (HelloResponse);

  // 유저 측 결제 요청. booking-service에서 예약을 조회해 금액/소유자/상태를 검증한 뒤,
  // PG(pg-mock-service)에 결제 생성+승인을 동기로 요청한다. 실제 PG의 confirm API 호출 방식
  // (서버-투-서버, 동기)을 그대로 따른다 — 승인 응답을 그 자리에서 받아 결제내역을 즉시
  // paid 상태로 저장한다. 실패 시(예약 없음/본인 아님/이미 결제됨/PG 승인 실패) gRPC 에러.
  rpc RequestPayment (RequestPaymentRequest) returns (Payment);

  // PG(pg-mock-service)가 승인/취소 결과를 비동기로 통보하는 웹훅을 처리한다. RequestPayment가
  // 이미 동기로 승인까지 끝내므로 이 RPC는 보조 역할만 한다: (1) 동기 흐름이 응답 수신 단계에서
  // 실패했지만 PG는 실제 승인했던 경우의 구제(결제내역 뒤늦게 생성), (2) PG 측에서 발생한 취소를
  // 반영(결제내역을 refunded로 변경). 서명 검증은 원본 요청 바디에 직접 접근 가능한 api-gateway가
  // 수행하고, 여기 도달하는 시점엔 이미 검증이 끝난 상태다.
  rpc HandlePaymentWebhook (PaymentWebhookRequest) returns (Empty);

  // 단건 결제 상세 조회 (관리자 전용, 권한 검증은 api-gateway에서 수행)
  rpc GetPaymentById (GetPaymentByIdRequest) returns (Payment);

  // 특정 유저의 결제 목록 조회. /me(본인 조회)와 /{userId}(관리자 조회) 양쪽에서 재사용된다.
  rpc GetPaymentsByUserId (GetPaymentsByUserIdRequest) returns (PaymentListResponse);

  // 예약 취소 시 booking-service가 호출하는 내부용 환불 RPC (ERD "환불: 요청은 PrivateLink, 결과는 SQS").
  // REST로는 노출되지 않는다 — 환불은 별도 API가 아니라 예약취소의 부수효과로만 일어난다.
  // 승인된 결제가 있으면 APPROVED -> REFUND_REQUESTED -> PG 취소 -> REFUNDED / REFUND_FAILED로 바꾸고,
  // 결과를 payment_outbox(PAYMENT_REFUNDED / PAYMENT_REFUND_FAILED)로 booking-service에 알린다.
  // 승인된 결제가 없으면(결제 전 취소 등) 아무 일도 하지 않는다(NO_PAYMENT). booking-service는 예약 상태와
  // 무관하게 취소마다 항상 호출한다 — 결제 승인 이벤트가 아직 반영되지 않아 예약이 PENDING_PAYMENT로
  // 보이는 경우에도 환불이 누락되지 않게 하기 위함이다. 같은 refundIdempotencyKey로 다시 호출해도 환불은 1번.
  rpc RefundPayment (RefundPaymentRequest) returns (RefundPaymentResponse);

  // 결제 승인 (booking-service의 ConfirmPayment가 호출). 멱등 키로 payments에 PROCESSING을 먼저
  // 기록(UNIQUE로 중복 결제 방지)한 뒤 PG(MOCK: pg-mock / TOSS: 토스 승인 API)에 승인을 요청하고,
  // 승인되면 한 트랜잭션에서 APPROVED 전환 + payment_outbox 기록. 같은 멱등 키로 다시 호출하면
  // 이미 기록된 결과를 그대로 돌려준다. 결제 결과(거절·타임아웃 포함)는 에러가 아니라 result로 돌려준다.
  rpc ApprovePayment (ApprovePaymentRequest) returns (ApprovePaymentResponse);
}

message ApprovePaymentRequest {
  string idempotencyKey = 1; // booking-service payment_attempts.idempotency_key
  int32 reservationId = 2;
  int32 userId = 3;
  string orderId = 4; // payment_attempts.pg_order_id
  string paymentKey = 5;
  int32 amount = 6;
  string orderName = 7;
}

message ApprovePaymentResponse {
  string result = 1; // APPROVED | FAILED | UNKNOWN | PROCESSING
  int32 paymentId = 2;
  bool retryable = 3;
  string code = 4; // FAILED일 때 사유 코드 (PAYMENT_DECLINED 등)
  string message = 5;
}

message PaymentWebhookRequest {
  string eventType = 1; // 'PAYMENT.APPROVED' | 'PAYMENT.CANCELED'
  string paymentKey = 2;
  string orderId = 3; // reservationId를 문자열로 인코딩한 값
  int32 amount = 4;
  string paymentMethod = 5;
  string approvalNumber = 6;
  string status = 7; // PG 자체 상태값 ('DONE' | 'CANCELED')
  string occurredAt = 8;
}

message Empty {}

message HelloResponse {
  string message = 1;
}

message RequestPaymentRequest {
  int32 reservationId = 1;
  int32 userId = 2; // 본인 확인용 (api-gateway가 JWT에서 추출해 넘긴다)
  string paymentMethod = 3;
}

message GetPaymentByIdRequest {
  int32 paymentId = 1;
}

message GetPaymentsByUserIdRequest {
  int32 userId = 1;
}

message RefundPaymentRequest {
  int32 reservationId = 1;
  // 환불 멱등 키 (booking-service가 예약 ID로 만든 고정값). 같은 예약 취소가 재시도돼도 같은 키라서
  // payments.refund_idempotency_key UNIQUE·토스 Idempotency-Key로 환불이 1번만 일어난다.
  string refundIdempotencyKey = 2;
}

message RefundPaymentResponse {
  bool refunded = 1; // 이번 호출(또는 이전 호출)로 환불이 완료된 상태면 true
  // 환불 처리 결과: REFUNDED(완료) / REFUND_FAILED(PG 취소 실패, 대사 배치가 재시도) /
  // REFUND_REQUESTED(다른 요청이 처리 중) / NO_PAYMENT(승인된 결제 없음 — 결제 전 취소 등)
  string status = 2;
}

// 결제내역 테이블과 1:1 대응
message Payment {
  int32 paymentId = 1;
  int32 reservationId = 2;
  string approvalNumber = 3; // PG승인번호 (승인 전이면 빈 문자열)
  int32 amount = 4;
  string paymentMethod = 5;
  string status = 6; // PROCESSING | APPROVED | FAILED | UNKNOWN | REFUND_REQUESTED | REFUND_FAILED | REFUNDED
  string paidAt = 7; // 승인 시각 ISO 문자열 (승인 전이면 빈 문자열)
  int32 userId = 8;
}

message PaymentListResponse {
  repeated Payment payments = 1;
}
