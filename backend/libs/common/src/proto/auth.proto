syntax = "proto3";

package auth;

service AuthService {
  // 회원가입: user-service에 프로필을 생성하고 자격증명(비밀번호 해시)을 저장한 뒤 토큰을 발급합니다.
  rpc Register (RegisterRequest) returns (AuthResponse);

  // 로그인: user-service에서 이메일로 프로필을 조회하고 비밀번호 해시를 검증한 뒤 토큰을 발급합니다.
  rpc Login (LoginRequest) returns (AuthResponse);

  // 관리자 로그인: user-service의 AdminService에서 이메일로 관리자 계정을 조회하고 비밀번호 해시를
  // 검증한 뒤 토큰을 발급합니다. 고객(users)과 완전히 다른 테이블을 조회한다는 점만 다르고,
  // 이후 토큰 발급/검증(RolesGuard 등) 로직은 Login과 동일하게 재사용됩니다.
  rpc AdminLogin (LoginRequest) returns (AuthResponse);

  // 토큰 재발급: 리프레시 토큰을 검증하고 Redis에 저장된 값과 대조한 뒤 액세스/리프레시 토큰을 새로 발급합니다.
  rpc Refresh (RefreshRequest) returns (AuthResponse);

  // 로그아웃: Redis에 저장된 리프레시 토큰을 삭제해 재발급(Refresh)을 더 이상 할 수 없게 합니다.
  rpc Logout (LogoutRequest) returns (LogoutResponse);

  // 비밀번호 변경: 현재 비밀번호를 검증한 뒤 새 비밀번호로 해시를 교체합니다. 이후 재발급(Refresh)을 막기 위해
  // Redis에 저장된 리프레시 토큰도 함께 삭제합니다(다른 기기/세션은 강제 재로그인).
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);

  // 회원 탈퇴: user-service에 프로필 삭제(백업 테이블 이관 포함)를 요청한 뒤, 자격증명(비밀번호 해시)을
  // 삭제하고 Redis에 저장된 리프레시 토큰도 삭제합니다.
  rpc Withdraw (WithdrawRequest) returns (WithdrawResponse);

  // 소셜 로그인 인가 화면 주소 (LDP-194): state를 만들어 Valkey에 10분 보관하고, 카카오 인가 화면 주소를 돌려줍니다.
  rpc SocialAuthorizeUrl (SocialAuthorizeUrlRequest) returns (SocialAuthorizeUrlResponse);

  // 소셜 로그인: state 확인 → 인가 코드로 카카오 회원 정보 조회 → 연결된 회원이면 토큰 발급,
  // 처음이면 회원을 만들지 않고 가입 대기 토큰(10분)만 돌려줍니다 (이름·전화번호를 받은 뒤 SocialSignup).
  rpc SocialLogin (SocialLoginRequest) returns (SocialLoginResponse);

  // 소셜 회원 가입: 가입 대기 토큰 + 이름·전화번호로 user-service에 프로필을 만들고 소셜 계정을 연결한 뒤 토큰을 발급합니다.
  rpc SocialSignup (SocialSignupRequest) returns (AuthResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string phoneNumber = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  string refreshToken = 1;
}

message LogoutRequest {
  int32 userId = 1;
  // "USER" | "ADMIN". Redis 리프레시 토큰 키가 principal 타입별로 네임스페이싱되어 있어
  // 어느 쪽 토큰을 지울지 구분하는 데 필요합니다.
  string type = 2;
}

message LogoutResponse {
  bool success = 1;
}

message ChangePasswordRequest {
  int32 userId = 1;
  string currentPassword = 2;
  string newPassword = 3;
}

message ChangePasswordResponse {
  bool success = 1;
}

message WithdrawRequest {
  int32 userId = 1;
}

message WithdrawResponse {
  bool success = 1;
}

message AuthResponse {
  string accessToken = 1;
  string refreshToken = 2;
  int32 userId = 3;
  string email = 4;
  string name = 5;
  string role = 6;
  // 소셜로 가입한 회원이면 "KAKAO", 이메일 가입·관리자는 빈 문자열 (프론트가 비밀번호 변경 메뉴를 숨김, LDP-194)
  string socialProvider = 7;
}

message SocialAuthorizeUrlRequest {
  string provider = 1; // "KAKAO"
  string redirectUri = 2; // 카카오 로그인 후 돌아올 프론트 주소 (KAKAO_REDIRECT_URIS에 있는 것만)
}

message SocialAuthorizeUrlResponse {
  string url = 1;
  string state = 2;
}

message SocialLoginRequest {
  string provider = 1;
  string code = 2; // 카카오 인가 코드
  string state = 3;
}

message SocialLoginResponse {
  // true면 아직 우리 회원이 아님 → signupToken·email·name으로 추가 정보 입력 화면, false면 auth로 로그인 완료
  bool signupRequired = 1;
  string signupToken = 2;
  string email = 3;
  string name = 4; // 카카오 닉네임 (이름 입력칸 기본값)
  AuthResponse auth = 5;
}

message SocialSignupRequest {
  string signupToken = 1;
  string name = 2;
  string phoneNumber = 3;
}
