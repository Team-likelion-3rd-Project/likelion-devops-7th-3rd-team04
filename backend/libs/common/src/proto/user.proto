syntax = "proto3";

package user;

service UserService {
  rpc GetHello (Empty) returns (HelloResponse);

  // auth-service가 회원가입 시 프로필을 생성할 때 호출합니다. (email 중복 시 에러)
  rpc CreateUser (CreateUserRequest) returns (User);

  // auth-service가 로그인 시 이메일로 프로필을 조회할 때 호출합니다. (미가입 이메일이면 에러)
  rpc GetUserByEmail (GetUserByEmailRequest) returns (User);

  // api-gateway가 관리자 전용 "전체 유저 목록 조회"에서 호출합니다.
  rpc GetUsers (Empty) returns (UserListResponse);

  // api-gateway가 "내 정보 조회"(JWT의 userId) 및 관리자 "특정 유저 조회"에서 호출합니다. (없으면 에러)
  rpc GetUserById (GetUserByIdRequest) returns (User);

  // api-gateway가 "내 정보 수정"(JWT의 userId)에서 호출합니다. (없으면 에러)
  rpc UpdateUser (UpdateUserRequest) returns (User);

  // auth-service가 "회원 탈퇴"(JWT의 userId)에서 호출합니다. users 레코드를 deleted_user 백업 테이블로
  // 옮긴 뒤 users 테이블에서 제거합니다. (없으면 에러)
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}

// 관리자 계정(admins 테이블)은 고객(users)과 완전히 다른 테이블로 관리합니다.
// user-service가 같은 서비스 안에서 별도 도메인(admin/ 모듈)으로 소유합니다.
service AdminService {
  // 관리자 계정을 생성합니다. (이메일 중복 시 에러)
  rpc CreateAdmin (CreateAdminRequest) returns (Admin);

  // auth-service가 관리자 로그인 시 이메일로 조회합니다. (미등록 이메일이면 에러)
  rpc GetAdminByEmail (GetAdminByEmailRequest) returns (Admin);

  // 관리자 전체 목록을 조회합니다.
  rpc GetAdmins (Empty) returns (AdminListResponse);

  // 관리자 단건을 조회합니다. (없으면 에러)
  rpc GetAdminById (GetAdminByIdRequest) returns (Admin);
}

message Empty {}

message HelloResponse {
  string message = 1;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
  string phoneNumber = 3;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByIdRequest {
  int32 id = 1;
}

message UpdateUserRequest {
  int32 id = 1;
  string name = 2;
  string phoneNumber = 3;
}

message DeleteUserRequest {
  int32 id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message UserListResponse {
  repeated User users = 1;
}

message User {
  int32 id = 1;
  string email = 2;
  string name = 3;
  string phoneNumber = 4;
  string role = 5;
  string status = 6;
}

message CreateAdminRequest {
  string email = 1;
  string name = 2;
  string department = 3;
  string position = 4;
}

message GetAdminByEmailRequest {
  string email = 1;
}

message GetAdminByIdRequest {
  int32 id = 1;
}

message AdminListResponse {
  repeated Admin admins = 1;
}

message Admin {
  int32 id = 1;
  string email = 2;
  string name = 3;
  string department = 4;
  string position = 5;
}
