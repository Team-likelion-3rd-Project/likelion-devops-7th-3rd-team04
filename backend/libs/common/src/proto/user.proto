syntax = "proto3";

package user;

service UserService {
  rpc GetHello (Empty) returns (HelloResponse);

  // auth-service가 회원가입 시 프로필을 생성할 때 호출합니다. (email 중복 시 에러)
  rpc CreateUser (CreateUserRequest) returns (User);

  // auth-service가 로그인 시 이메일로 프로필을 조회할 때 호출합니다. (미가입 이메일이면 에러)
  rpc GetUserByEmail (GetUserByEmailRequest) returns (User);

  // api-gateway가 관리자 전용 "전체 유저 목록 조회"에서 호출합니다.
  // 조건이 없으면 전체(가입 순), page가 1 이상이면 그 페이지만(최근 가입 순). total은 조건에 맞는 전체 개수 (LDP-136)
  rpc GetUsers (GetUsersRequest) returns (UserListResponse);

  // api-gateway가 "내 정보 조회"(JWT의 userId) 및 관리자 "특정 유저 조회"에서 호출합니다. (없으면 에러)
  rpc GetUserById (GetUserByIdRequest) returns (User);

  // api-gateway가 "내 정보 수정"(JWT의 userId)에서 호출합니다. (없으면 에러)
  rpc UpdateUser (UpdateUserRequest) returns (User);

  // auth-service가 "회원 탈퇴"(JWT의 userId)에서 호출합니다. users 레코드를 deleted_user 백업 테이블로
  // 옮긴 뒤 users 테이블에서 제거합니다. (없으면 에러)
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);

  // auth-service가 회원가입 도중(비밀번호 저장) 실패했을 때 방금 만든 프로필을 되돌립니다 (LDP-96).
  // 가입이 성립하지 않은 것이라 deleted_user 백업 없이 지웁니다. id와 email이 모두 맞을 때만 지우고,
  // 이미 없으면 그대로 성공으로 응답합니다(다시 호출해도 안전).
  rpc CancelSignup (CancelSignupRequest) returns (DeleteUserResponse);

  // auth-service가 회원가입 전에 호출합니다 (LDP-111). 탈퇴가 중간에 멈춰 비밀번호 없이 남은 프로필을
  // deleted_user로 옮긴 뒤 지워, 같은 이메일로 다시 가입할 수 있게 합니다. 비밀번호가 없는지는 auth-service가
  // 확인하고, 여기서는 id·email이 맞고 만든 지 일정 시간이 지난 프로필만 정리합니다(가입 진행 중인 프로필 보호).
  // 조건에 맞지 않거나 이미 없으면 success=false.
  rpc ArchiveOrphanProfile (ArchiveOrphanProfileRequest) returns (DeleteUserResponse);
}

// 관리자 계정(admins 테이블)은 고객(users)과 완전히 다른 테이블로 관리합니다.
// user-service가 같은 서비스 안에서 별도 도메인(admin/ 모듈)으로 소유합니다.
service AdminService {
  // 관리자 계정을 생성합니다. (이메일 중복 시 에러)
  rpc CreateAdmin (CreateAdminRequest) returns (Admin);

  // auth-service가 관리자 로그인 시 이메일로 조회합니다. (미등록 이메일이면 에러)
  rpc GetAdminByEmail (GetAdminByEmailRequest) returns (Admin);

  // 관리자 전체 목록을 조회합니다.
  rpc GetAdmins (Empty) returns (AdminListResponse);

  // 관리자 단건을 조회합니다. (없으면 에러)
  rpc GetAdminById (GetAdminByIdRequest) returns (Admin);
}

message Empty {}

message HelloResponse {
  string message = 1;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
  string phoneNumber = 3;
}

// 회원 목록 조건 (LDP-136). 모든 칸이 비어 있으면 전체 목록 — 예전 GetUsers(Empty)와 같다
message GetUsersRequest {
  int32 page = 1; // 1부터. 0 = 페이지를 나누지 않음
  int32 size = 2; // 한 페이지 개수 (page가 1 이상일 때)
  string keyword = 3; // 이름·이메일·연락처에 들어 있는 글자 (빈 문자열 = 전체)
}

message GetUserByEmailRequest {
  string email = 1;
}

message CancelSignupRequest {
  int32 id = 1;
  string email = 2;
}

message ArchiveOrphanProfileRequest {
  int32 id = 1;
  string email = 2;
}

message GetUserByIdRequest {
  int32 id = 1;
}

message UpdateUserRequest {
  int32 id = 1;
  string name = 2;
  string phoneNumber = 3;
}

message DeleteUserRequest {
  int32 id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message UserListResponse {
  repeated User users = 1;
  int32 total = 2; // 조건에 맞는 전체 개수 (페이지와 무관, LDP-136)
}

message User {
  int32 id = 1;
  string email = 2;
  string name = 3;
  string phoneNumber = 4;
  string role = 5;
  string status = 6;
}

message CreateAdminRequest {
  string email = 1;
  string name = 2;
  string department = 3;
  string position = 4;
}

message GetAdminByEmailRequest {
  string email = 1;
}

message GetAdminByIdRequest {
  int32 id = 1;
}

message AdminListResponse {
  repeated Admin admins = 1;
}

message Admin {
  int32 id = 1;
  string email = 2;
  string name = 3;
  string department = 4;
  string position = 5;
}
