# AWS EKS(prod) 클러스터의 agentk 설정 — agent 등록만 해 두고, 설치는 EKS 스택 구축 후 진행합니다.
# 원본은 GitHub 모노레포 infra/gitlab/k8s-agents — Ansible(gitlab.yml --tags bootstrap)이
# GitLab team04/infra/k8s-agents 레포에 커밋합니다. GitLab 쪽에서 직접 고치지 마세요.
#
# CI job 에서 쓰는 kube context 이름: team04/infra/k8s-agents:prod-agent
ci_access:
  projects:
    - id: team04/hotel
      # environment: prod 인 job(deploy-prod) 에서만 이 agent 를 쓸 수 있음
      environments:
        - prod
