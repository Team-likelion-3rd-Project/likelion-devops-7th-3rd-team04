# 온프레미스 dev 클러스터의 agentk 설정.
# 원본은 GitHub 모노레포 infra/gitlab/k8s-agents — Ansible(gitlab.yml --tags bootstrap)이
# GitLab team04/infra/k8s-agents 레포에 커밋합니다. GitLab 쪽에서 직접 고치지 마세요.
#
# CI job 에서 쓰는 kube context 이름: team04/infra/k8s-agents:dev-agent
# Free tier 라 impersonation 이 없으므로 job 권한 = agentk ServiceAccount 권한
# (k8s-cicd.yml 의 Role/RoleBinding 으로 backend 네임스페이스만 허용)
ci_access:
  projects:
    - id: team04/hotel
      # environment: dev 인 job(deploy-dev) 에서만 이 agent 를 쓸 수 있음
      environments:
        - dev
