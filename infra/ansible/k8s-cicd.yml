---
- name: CI/CD 클러스터 측 구성 (backend 네임스페이스 / Secret + ArgoCD)
  hosts: control_plane
  become: true
  vars:
    # gitlab.yml --tags bootstrap 이 만든 .secrets/gitlab-k8s.env 를 source 해야 채워짐
    required_env:
      GITLAB_URL: "{{ gitlab_url }}"
      GITLAB_TS_IP: "{{ gitlab_ts_ip }}"
      GITLAB_REGISTRY: "{{ gitlab_registry }}"
      REGISTRY_DEPLOY_USER: "{{ registry_deploy_user }}"
      REGISTRY_DEPLOY_TOKEN: "{{ registry_deploy_token }}"
      ARGOCD_REPO_USER: "{{ argocd_repo_user }}"
      ARGOCD_REPO_TOKEN: "{{ argocd_repo_token }}"
  pre_tasks:
    - name: 필수 환경변수 확인
      ansible.builtin.assert:
        that: item.value | length > 0
        fail_msg: >-
          {{ item.key }} 가 비어 있습니다.
          set -a; source .env; source .secrets/gitlab-k8s.env; set +a 후 다시 실행하세요. (README 12-3)
        quiet: true
      loop: "{{ required_env | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      run_once: true
      delegate_to: localhost
      become: false

    - name: backend env 파일 확인
      ansible.builtin.stat:
        path: "{{ backend_env_file }}"
      register: backend_env_stat
      run_once: true
      delegate_to: localhost
      become: false

    - name: backend env 파일 없음 안내
      ansible.builtin.fail:
        msg: >-
          {{ backend_env_file }} 가 없습니다. backend/.env.example 을 backend/.env 로 복사해 값을 채우거나,
          BACKEND_ENV_FILE 로 다른 경로를 지정하세요.
      when: not backend_env_stat.stat.exists
      run_once: true

    - name: control plane 구성 여부 확인
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: admin.conf 확인
      ansible.builtin.assert:
        that: admin_conf.stat.exists
        fail_msg: "/etc/kubernetes/admin.conf 가 없습니다. control-plane.yml 을 먼저 실행하세요. (README 3절)"
        quiet: true

  roles:
    - helm
    - role: backend_namespace
      tags: [backend_secrets]
    # ArgoCD 만 다시: --tags argocd (README 12-9)
    - role: argocd
      tags: [argocd]
