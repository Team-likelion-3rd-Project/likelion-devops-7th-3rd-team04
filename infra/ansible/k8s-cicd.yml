---
# 클러스터 측 CI/CD: External Secrets Operator(OpenBao 연결) → backend 네임스페이스 / Secret → ArgoCD (README 12-3, 16절)
#   GitLab 토큰 · backend-secrets 원본은 OpenBao (db.yml 로 먼저 구성, .secrets/openbao.env 를 source)
- name: CI/CD 클러스터 측 구성 (ESO + backend 네임스페이스 / Secret + ArgoCD)
  hosts: control_plane
  become: true
  vars:
    # OpenBao gitlab-k8s (도입 전: gitlab.yml --tags bootstrap 이 만든 .secrets/gitlab-k8s.env 를 source)
    required_env:
      GITLAB_URL: "{{ gitlab_url }}"
      GITLAB_TS_IP: "{{ gitlab_ts_ip }}"
      GITLAB_REGISTRY: "{{ gitlab_registry }}"
      REGISTRY_DEPLOY_USER: "{{ registry_deploy_user }}"
      REGISTRY_DEPLOY_TOKEN: "{{ registry_deploy_token }}"
      ARGOCD_REPO_USER: "{{ argocd_repo_user }}"
      ARGOCD_REPO_TOKEN: "{{ argocd_repo_token }}"
  pre_tasks:
    - name: OpenBao 값 읽기
      ansible.builtin.import_role:
        name: openbao_kv
        tasks_from: read
      vars:
        openbao_read_paths: "{{ k8s_cicd_openbao_paths }}"
      tags: [always]

    # 값 대신 [이름, 길이] 만 넘겨 no_log 없이 어떤 값이 비었는지 보여줌
    - name: 필수 값 확인
      ansible.builtin.assert:
        that: item.1 > 0
        fail_msg: >-
          {{ item.0 }} 가 비어 있습니다. OpenBao {{ openbao_kv_prefix }}/gitlab-k8s 에 없으면
          gitlab.yml --tags bootstrap 을 다시 실행하거나, 도입 전이면 source .secrets/gitlab-k8s.env 후 다시 실행하세요. (README 12-3, 16절)
        quiet: true
      loop: "{{ required_env | dict2items | map(attribute='key') | zip(required_env | dict2items | map(attribute='value') | map('length')) | list }}"
      loop_control:
        label: "{{ item.0 }}"
      run_once: true
      delegate_to: localhost
      become: false
      tags: [always]

    - name: control plane 구성 여부 확인
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: admin.conf 확인
      ansible.builtin.assert:
        that: admin_conf.stat.exists
        fail_msg: "/etc/kubernetes/admin.conf 가 없습니다. control-plane.yml 을 먼저 실행하세요. (README 3절)"
        quiet: true

  roles:
    - helm
    # ESO 만 다시: --tags external_secrets (README 16절)
    - role: external_secrets
      tags: [external_secrets, backend_secrets]
    - role: backend_namespace
      tags: [backend_secrets]
    # ArgoCD 만 다시: --tags argocd (README 12-9)
    - role: argocd
      tags: [argocd]
