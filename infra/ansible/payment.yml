---
# 결제 서버 노드: 결제 MariaDB + Flyway(payment-migrations) + payment-service + ElasticMQ (Docker Compose)
# 이미지 태그는 gitops(team04/infra/backend-gitops) envs/dev 의 global.imageTag 를 따름 (README 14절)
#   전체 구성     : ansible-playbook payment.yml -K
#   이미지만 갱신 : ansible-playbook payment.yml -K --tags deploy
- name: 결제 서버 노드 구성 (결제 DB + payment-service + ElasticMQ, Docker Compose)
  hosts: payment
  become: true
  vars:
    # compose env_file / cnf / SQL 에 따옴표 없이 들어가므로 특수문자 제한
    secret_charset_regex: '^[^\s''"\\$#`]+$'
    required_env:
      TS_PAYMENT_OAUTH_CLIENT_SECRET: "{{ ts_oauth_secret }}"
      PAYMENT_DB_ROOT_PASSWORD: "{{ payment_db_root_password }}"
      CLUSTER_ENTRY_IP: "{{ cluster_entry_ip }}"
      GITLAB_URL (.secrets/payment-node.env): "{{ gitlab_url }}"
      GITLAB_TS_IP (.secrets/payment-node.env): "{{ gitlab_ts_ip }}"
      GITLAB_REGISTRY (.secrets/payment-node.env): "{{ gitlab_registry }}"
      PAYMENT_DEPLOY_USER (.secrets/payment-node.env): "{{ payment_deploy_user }}"
      PAYMENT_DEPLOY_TOKEN (.secrets/payment-node.env): "{{ payment_deploy_token }}"
      PAYMENT_DB_DATABASE (backend/.env): "{{ payment_db_database }}"
      PAYMENT_DB_USERNAME (backend/.env): "{{ payment_db_username }}"
      PAYMENT_DB_PASSWORD (backend/.env): "{{ payment_db_password }}"
  pre_tasks:
    - name: backend env 파일 확인
      ansible.builtin.stat:
        path: "{{ backend_env_file }}"
      register: backend_env_stat
      run_once: true
      delegate_to: localhost
      become: false
      tags: [always]

    - name: backend env 파일 없음 안내
      ansible.builtin.fail:
        msg: >-
          {{ backend_env_file }} 가 없습니다. backend/.env.example 을 backend/.env 로 복사해 값을 채우거나,
          BACKEND_ENV_FILE 로 다른 경로를 지정하세요.
      when: not backend_env_stat.stat.exists
      run_once: true
      tags: [always]

    - name: 결제 DB 계정 정책 확인
      ansible.builtin.assert:
        that:
          - payment_db_username != 'root'
          - payment_db_password is regex(secret_charset_regex)
          - payment_db_root_password is regex(secret_charset_regex)
        fail_msg: >-
          PAYMENT_DB_USERNAME 은 root 를 쓸 수 없습니다(앱 전용 계정 사용). 비밀번호에는 공백, 따옴표, 역슬래시, $, #, ` 를 쓸 수 없습니다.
        quiet: true
      no_log: true
      run_once: true
      delegate_to: localhost
      become: false
      tags: [always]

    - name: 선행 패키지 설치
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, python3-debian, ufw]
        state: present
        update_cache: true
        cache_valid_time: 3600

  roles:
    - preflight
    - tailscale
    - docker
    - firewall
    - role: payment_stack
      tags: [deploy]
