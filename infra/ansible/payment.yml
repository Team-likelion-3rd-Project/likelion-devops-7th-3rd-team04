---
# 결제 서버 노드: 결제 MariaDB + Flyway(payment-migrations) + payment-service + ElasticMQ (Docker Compose) → 모니터링 수집기
# 이미지 태그는 gitops(team04/infra/backend-gitops) envs/dev 의 global.imageTag 를 따름 (README 14절)
#   전체 구성     : ansible-playbook payment.yml -K
#   이미지만 갱신 : ansible-playbook payment.yml -K --tags deploy
#   수집기만      : ansible-playbook payment.yml -K --tags collectors
- name: 결제 서버 노드 구성 (결제 DB + payment-service + ElasticMQ, Docker Compose)
  hosts: payment
  become: true
  vars:
    # compose env_file / cnf / SQL 에 따옴표 없이 들어가므로 특수문자 제한
    secret_charset_regex: '^[^\s''"\\$#`]+$'
    # preflight(Tailnet 연결 전)는 Tailscale · 클러스터 주소만 확인
    required_env:
      TS_PAYMENT_OAUTH_CLIENT_SECRET: "{{ ts_oauth_secret }}"
      CLUSTER_ENTRY_IP: "{{ cluster_entry_ip }}"
    # OpenBao(payment-node · payment-db · payment-db-root)를 읽은 뒤 확인.
    # 도입 전에는 .secrets/payment-node.env · backend/.env · infra/ansible/.env 값
    required_values:
      PAYMENT_DB_ROOT_PASSWORD: "{{ payment_db_root_password }}"
      GITLAB_URL: "{{ gitlab_url }}"
      GITLAB_TS_IP: "{{ gitlab_ts_ip }}"
      GITLAB_REGISTRY: "{{ gitlab_registry }}"
      PAYMENT_DEPLOY_USER: "{{ payment_deploy_user }}"
      PAYMENT_DEPLOY_TOKEN: "{{ payment_deploy_token }}"
      PAYMENT_DB_DATABASE: "{{ payment_db_database }}"
      PAYMENT_DB_USERNAME: "{{ payment_db_username }}"
      PAYMENT_DB_PASSWORD: "{{ payment_db_password }}"
  pre_tasks:
    - name: 선행 패키지 설치
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, python3-debian, ufw]
        state: present
        update_cache: true
        cache_valid_time: 3600

  roles:
    - preflight
    - tailscale
    - docker
    - firewall

  # OpenBao 는 Tailnet 으로 읽으므로 tailscale role 뒤에서 (ACL: tag:payment → tag:db tcp:8200)
  tasks:
    # 결제 DB 서버 지표용 exporter 계정 비밀번호 — 처음 한 번만 만들고 이후에는 그대로 (README 17-6)
    - name: OpenBao 저장 (payment-db-exporter, 없을 때만)
      ansible.builtin.include_role:
        name: openbao_kv
        tasks_from: write
        # include_role 의 tags 는 안쪽 태스크에 전해지지 않음 — 없으면 --tags deploy · collectors 실행에서 비밀번호가 만들어지지 않음
        apply:
          tags: [always]
      vars:
        openbao_write_path: payment-db-exporter
        openbao_write_create_only: true
        openbao_write_data:
          password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      tags: [always]

    - name: OpenBao 값 읽기
      ansible.builtin.import_role:
        name: openbao_kv
        tasks_from: read
      vars:
        openbao_read_paths: "{{ payment_openbao_paths }}"
      tags: [always]

    # 값 대신 [이름, 길이] 만 넘겨 no_log 없이 어떤 값이 비었는지 보여줌
    - name: 필수 값 확인
      ansible.builtin.assert:
        that: item.1 > 0
        fail_msg: >-
          {{ item.0 }} 가 비어 있습니다. OpenBao({{ openbao_kv_prefix }}/payment-*)에 값을 넣거나,
          도입 전이면 .secrets/payment-node.env · backend/.env · .env 를 채우고 다시 실행하세요 (README 14-2, 16-3).
        quiet: true
      loop: "{{ required_values | dict2items | map(attribute='key') | zip(required_values | dict2items | map(attribute='value') | map('length')) | list }}"
      loop_control:
        label: "{{ item.0 }}"
      run_once: true
      tags: [always]

    - name: 결제 DB 계정 정책 확인
      ansible.builtin.assert:
        that:
          - payment_db_username != 'root'
          - payment_db_password is regex(secret_charset_regex)
          - payment_db_root_password is regex(secret_charset_regex)
        fail_msg: >-
          PAYMENT_DB_USERNAME 은 root 를 쓸 수 없습니다(앱 전용 계정 사용). 비밀번호에는 공백, 따옴표, 역슬래시, $, #, ` 를 쓸 수 없습니다.
        quiet: true
      no_log: true
      run_once: true
      delegate_to: localhost
      become: false
      tags: [always]

    # 항목마다 결과(bool)만 넘겨 값은 출력하지 않음 — no_log 없이 원인별 메시지를 보여줌
    - name: 결제 PG 설정 확인 (backend/.env · OpenBao toss-payments)
      ansible.builtin.assert:
        that: item.ok | bool
        fail_msg: "{{ item.msg }}"
        quiet: true
      loop:
        - name: PAYMENT_PROVIDER
          ok: "{{ payment_provider in ['MOCK', 'TOSS'] }}"
          msg: PAYMENT_PROVIDER 는 MOCK 또는 TOSS 만 쓸 수 있습니다 (비우면 MOCK).
        - name: TOSS_SECRET_KEY
          ok: "{{ payment_provider != 'TOSS' or toss_secret_key is regex('^(test|live)_gsk_[A-Za-z0-9_-]+$') }}"
          msg: >-
            PAYMENT_PROVIDER=TOSS 이면 TOSS_SECRET_KEY(OpenBao toss-payments.secret_key)에 결제위젯 연동 키의 시크릿 키(test_gsk_… / live_gsk_…)가 필요합니다.
            API 개별 연동 키(test_sk_…)나 클라이언트 키(test_gck_…)는 쓸 수 없습니다.
        - name: TOSS_API_BASE_URL
          ok: >-
            {{ toss_api_base_url | length == 0 or
               (toss_api_base_url is match('https://') and toss_api_base_url is regex(secret_charset_regex)) }}
          msg: >-
            TOSS_API_BASE_URL 은 비우거나(기본 https://api.tosspayments.com) https:// 주소여야 합니다.
            공백, 따옴표, 역슬래시, $, #, ` 는 쓸 수 없습니다.
      loop_control:
        label: "{{ item.name }}"
      run_once: true
      delegate_to: localhost
      become: false
      tags: [always]

    - name: 결제 노드 스택
      ansible.builtin.import_role:
        name: payment_stack
      tags: [deploy]

    # 호스트 · 컨테이너 + payment-service /metrics + 결제 MariaDB 서버 지표 → 클러스터 Prometheus (README 17절),
    # 컨테이너 · journald · 결제 DB 슬로우 쿼리 로그 → DB 노드 Loki (README 17-8). 단독: --tags collectors
    - name: 모니터링 수집기
      ansible.builtin.import_role:
        name: node_collectors
      vars:
        collectors_cluster: payment
        collectors_namespace: payment
        collectors_loki_url: "{{ loki_push_url if loki_host | length > 0 else '' }}"
        collectors_slow_log: "{{ payment_data_dir }}/mariadb/slow.log"
        collectors_slow_log_container: payment-mariadb
        collectors_app_scrapes: "{{ [{'job': 'payment-service', 'port': payment_metrics_port}] if payment_metrics_enabled else [] }}"
        collectors_mysql: "{{ {'port': payment_db_port, 'user': payment_db_exporter_user, 'password': payment_db_exporter_password} if payment_db_exporter_password | length > 0 else {} }}"
      tags: [deploy, collectors]

    # 수집기가 payment-node 프로젝트에 있던 때의 설정 · WAL (node_collectors 로 옮긴 뒤 남은 것)
    - name: 이전 수집기 파일 정리
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ payment_base_dir }}/conf/config.alloy"
        - "{{ payment_data_dir }}/alloy"
      tags: [deploy, collectors]
