---
- name: Ingress 매니페스트 생성
  ansible.builtin.template:
    src: api-gateway-ingress.yaml.j2
    dest: /etc/kubernetes/api-gateway-ingress.yaml
    mode: "0644"

- name: namespace / Ingress 적용
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/api-gateway-ingress.yaml
  environment: &kubeconfig
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ingress_apply
  changed_when: "'configured' in ingress_apply.stdout or 'created' in ingress_apply.stdout"

- name: api-gateway Service 존재 확인
  ansible.builtin.command: >-
    kubectl get service {{ api_gateway_service }} -n {{ api_gateway_namespace }}
  environment: *kubeconfig
  register: api_gateway_svc
  changed_when: false
  failed_when: false

- name: MagicDNS 이름 조회
  ansible.builtin.command: tailscale status --json
  register: ts_self
  changed_when: false

- name: 접속 정보
  vars:
    cp_fqdn: "{{ (ts_self.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"
  ansible.builtin.debug:
    msg:
      - "API 진입점 : http://{{ cp_fqdn }}:{{ traefik_http_nodeport }}/api  (Vite proxy target: http://{{ cp_fqdn }}:{{ traefik_http_nodeport }})"
      - >-
        {{ 'api-gateway Service 확인됨 (' ~ api_gateway_namespace ~ '/' ~ api_gateway_service ~ ')'
        if api_gateway_svc.rc == 0 else
        'api-gateway Service 가 아직 없습니다 — Ingress 만 먼저 적용됨. '
        ~ api_gateway_namespace ~ ' namespace 에 Service ' ~ api_gateway_service ~ ':' ~ api_gateway_port
        ~ ' 를 배포하면 자동 연결됩니다.' }}
