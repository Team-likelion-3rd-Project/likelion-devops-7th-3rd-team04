---
- name: Kubernetes apt 저장소 등록
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/deb/Release.key"

- name: kubelet / kubeadm / kubectl 설치
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: present
    update_cache: true

- name: 자동 업그레이드 방지 (hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: kubelet 활성화
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
