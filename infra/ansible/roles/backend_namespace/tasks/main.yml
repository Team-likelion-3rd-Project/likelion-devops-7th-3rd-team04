---
# backend 네임스페이스와, 차트가 참조하는 Secret 3개를 만듭니다. (차트 · ArgoCD 는 Namespace 를 만들지 않음 — CreateNamespace=false)
#   gitlab-registry : GitLab Container Registry pull (그룹 Deploy Token, read_registry) — Ansible 이 직접
#   backend-secrets : DB 비밀번호·JWT secret 등 — OpenBao 원본을 ESO 가 동기화 (ExternalSecret, 운영과 같은 방식 · README 16절)
#   seed-admin      : seed Job 의 관리자 계정 — OpenBao seed-admin 을 ESO 가 통째로 동기화 (README 7-5)
# 값은 stdin 으로 kubectl apply 에 넘겨 노드 디스크에 남기지 않습니다.
- name: 네임스페이스 ({{ backend_namespace }})
  vars:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ backend_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ manifest | to_json }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: backend_ns_apply
  changed_when: "'configured' in backend_ns_apply.stdout or 'created' in backend_ns_apply.stdout"

- name: 레지스트리 pull Secret ({{ backend_namespace }}/gitlab-registry)
  vars:
    dockerconfig:
      auths: >-
        {{ {gitlab_registry: {'username': registry_deploy_user,
                              'password': registry_deploy_token,
                              'auth': (registry_deploy_user ~ ':' ~ registry_deploy_token) | b64encode}} }}
    manifest:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/dockerconfigjson
      metadata:
        name: gitlab-registry
        namespace: "{{ backend_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
      data:
        .dockerconfigjson: "{{ dockerconfig | to_json | b64encode }}"
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ manifest | to_json }}"
  environment: &kubeconfig
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: pull_secret_apply
  changed_when: "'configured' in pull_secret_apply.stdout or 'created' in pull_secret_apply.stdout"
  no_log: true

# ExternalSecret 은 key 하나라도 원본에 없으면 Secret 전체를 만들지 않으므로 미리 확인 (값은 출력하지 않음)
- name: backend-secrets 원본 확인 (OpenBao)
  ansible.builtin.assert:
    that: openbao_kv[item.remote][item.property] | default('') | length > 0
    fail_msg: >-
      OpenBao {{ openbao_kv_prefix }}/{{ item.remote }} 의 {{ item.property }}({{ item.key }}) 가 없습니다.
      db.yml --tags openbao_import 로 .env 값을 옮기거나 bao kv patch 로 넣으세요 (README 16-3).
    quiet: true
  loop: "{{ backend_external_secret_refs }}"
  loop_control:
    label: "{{ item.remote }}.{{ item.property }}"
  run_once: true

# Ansible 이 만들던 backend-secrets 는 ESO(creationPolicy: Owner)가 넘겨받지 않으므로 지우고 ExternalSecret 이 다시 만들게 함.
# 실행 중인 Pod 는 기동 때 읽은 env 를 그대로 쓰므로 영향 없음
- name: 기존 backend-secrets 관리 주체 조회
  ansible.builtin.command: >-
    kubectl -n {{ backend_namespace }} get secret {{ backend_secret_name }} --ignore-not-found
    -o 'jsonpath={.metadata.labels.app\.kubernetes\.io/managed-by}'
  environment: *kubeconfig
  register: backend_secret_owner
  changed_when: false

- name: Ansible 이 만든 backend-secrets 삭제 (ESO 로 전환)
  ansible.builtin.command: >-
    kubectl -n {{ backend_namespace }} delete secret {{ backend_secret_name }}
  environment: *kubeconfig
  when: backend_secret_owner.stdout == 'ansible'
  changed_when: true

- name: backend-secrets ExternalSecret ({{ backend_namespace }}/{{ backend_secret_name }})
  vars:
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: "{{ backend_secret_name }}"
        namespace: "{{ backend_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
      spec:
        refreshInterval: "{{ backend_secret_refresh_interval }}"
        secretStoreRef:
          kind: ClusterSecretStore
          name: "{{ cluster_secret_store_name }}"
        target:
          name: "{{ backend_secret_name }}"
          creationPolicy: Owner
        data: >-
          {%- set out = [] -%}
          {%- for ref in backend_external_secret_refs -%}
            {%- set remote = {'key': openbao_kv_prefix ~ '/' ~ ref.remote, 'property': ref.property} -%}
            {%- if ref.key in backend_external_secret_base64_keys -%}
              {%- set _ = remote.update({'decodingStrategy': 'Base64'}) -%}
            {%- endif -%}
            {%- set _ = out.append({'secretKey': ref.key, 'remoteRef': remote}) -%}
          {%- endfor -%}
          {{ out }}
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ manifest | to_json }}"
  environment: *kubeconfig
  register: backend_external_secret_apply
  changed_when: "'configured' in backend_external_secret_apply.stdout or 'created' in backend_external_secret_apply.stdout"

- name: backend-secrets 동기화 대기
  ansible.builtin.command: >-
    kubectl -n {{ backend_namespace }} wait --for=condition=Ready
    externalsecret/{{ backend_secret_name }} --timeout=120s
  environment: *kubeconfig
  register: backend_external_secret_ready
  changed_when: false
  failed_when: false

- name: 동기화 실패 원인
  ansible.builtin.command: >-
    kubectl -n {{ backend_namespace }} get externalsecret {{ backend_secret_name }}
    -o 'jsonpath={.status.conditions[?(@.type=="Ready")].message}'
  environment: *kubeconfig
  register: backend_external_secret_message
  changed_when: false
  when: backend_external_secret_ready.rc != 0

- name: 동기화 실패 안내
  ansible.builtin.fail:
    msg: >-
      ExternalSecret {{ backend_namespace }}/{{ backend_secret_name }} 이 Ready 가 아닙니다:
      {{ backend_external_secret_message.stdout | default('?') }} (README 16-6)
  when: backend_external_secret_ready.rc != 0

# seed Job 의 관리자 계정 (gitops envs/dev 의 seed.adminSecretName, 운영 backend-secrets 앱의 seed-admin 과 같은 역할).
# backend-secrets 와 따로 두어 이 값이 없어도 서비스용 Secret 동기화는 영향 없음 — 실패해도 안내만 하고 계속 (seed Job 만 Secret 을 기다림).
# 매핑 없이 OpenBao seed-admin 의 속성을 모두 이름 그대로 가져옴 → 속성 이름 = 환경변수 이름 (SEED_ADMIN_EMAIL, SEED_SEOUL_MANAGER_PASSWORD …, LDP-193)
- name: seed-admin ExternalSecret ({{ backend_namespace }}/{{ seed_admin_secret_name }})
  vars:
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: "{{ seed_admin_secret_name }}"
        namespace: "{{ backend_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
      spec:
        refreshInterval: "{{ backend_secret_refresh_interval }}"
        secretStoreRef:
          kind: ClusterSecretStore
          name: "{{ cluster_secret_store_name }}"
        target:
          name: "{{ seed_admin_secret_name }}"
          creationPolicy: Owner
        dataFrom:
          - extract:
              key: "{{ openbao_kv_prefix }}/seed-admin"
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ manifest | to_json }}"
  environment: *kubeconfig
  register: seed_admin_external_secret_apply
  changed_when: "'configured' in seed_admin_external_secret_apply.stdout or 'created' in seed_admin_external_secret_apply.stdout"

- name: seed-admin 동기화 대기
  ansible.builtin.command: >-
    kubectl -n {{ backend_namespace }} wait --for=condition=Ready
    externalsecret/{{ seed_admin_secret_name }} --timeout=60s
  environment: *kubeconfig
  register: seed_admin_external_secret_ready
  changed_when: false
  failed_when: false

- name: seed-admin 동기화 실패 원인
  ansible.builtin.command: >-
    kubectl -n {{ backend_namespace }} get externalsecret {{ seed_admin_secret_name }}
    -o 'jsonpath={.status.conditions[?(@.type=="Ready")].message}'
  environment: *kubeconfig
  register: seed_admin_external_secret_message
  changed_when: false
  when: seed_admin_external_secret_ready.rc != 0

- name: seed-admin 동기화 실패 안내 (계속 진행)
  ansible.builtin.debug:
    msg: >-
      ExternalSecret {{ backend_namespace }}/{{ seed_admin_secret_name }} 이 Ready 가 아닙니다:
      {{ seed_admin_external_secret_message.stdout | default('?') }}.
      OpenBao {{ openbao_kv_prefix }}/seed-admin 에 SEED_ADMIN_EMAIL · SEED_ADMIN_PASSWORD 속성을 넣으세요 (README 7-5).
      서비스는 영향 없고 seed Job 만 Secret 이 생길 때까지 기다립니다.
  when: seed_admin_external_secret_ready.rc != 0

- name: 안내
  ansible.builtin.debug:
    msg:
      - "Secret {{ backend_namespace }}/gitlab-registry ({{ gitlab_registry }}) 적용, {{ backend_namespace }}/{{ backend_secret_name }} · {{ seed_admin_secret_name }} 은 ESO 가 OpenBao 에서 동기화"
      - >-
        backend-secrets 는 Pod 기동 시에만 읽힙니다. OpenBao 값을 바꿨다면 ESO 반영({{ backend_secret_refresh_interval }} 주기 또는
        force-sync annotation, README 16-4) 후 kubectl -n {{ backend_namespace }} rollout restart deployment 로 재기동하세요.
