---
# backend 네임스페이스와 레지스트리 pull Secret 을 만듭니다. (차트 · ArgoCD 는 Namespace 를 만들지 않음 — CreateNamespace=false)
#   gitlab-registry : GitLab Container Registry pull (그룹 Deploy Token, read_registry) — Ansible 이 직접
# backend-secrets · seed-admin 은 gitops 레포의 ArgoCD backend-secrets 앱이 ExternalSecret 으로 만듭니다
#   (OpenBao 원본을 ESO 가 동기화, 매핑은 gitops envs/dev/backend-secrets.yaml — 운영과 같은 방식 · README 16절)
# 값은 stdin 으로 kubectl apply 에 넘겨 노드 디스크에 남기지 않습니다.
- name: 네임스페이스 ({{ backend_namespace }})
  vars:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ backend_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ manifest | to_json }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: backend_ns_apply
  changed_when: "'configured' in backend_ns_apply.stdout or 'created' in backend_ns_apply.stdout"

- name: 레지스트리 pull Secret ({{ backend_namespace }}/gitlab-registry)
  vars:
    dockerconfig:
      auths: >-
        {{ {gitlab_registry: {'username': registry_deploy_user,
                              'password': registry_deploy_token,
                              'auth': (registry_deploy_user ~ ':' ~ registry_deploy_token) | b64encode}} }}
    manifest:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/dockerconfigjson
      metadata:
        name: gitlab-registry
        namespace: "{{ backend_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
      data:
        .dockerconfigjson: "{{ dockerconfig | to_json | b64encode }}"
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ manifest | to_json }}"
  environment: &kubeconfig
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: pull_secret_apply
  changed_when: "'configured' in pull_secret_apply.stdout or 'created' in pull_secret_apply.stdout"
  no_log: true

- name: 안내
  ansible.builtin.debug:
    msg:
      - "Secret {{ backend_namespace }}/gitlab-registry ({{ gitlab_registry }}) 적용"
      - >-
        backend-secrets · seed-admin 은 ArgoCD backend-secrets 앱(gitops apps/dev/backend-secrets.yaml)이 관리합니다.
        key 추가 · 변경은 OpenBao 값 + gitops envs/dev/backend-secrets.yaml MR 로 합니다 (README 16-4).
