---
- name: Tailscale apt 저장소 등록
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"

- name: Tailscale 설치
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: tailscaled 활성화
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Tailnet 접속 상태 확인
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: OAuth client 로 Tailnet 등록
  # OAuth client secret 을 auth key 로 직접 사용 (태그 지정 필수)
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ ts_oauth_secret }}?ephemeral=false&preauthorized=true
    --advertise-tags={{ ts_tags }}
    --hostname={{ node_name }}
  when: >-
    ts_status.rc != 0 or
    (ts_status.stdout | from_json).BackendState != "Running"
  changed_when: true
  no_log: true

- name: Tailscale IPv4 조회
  ansible.builtin.command: tailscale ip -4
  register: ts_ip_out
  changed_when: false
  until: ts_ip_out.rc == 0 and ts_ip_out.stdout | length > 0
  retries: 10
  delay: 3

- name: ts_ip fact 등록
  ansible.builtin.set_fact:
    ts_ip: "{{ ts_ip_out.stdout_lines | first }}"

- name: Tailscale IP 출력
  ansible.builtin.debug:
    msg: "{{ node_name }} Tailscale IP = {{ ts_ip }}"
