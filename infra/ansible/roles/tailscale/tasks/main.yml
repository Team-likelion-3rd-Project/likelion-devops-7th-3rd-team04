---
- name: Tailscale apt 저장소 등록
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"

- name: Tailscale 설치
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: tailscaled 활성화
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Tailnet 접속 상태 확인
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: OAuth client 로 Tailnet 등록
  # OAuth client secret 을 auth key 로 직접 사용 (태그 지정 필수)
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ ts_oauth_secret }}?ephemeral=false&preauthorized=true
    --advertise-tags={{ ts_tags }}
    --hostname={{ node_name }}
  when: >-
    ts_status.rc != 0 or
    (ts_status.stdout | from_json).BackendState != "Running"
  register: ts_up
  changed_when: true
  failed_when: false
  no_log: true

- name: Tailnet 등록 실패 원인 출력 (secret 마스킹)
  ansible.builtin.fail:
    msg: >-
      tailscale up 실패 (rc={{ ts_up.rc }}, tags={{ ts_tags }}, hostname={{ node_name }}):
      {{ (ts_up.stderr ~ ' ' ~ ts_up.stdout) | regex_replace('tskey-[A-Za-z0-9_-]+', 'tskey-***') | trim }}
  when: ts_up is not skipped and ts_up.rc != 0

- name: Tailscale 설정 조회
  ansible.builtin.command: tailscale debug prefs
  register: ts_prefs
  changed_when: false

- name: 포워딩 트래픽 SNAT 끄기
  # 기본값이면 tailscale0 로 들어와 Pod 로 포워딩되는 패킷을 tailscaled 가 MASQUERADE 해서
  # Pod 가 보는 출발지가 노드 IP 로 바뀜 (클라이언트 IP 보존 불가). 서브넷 라우터가 아니므로 꺼도 영향 없음
  ansible.builtin.command: tailscale set --snat-subnet-routes=false
  when: not (ts_prefs.stdout | from_json).NoSNAT
  changed_when: true

- name: Tailscale IPv4 조회
  ansible.builtin.command: tailscale ip -4
  register: ts_ip_out
  changed_when: false
  until: ts_ip_out.rc == 0 and ts_ip_out.stdout | length > 0
  retries: 10
  delay: 3

- name: Tailscale DNS 이름 조회
  ansible.builtin.command: tailscale status --self --peers=false --json
  register: ts_self_out
  changed_when: false

- name: ts_ip / ts_fqdn fact 등록
  # ts_fqdn: MagicDNS 이름 (<hostname>.<tailnet>.ts.net). 호스트명이 겹치면 -1 등이 붙으므로 추정하지 않고 조회
  ansible.builtin.set_fact:
    ts_ip: "{{ ts_ip_out.stdout_lines | first }}"
    ts_fqdn: "{{ (ts_self_out.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"

- name: Tailscale IP 출력
  ansible.builtin.debug:
    msg: "{{ node_name }} Tailscale IP = {{ ts_ip }} ({{ ts_fqdn }})"
