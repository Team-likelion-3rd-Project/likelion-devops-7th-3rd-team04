---
- name: 커널 파라미터 (Valkey 권장값 / 동시 접속 대비)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-hotel-db.conf
    content: |
      vm.overcommit_memory = 1
      net.core.somaxconn = 4096
    mode: "0644"
  register: db_sysctl

- name: sysctl 적용
  ansible.builtin.command: sysctl --system
  when: db_sysctl.changed
  changed_when: true

- name: 설정 디렉토리 (비밀값 포함 → root 전용)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ db_base_dir }}"
    - "{{ db_base_dir }}/conf"
    - "{{ db_base_dir }}/mysql"
    - "{{ db_base_dir }}/minio"

- name: 데이터 디렉토리
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ db_data_dir }}/mariadb"
    - "{{ db_data_dir }}/valkey"
    - "{{ db_data_dir }}/minio"

- name: DynamoDB Local 데이터 디렉토리 (컨테이너 실행 사용자 소유)
  ansible.builtin.file:
    path: "{{ db_data_dir }}/dynamodb"
    state: directory
    owner: "{{ dynamodb_uid }}"
    group: "{{ dynamodb_uid }}"
    mode: "0750"

- name: MariaDB 튜닝 설정
  ansible.builtin.template:
    src: mariadb-tuning.cnf.j2
    dest: "{{ db_base_dir }}/conf/mariadb-tuning.cnf"
    mode: "0644"
  register: mariadb_conf

- name: Valkey 설정 (requirepass 포함)
  ansible.builtin.template:
    src: valkey.conf.j2
    dest: "{{ db_base_dir }}/conf/valkey.conf"
    mode: "0644"
  register: valkey_conf
  no_log: true

- name: 컨테이너 환경변수 파일
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ db_base_dir }}/{{ item }}"
    mode: "0600"
  loop: [mariadb.env, valkey.env, minio.env]
  no_log: true

- name: MinIO 앱 계정 정책 (minio_bucket 에만 읽기/쓰기)
  ansible.builtin.template:
    src: minio-app-policy.json.j2
    dest: "{{ db_base_dir }}/minio/app-policy.json"
    mode: "0644"
  register: minio_policy_file

- name: MinIO RAG 계정 정책 (minio_rag_bucket 에만 읽기/쓰기)
  ansible.builtin.template:
    src: minio-rag-policy.json.j2
    dest: "{{ db_base_dir }}/minio/rag-policy.json"
    mode: "0644"
  register: minio_rag_policy_file

- name: reconcile 용 client 자격증명 (명령행에 비밀번호 노출 방지)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ db_base_dir }}/mysql/{{ item }}"
    mode: "0600"
  loop: [root.cnf, app.cnf]
  no_log: true

- name: compose 파일
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ db_base_dir }}/compose.yml"
    mode: "0600"

- name: 컨테이너 기동 (healthy 까지 대기)
  # 설정 파일 checksum 을 label 로 넣어 두었으므로 설정이 바뀐 서비스만 재생성됨
  ansible.builtin.command: docker compose up -d --wait --wait-timeout 300
  args:
    chdir: "{{ db_base_dir }}"
  register: compose_up
  changed_when: >-
    'Started' in compose_up.stderr or
    'Recreated' in compose_up.stderr or
    'Created' in compose_up.stderr

# ── OpenBao(main-db) 값과 DB 계정 상태 맞추기 ─────────────────
# 공식 이미지는 MARIADB_* 를 최초 초기화 시 1회만 반영하므로,
# 매 실행마다 앱 계정으로 접속을 검사하고 실패할 때만 재설정합니다.
- name: 앱 계정 접속 검사
  ansible.builtin.command: >-
    docker exec mariadb mariadb --defaults-extra-file=/etc/mysql/ansible/app.cnf -e "SELECT 1"
  register: app_login
  changed_when: false
  failed_when: false

- name: DB / 앱 계정 재설정
  ansible.builtin.command:
    cmd: docker exec -i mariadb mariadb --defaults-extra-file=/etc/mysql/ansible/root.cnf
    stdin: |
      CREATE DATABASE IF NOT EXISTS `{{ db_database }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '{{ db_username }}'@'%' IDENTIFIED BY '{{ db_password }}';
      ALTER USER '{{ db_username }}'@'%' IDENTIFIED BY '{{ db_password }}';
      GRANT ALL PRIVILEGES ON `{{ db_database }}`.* TO '{{ db_username }}'@'%';
  when: app_login.rc != 0
  register: db_reconcile
  failed_when: false
  changed_when: db_reconcile.rc == 0
  no_log: true

- name: 재설정 실패 안내
  ansible.builtin.fail:
    msg: >-
      root 계정으로 DB 에 접속하지 못했습니다. OpenBao main-db-root 의 password(도입 전: backend/.env 의 DB_ROOT_PASSWORD)가
      최초 초기화 때 값과 다른 경우입니다 (root 비밀번호 변경은 자동화하지 않음 — README 참고).
  when: db_reconcile is not skipped and db_reconcile.rc != 0

- name: 앱 계정 접속 재검사
  ansible.builtin.command: >-
    docker exec mariadb mariadb --defaults-extra-file=/etc/mysql/ansible/app.cnf -e "SELECT 1"
  changed_when: false
  when: app_login.rc != 0

# ── GitLab CI smoke test 전용 계정 (ci_smoke_db_password 가 있을 때만) ──
# CI 는 파이프라인마다 ci_<id>(결제) · ci_main_<id>(메인) database 를 만들고 지움 → 마이그레이션 검증을 dev 데이터와 분리
- name: CI smoke 계정 client 자격증명
  ansible.builtin.template:
    src: ci_smoke.cnf.j2
    dest: "{{ db_base_dir }}/mysql/ci_smoke.cnf"
    mode: "0600"
  when: ci_smoke_db_password | length > 0
  no_log: true

- name: CI smoke 계정 권한 검사
  # 접속이 되고 ci\_% 권한이 있으면 통과 (매 실행 재설정하지 않음)
  ansible.builtin.command: >-
    docker exec mariadb mariadb --defaults-extra-file=/etc/mysql/ansible/ci_smoke.cnf
    -N -e "SHOW GRANTS FOR CURRENT_USER()"
  register: ci_smoke_grants
  changed_when: false
  failed_when: false
  when: ci_smoke_db_password | length > 0

- name: CI smoke 계정 재설정
  ansible.builtin.command:
    cmd: docker exec -i mariadb mariadb --defaults-extra-file=/etc/mysql/ansible/root.cnf
    stdin: |
      CREATE USER IF NOT EXISTS '{{ ci_smoke_db_user }}'@'%' IDENTIFIED BY '{{ ci_smoke_db_password }}';
      ALTER USER '{{ ci_smoke_db_user }}'@'%' IDENTIFIED BY '{{ ci_smoke_db_password }}';
      GRANT ALL PRIVILEGES ON `ci\_%`.* TO '{{ ci_smoke_db_user }}'@'%';
  when: >-
    ci_smoke_db_password | length > 0 and
    (ci_smoke_grants.rc != 0 or 'ci\_%' not in ci_smoke_grants.stdout)
  changed_when: true
  no_log: true

# ── DB 서버 지표용 exporter 계정 (OpenBao main-db-exporter 가 있을 때만, README 17-6) ──
# Alloy(node_collectors)가 127.0.0.1 로 접속. 서버 상태만 읽고 앱 데이터는 읽지 못하게 최소 권한
- name: exporter 계정 client 자격증명
  ansible.builtin.template:
    src: exporter.cnf.j2
    dest: "{{ db_base_dir }}/mysql/exporter.cnf"
    mode: "0600"
  when: db_exporter_password | length > 0
  no_log: true

- name: exporter 계정 권한 검사
  # 접속이 되고 권한이 맞으면 통과 (매 실행 재설정하지 않음)
  ansible.builtin.command: >-
    docker exec mariadb mariadb --defaults-extra-file=/etc/mysql/ansible/exporter.cnf
    -N -e "SHOW GRANTS FOR CURRENT_USER()"
  register: db_exporter_grants
  changed_when: false
  failed_when: false
  when: db_exporter_password | length > 0

- name: exporter 계정 재설정
  ansible.builtin.command:
    cmd: docker exec -i mariadb mariadb --defaults-extra-file=/etc/mysql/ansible/root.cnf
    stdin: |
      CREATE USER IF NOT EXISTS '{{ db_exporter_user }}'@'127.0.0.1' IDENTIFIED BY '{{ db_exporter_password }}' WITH MAX_USER_CONNECTIONS 3;
      ALTER USER '{{ db_exporter_user }}'@'127.0.0.1' IDENTIFIED BY '{{ db_exporter_password }}' WITH MAX_USER_CONNECTIONS 3;
      GRANT PROCESS, REPLICATION CLIENT, REPLICA MONITOR ON *.* TO '{{ db_exporter_user }}'@'127.0.0.1';
      GRANT SELECT ON performance_schema.* TO '{{ db_exporter_user }}'@'127.0.0.1';
  when: >-
    db_exporter_password | length > 0 and
    (db_exporter_grants.rc != 0
     or 'REPLICA MONITOR' not in db_exporter_grants.stdout
     or 'performance_schema' not in db_exporter_grants.stdout)
  changed_when: true
  no_log: true

# ── MinIO 버킷 · 앱 계정 상태 맞추기 ──────────────────────────
# mcli 의 alias(local=root, app=앱 계정)는 minio.env 의 MC_HOST_* 로 주입됨
- name: MinIO 버킷 확인
  ansible.builtin.command: docker exec minio mcli stat local/{{ minio_bucket }}
  register: minio_bucket_stat
  changed_when: false
  failed_when: false

- name: MinIO 버킷 생성
  ansible.builtin.command: docker exec minio mcli mb --ignore-existing local/{{ minio_bucket }}
  when: minio_bucket_stat.rc != 0
  changed_when: true

- name: MinIO 버킷 익명 접근 상태 확인
  ansible.builtin.command: docker exec minio mcli anonymous get local/{{ minio_bucket }}
  register: minio_bucket_anon
  changed_when: false

- name: MinIO 버킷 private 고정 (presigned URL 로만 접근)
  ansible.builtin.command: docker exec minio mcli anonymous set none local/{{ minio_bucket }}
  when: "'`private`' not in minio_bucket_anon.stdout"
  changed_when: true

- name: MinIO 앱 정책 확인
  ansible.builtin.command: docker exec minio mcli admin policy info local {{ minio_app_policy }}
  register: minio_policy_info
  changed_when: false
  failed_when: false

- name: MinIO 앱 정책 생성 / 갱신
  # 같은 이름으로 다시 만들면 내용이 갱신됨
  ansible.builtin.command: >-
    docker exec minio mcli admin policy create local {{ minio_app_policy }} /etc/minio/ansible/app-policy.json
  when: minio_policy_info.rc != 0 or minio_policy_file.changed
  changed_when: true

- name: MinIO 앱 계정 접속 검사
  ansible.builtin.command: docker exec minio mcli ls app/{{ minio_bucket }}
  register: minio_app_login
  changed_when: false
  failed_when: false

- name: MinIO 앱 계정 재설정
  # 계정이 없거나 secret 이 바뀐 경우. user add 는 기존 계정이면 secret 을 갱신함.
  # (secret 이 컨테이너 안 명령행에 잠깐 보임 — mcli 가 stdin 입력을 지원하지 않음)
  ansible.builtin.command: "{{ item }}"
  loop:
    - docker exec minio mcli admin user add local {{ minio_app_access_key }} {{ minio_app_secret_key }}
    - docker exec minio mcli admin policy attach local {{ minio_app_policy }} --user {{ minio_app_access_key }}
  when: minio_app_login.rc != 0
  register: minio_app_reconcile
  # 이미 붙어 있는 정책을 다시 attach 하면 오류 → 무시
  failed_when: minio_app_reconcile.rc != 0 and 'already' not in minio_app_reconcile.stderr
  changed_when: minio_app_reconcile.rc == 0
  no_log: true

- name: MinIO 앱 계정 접속 재검사
  ansible.builtin.command: docker exec minio mcli ls app/{{ minio_bucket }}
  changed_when: false
  when: minio_app_login.rc != 0

# ── RAG 인덱스 버킷 · 전용 계정 (llm-service VECTOR_STORE=object) ─────
# 앱 계정과 같은 방식. 객실 이미지 버킷과 권한을 나누려고 계정·정책을 따로 둠
- name: MinIO RAG 버킷 생성
  ansible.builtin.command: docker exec minio mcli mb --ignore-existing local/{{ minio_rag_bucket }}
  register: minio_rag_mb
  changed_when: "'created' in minio_rag_mb.stdout"

- name: MinIO RAG 버킷 private 고정
  ansible.builtin.command: docker exec minio mcli anonymous set none local/{{ minio_rag_bucket }}
  changed_when: false

- name: MinIO RAG 정책 확인
  ansible.builtin.command: docker exec minio mcli admin policy info local {{ minio_rag_policy }}
  register: minio_rag_policy_info
  changed_when: false
  failed_when: false

- name: MinIO RAG 정책 생성 / 갱신
  ansible.builtin.command: >-
    docker exec minio mcli admin policy create local {{ minio_rag_policy }} /etc/minio/ansible/rag-policy.json
  when: minio_rag_policy_info.rc != 0 or minio_rag_policy_file.changed
  changed_when: true

- name: MinIO RAG 계정 접속 검사
  ansible.builtin.command: docker exec minio mcli ls rag/{{ minio_rag_bucket }}
  register: minio_rag_login
  changed_when: false
  failed_when: false

- name: MinIO RAG 계정 재설정
  ansible.builtin.command: "{{ item }}"
  loop:
    - docker exec minio mcli admin user add local {{ minio_rag_access_key }} {{ minio_rag_secret_key }}
    - docker exec minio mcli admin policy attach local {{ minio_rag_policy }} --user {{ minio_rag_access_key }}
  when: minio_rag_login.rc != 0
  register: minio_rag_reconcile
  failed_when: minio_rag_reconcile.rc != 0 and 'already' not in minio_rag_reconcile.stderr
  changed_when: minio_rag_reconcile.rc == 0
  no_log: true

- name: MinIO RAG 계정 접속 재검사
  ansible.builtin.command: docker exec minio mcli ls rag/{{ minio_rag_bucket }}
  changed_when: false
  when: minio_rag_login.rc != 0

- name: 접속 정보
  ansible.builtin.debug:
    msg:
      - "MariaDB : {{ ts_ip }}:{{ db_port }}  (DB={{ db_database }}, USER={{ db_username }})"
      - "Valkey  : {{ ts_ip }}:{{ valkey_port }}"
      - "MinIO   : http://{{ ts_ip }}:{{ minio_api_port }}  (bucket={{ minio_bucket }}, region={{ minio_region }})"
      - "Console : http://{{ ts_ip }}:{{ minio_console_port }}  (MINIO_ROOT_USER 로 로그인)"
      - "RAG     : bucket={{ minio_rag_bucket }} (MINIO_RAG_ACCESS_KEY) → llm-service VECTOR_OBJECT_ENDPOINT=http://{{ ts_ip }}:{{ minio_api_port }}"
      - "DynamoDB: http://{{ ts_ip }}:{{ dynamodb_port }}  → chat-bot-service DYNAMODB_ENDPOINT"
      - "backend 연결 시 DB_HOST={{ ts_ip }}, S3_ENDPOINT=http://{{ ts_ip }}:{{ minio_api_port }}"
