---
# agent 하나를 등록하고, 로컬 .secrets 에 토큰이 없을 때만 새 토큰을 발급합니다. (vars: agent_name)
# 토큰을 다시 발급하면 기존 토큰은 폐기되므로 해당 클러스터의 agentk 도 k8s-cicd.yml 로 다시 설치해야 합니다.
- name: "agent 토큰 변수 이름 ({{ agent_name }})"
  ansible.builtin.set_fact:
    agent_token_key: "{{ agent_name | upper | replace('-', '_') }}_TOKEN"

- name: "agent 등록 ({{ agent_name }})"
  ansible.builtin.uri:
    url: "{{ gl_api }}/projects/{{ gl_ids[gitlab_agents_project_path] }}/cluster_agents"
    method: POST
    body:
      name: "{{ agent_name }}"
    status_code: 201
  register: agent_new
  when: agent_name not in (gl_agents_existing.json | map(attribute='name') | list)
  changed_when: true

- name: "agent id ({{ agent_name }})"
  ansible.builtin.set_fact:
    agent_id: >-
      {{ agent_new.json.id if agent_new is not skipped
         else (gl_agents_existing.json | selectattr('name', 'equalto', agent_name) | first).id }}

- name: "agent 토큰 재발급 ({{ agent_name }})"
  when: gl_k8s_env[agent_token_key] | default('') | length == 0
  block:
    - name: "기존 토큰 조회 ({{ agent_name }})"
      ansible.builtin.uri:
        url: "{{ gl_api }}/projects/{{ gl_ids[gitlab_agents_project_path] }}/cluster_agents/{{ agent_id }}/tokens"
      register: agent_tokens

    - name: "기존 토큰 폐기 ({{ agent_name }})"
      ansible.builtin.uri:
        url: "{{ gl_api }}/projects/{{ gl_ids[gitlab_agents_project_path] }}/cluster_agents/{{ agent_id }}/tokens/{{ item.id }}"
        method: DELETE
        status_code: 204
      loop: "{{ agent_tokens.json | selectattr('status', 'equalto', 'active') | list }}"
      loop_control:
        label: "{{ item.id }}"
      changed_when: true

    - name: "토큰 발급 ({{ agent_name }})"
      ansible.builtin.uri:
        url: "{{ gl_api }}/projects/{{ gl_ids[gitlab_agents_project_path] }}/cluster_agents/{{ agent_id }}/tokens"
        method: POST
        body:
          name: ansible
          description: "Ansible(gitlab.yml --tags bootstrap) 발급"
        status_code: 201
      register: agent_token_new
      changed_when: true
      no_log: true

    - name: "토큰 기록 ({{ agent_name }})"
      ansible.builtin.set_fact:
        gl_k8s_env: "{{ gl_k8s_env | combine({agent_token_key: agent_token_new.json.token}) }}"
      no_log: true
