---
# Project Access Token 을 새로 발급합니다. 같은 이름의 기존 활성 토큰은 먼저 폐기합니다.
# 토큰 값은 발급 때만 볼 수 있으므로, 호출하는 쪽에서 "저장된 값이 없을 때만" include 합니다.
# vars: pat_project (gl_ids 키), pat_name, pat_scopes / 결과: pat_token
- name: "기존 토큰 조회 ({{ pat_project }} / {{ pat_name }})"
  ansible.builtin.uri:
    url: "{{ gl_api }}/projects/{{ gl_ids[pat_project] }}/access_tokens?state=active"
  register: pat_existing

- name: "기존 토큰 폐기 ({{ pat_project }} / {{ pat_name }})"
  ansible.builtin.uri:
    url: "{{ gl_api }}/projects/{{ gl_ids[pat_project] }}/access_tokens/{{ item.id }}"
    method: DELETE
    status_code: 204
  loop: "{{ pat_existing.json | selectattr('name', 'equalto', pat_name) | list }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: true

- name: "토큰 발급 ({{ pat_project }} / {{ pat_name }}, Maintainer)"
  ansible.builtin.uri:
    url: "{{ gl_api }}/projects/{{ gl_ids[pat_project] }}/access_tokens"
    method: POST
    body:
      name: "{{ pat_name }}"
      scopes: "{{ pat_scopes }}"
      access_level: 40
      expires_at: "{{ '%Y-%m-%d' | strftime((ansible_date_time.epoch | int) + gitlab_access_token_days * 86400) }}"
    status_code: 201
  register: pat_new
  changed_when: true
  no_log: true

- name: "토큰 기록 ({{ pat_name }})"
  ansible.builtin.set_fact:
    pat_token: "{{ pat_new.json.token }}"
  no_log: true
