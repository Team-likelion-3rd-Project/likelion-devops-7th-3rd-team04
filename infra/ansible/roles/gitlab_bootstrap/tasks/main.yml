---
# CI/CD 에 필요한 GitLab 리소스를 REST API 로 멱등하게 맞춥니다. (--tags bootstrap 단독 실행 가능)
#   그룹/프로젝트 → gitops 초기 values · apps/dev → Deploy Token(k8s 레지스트리 / ArgoCD 레포 / 결제 노드)
#   → gitops push 토큰(CI 변수) → 미러 push 토큰 → 보호 브랜치 → smoke test CI 변수 → 레지스트리 cleanup policy
# 발급된 토큰은 OpenBao gitlab-k8s · github-mirror · payment-node 와 로컬 .secrets/<같은 이름>.env 에 저장 (이미 있으면 재사용).
# OpenBao 가 있으면 OpenBao 값을 우선 재사용 — 파일이 없는 팀원 PC 에서 실행해도 토큰을 다시 발급하지 않음 (README 16-7)
- name: Tailscale 정보 조회 (--tags bootstrap 단독 실행 대비)
  ansible.builtin.command: tailscale status --self --peers=false --json
  register: gl_ts_self
  changed_when: false
  when: ts_ip is not defined or ts_fqdn is not defined

- name: ts_ip / ts_fqdn / gitlab_url fact 등록
  ansible.builtin.set_fact:
    ts_ip: "{{ ts_ip if gl_ts_self is skipped else ((gl_ts_self.stdout | from_json).Self.TailscaleIPs | select('match', '^[0-9.]+$') | first) }}"
    ts_fqdn: "{{ ts_fqdn if gl_ts_self is skipped else ((gl_ts_self.stdout | from_json).Self.DNSName | regex_replace('\\.$', '')) }}"

- name: gitlab_fqdn / gitlab_url
  ansible.builtin.set_fact:
    gitlab_fqdn: "{{ ts_fqdn }}"
    gitlab_url: "https://{{ ts_fqdn }}"
    gl_api: "http://127.0.0.1:{{ gitlab_http_port }}/api/v4"
    gl_ids: {}

# ── 로컬에 저장된 토큰 읽기 (있으면 재발급하지 않음) ─────────────
- name: 로컬 .secrets 디렉토리
  ansible.builtin.file:
    path: "{{ local_secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: OpenBao 값 읽기 (기존 토큰 · smoke test 값)
  ansible.builtin.include_role:
    name: openbao_kv
    tasks_from: read
  vars:
    openbao_read_paths: "{{ gitlab_openbao_paths }}"

- name: 기존 토큰 파일 확인
  ansible.builtin.stat:
    path: "{{ local_secrets_dir }}/{{ item }}"
  loop: [gitlab-k8s.env, github-mirror.env, payment-node.env]
  register: gl_secret_files
  delegate_to: localhost
  become: false

# OpenBao 값 → 로컬 파일 순으로 사용
- name: 기존 토큰 읽기
  ansible.builtin.set_fact:
    gl_k8s_env: >-
      {{ openbao_kv['gitlab-k8s'] | default((lookup('ansible.builtin.file', local_secrets_dir ~ '/gitlab-k8s.env') | parse_dotenv)
         if gl_secret_files.results[0].stat.exists else {}) }}
    gl_mirror_env: >-
      {{ openbao_kv['github-mirror'] | default((lookup('ansible.builtin.file', local_secrets_dir ~ '/github-mirror.env') | parse_dotenv)
         if gl_secret_files.results[1].stat.exists else {}) }}
    gl_payment_env: >-
      {{ openbao_kv['payment-node'] | default((lookup('ansible.builtin.file', local_secrets_dir ~ '/payment-node.env') | parse_dotenv)
         if gl_secret_files.results[2].stat.exists else {}) }}
  no_log: true

# ── 단기 관리자 토큰 ───────────────────────────────────────
- name: 부트스트랩 PAT 발급 스크립트
  ansible.builtin.template:
    src: bootstrap_pat.rb.j2
    dest: "{{ gitlab_base_dir }}/scripts/bootstrap_pat.rb"
    mode: "0644"

- name: 부트스트랩 PAT 발급 (root, 1일)
  # gitlab_runner_token role 과 같은 방식 — 스크립트 내용을 읽어 코드 문자열로 넘김 (30초~1분)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - gitlab
      - sh
      - -c
      - 'gitlab-rails runner "$(cat /opt/ansible-scripts/bootstrap_pat.rb)"'
  register: gl_pat_out
  changed_when: false
  failed_when: false
  no_log: true

- name: PAT 발급 실패 원인 출력 (토큰 마스킹)
  ansible.builtin.fail:
    msg: >-
      gitlab-rails runner 실패 (rc={{ gl_pat_out.rc }}):
      {{ (gl_pat_out.stderr ~ ' ' ~ gl_pat_out.stdout)
         | regex_replace('glpat-[A-Za-z0-9_.-]+', 'glpat-***')
         | regex_replace('\s+', ' ') | trim | truncate(2000) }}
  when: gl_pat_out.rc != 0 or gl_pat_out.stdout is not search('BOOTSTRAP_PAT=glpat-')

- name: PAT 추출
  ansible.builtin.set_fact:
    gl_token: "{{ gl_pat_out.stdout_lines | select('match', '^BOOTSTRAP_PAT=') | first | regex_replace('^BOOTSTRAP_PAT=', '') }}"
  no_log: true

- name: GitLab API 응답 대기 (재기동 직후 / --tags bootstrap 단독 실행 대비)
  # gitlab.rb 변경으로 컨테이너가 재생성된 직후나 메모리가 빠듯하면 puma 가 한동안 응답하지 않음
  # (gitlab_stack 의 loopback 대기는 --tags bootstrap 단독 실행 때 건너뛰어짐)
  ansible.builtin.uri:
    url: "{{ gl_api }}/version"
    headers:
      PRIVATE-TOKEN: "{{ gl_token }}"
    timeout: 60
    status_code: 200
  register: gl_api_ready
  until: gl_api_ready.status == 200
  retries: 30
  delay: 10
  no_log: true

- name: GitLab 리소스 구성
  module_defaults:
    ansible.builtin.uri:
      headers:
        PRIVATE-TOKEN: "{{ gl_token }}"
      body_format: json
      return_content: true
      # 기본 30초 — 첫 호출(캐시 워밍)이나 메모리 부족 시 넘길 수 있음
      timeout: 120
  block:
    # ── 그룹 / 프로젝트 ───────────────────────────────────
    - name: 그룹
      ansible.builtin.include_tasks: group.yml
      loop:
        - {grp_path: "{{ gitlab_group }}"}
        - {grp_path: "{{ gitlab_infra_subgroup }}", grp_parent: "{{ gitlab_group }}"}
      loop_control:
        loop_var: grp
        label: "{{ grp.grp_path }}"
      vars:
        grp_path: "{{ grp.grp_path }}"
        grp_parent: "{{ grp.grp_parent | default('') }}"

    - name: 프로젝트
      ansible.builtin.include_tasks: project.yml
      loop:
        - prj_namespace: "{{ gitlab_group }}"
          prj_path: "{{ gitlab_app_project }}"
          prj_description: "GitHub 모노레포 미러 (GitHub Actions 가 push — 직접 커밋 금지)"
        - prj_namespace: "{{ gitlab_group }}/{{ gitlab_infra_subgroup }}"
          prj_path: "{{ gitlab_gitops_project }}"
          prj_description: "dev 배포 상태 — Helm values · 이미지 태그 · ArgoCD Application (main 커밋 = 배포, ArgoCD 가 sync)"
          prj_extra: {builds_access_level: disabled}
      loop_control:
        loop_var: prj
        label: "{{ prj.prj_path }}"
      vars:
        prj_namespace: "{{ prj.prj_namespace }}"
        prj_path: "{{ prj.prj_path }}"
        prj_description: "{{ prj.prj_description }}"
        prj_extra: "{{ prj.prj_extra | default({}) }}"

    # ── gitops 초기 values (레포가 비어 있을 때만) ─────────────
    - name: gitops 초기 values 커밋
      ansible.builtin.include_tasks: repo_files.yml
      vars:
        rf_project: "{{ gitlab_gitops_project_path }}"
        rf_message: "chore: 초기 values (backend-deploy/gitops-seed)"
        rf_seed_only: true
        rf_files: "{{ gitlab_gitops_seed_files }}"

    # ArgoCD root app(dev-apps)이 바라보는 apps/dev 디렉터리 유지 (README 만 — Application 은 사람이/CI 가 커밋)
    - name: gitops apps/dev README 커밋
      ansible.builtin.include_tasks: repo_files.yml
      vars:
        rf_project: "{{ gitlab_gitops_project_path }}"
        rf_message: "chore: apps/dev README (Ansible gitlab_bootstrap)"
        rf_files: "{{ gitlab_gitops_managed_files }}"

    # ── 레지스트리 pull 용 그룹 Deploy Token ─────────────────
    - name: 레지스트리 Deploy Token 재발급
      when: gl_k8s_env.REGISTRY_DEPLOY_TOKEN | default('') | length == 0
      block:
        - name: 기존 Deploy Token 조회
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens?active=true"
          register: gl_deploy_tokens

        - name: 기존 Deploy Token 폐기
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens/{{ item.id }}"
            method: DELETE
            status_code: 204
          loop: "{{ gl_deploy_tokens.json | selectattr('name', 'equalto', gitlab_registry_deploy_token_name) | list }}"
          loop_control:
            label: "{{ item.id }}"
          changed_when: true

        - name: Deploy Token 발급 (read_registry)
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens"
            method: POST
            body:
              name: "{{ gitlab_registry_deploy_token_name }}"
              username: "{{ gitlab_registry_deploy_token_name }}"
              scopes: [read_registry]
            status_code: 201
          register: gl_deploy_token_new
          changed_when: true
          no_log: true

        - name: Deploy Token 기록
          ansible.builtin.set_fact:
            gl_k8s_env: >-
              {{ gl_k8s_env | combine({'REGISTRY_DEPLOY_USER': gl_deploy_token_new.json.username,
                                       'REGISTRY_DEPLOY_TOKEN': gl_deploy_token_new.json.token}) }}
          no_log: true

    # ── ArgoCD 용 그룹 Deploy Token (차트 미러 · gitops 레포 읽기) ──
    # 레지스트리 pull 토큰과 분리 (따로 폐기 가능). team04 아래 레포 전체를 읽음 — ArgoCD AppProject 가 레포를 다시 좁힘
    - name: ArgoCD Deploy Token 재발급
      when: gl_k8s_env.ARGOCD_REPO_TOKEN | default('') | length == 0
      block:
        - name: 기존 ArgoCD Deploy Token 조회
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens?active=true"
          register: gl_argocd_deploy_tokens

        - name: 기존 ArgoCD Deploy Token 폐기
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens/{{ item.id }}"
            method: DELETE
            status_code: 204
          loop: "{{ gl_argocd_deploy_tokens.json | selectattr('name', 'equalto', gitlab_argocd_deploy_token_name) | list }}"
          loop_control:
            label: "{{ item.id }}"
          changed_when: true

        - name: ArgoCD Deploy Token 발급 (read_repository)
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens"
            method: POST
            body:
              name: "{{ gitlab_argocd_deploy_token_name }}"
              username: "{{ gitlab_argocd_deploy_token_name }}"
              scopes: [read_repository]
            status_code: 201
          register: gl_argocd_deploy_token_new
          changed_when: true
          no_log: true

        - name: ArgoCD Deploy Token 기록
          ansible.builtin.set_fact:
            gl_k8s_env: >-
              {{ gl_k8s_env | combine({'ARGOCD_REPO_USER': gl_argocd_deploy_token_new.json.username,
                                       'ARGOCD_REPO_TOKEN': gl_argocd_deploy_token_new.json.token}) }}
          no_log: true

    # ── 결제 노드용 그룹 Deploy Token (이미지 pull + gitops 태그 조회) ──
    # 결제 노드는 클러스터 밖에서 docker pull / git clone 을 하므로 k8s 용 토큰과 분리 (따로 폐기 가능)
    - name: 결제 노드 Deploy Token 재발급
      when: gl_payment_env.PAYMENT_DEPLOY_TOKEN | default('') | length == 0
      block:
        - name: 기존 결제 노드 Deploy Token 조회
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens?active=true"
          register: gl_payment_deploy_tokens

        - name: 기존 결제 노드 Deploy Token 폐기
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens/{{ item.id }}"
            method: DELETE
            status_code: 204
          loop: "{{ gl_payment_deploy_tokens.json | selectattr('name', 'equalto', gitlab_payment_deploy_token_name) | list }}"
          loop_control:
            label: "{{ item.id }}"
          changed_when: true

        - name: 결제 노드 Deploy Token 발급 (read_registry, read_repository)
          ansible.builtin.uri:
            url: "{{ gl_api }}/groups/{{ gl_ids[gitlab_group] }}/deploy_tokens"
            method: POST
            body:
              name: "{{ gitlab_payment_deploy_token_name }}"
              username: "{{ gitlab_payment_deploy_token_name }}"
              scopes: [read_registry, read_repository]
            status_code: 201
          register: gl_payment_deploy_token_new
          changed_when: true
          no_log: true

        - name: 결제 노드 Deploy Token 기록
          ansible.builtin.set_fact:
            gl_payment_env: >-
              {{ gl_payment_env | combine({'PAYMENT_DEPLOY_USER': gl_payment_deploy_token_new.json.username,
                                           'PAYMENT_DEPLOY_TOKEN': gl_payment_deploy_token_new.json.token}) }}
          no_log: true

    # ── gitops push 토큰 → team04/hotel CI 변수 ───────────────
    - name: GITOPS_PUSH_TOKEN 존재 확인
      ansible.builtin.uri:
        url: "{{ gl_api }}/projects/{{ gl_ids[gitlab_app_project_path] }}/variables/GITOPS_PUSH_TOKEN"
        status_code: [200, 404]
      register: gl_gitops_var
      no_log: true

    - name: gitops push 토큰 발급 / CI 변수 등록 (삭제 후 재실행하면 교체)
      when: gl_gitops_var.status == 404
      block:
        - name: gitops push 토큰 발급
          ansible.builtin.include_tasks: access_token.yml
          vars:
            pat_project: "{{ gitlab_gitops_project_path }}"
            pat_name: ci-gitops-push
            pat_scopes: [read_repository, write_repository]

        - name: GITOPS_PUSH_TOKEN 등록
          ansible.builtin.include_tasks: ci_variable.yml
          vars:
            var_project: "{{ gitlab_app_project_path }}"
            var_key: GITOPS_PUSH_TOKEN
            var_value: "{{ pat_token }}"
            var_masked: true

    # ── GitHub Actions 미러 push 토큰 ─────────────────────
    - name: 미러 push 토큰 발급
      ansible.builtin.include_tasks: access_token.yml
      vars:
        pat_project: "{{ gitlab_app_project_path }}"
        pat_name: github-mirror
        pat_scopes: [read_repository, write_repository]
      when: gl_mirror_env.GITLAB_MIRROR_TOKEN | default('') | length == 0

    - name: 미러 토큰 기록
      ansible.builtin.set_fact:
        gl_mirror_env: "{{ gl_mirror_env | combine({'GITLAB_MIRROR_TOKEN': pat_token}) }}"
      when: gl_mirror_env.GITLAB_MIRROR_TOKEN | default('') | length == 0
      no_log: true

    - name: 보호 브랜치 (force push 허용)
      ansible.builtin.include_tasks: protected_branch.yml
      loop: "{{ gitlab_protected_branches }}"
      loop_control:
        loop_var: branch_name

    # ── 이미지 smoke test 용 dev DB 접속 정보 → CI 변수 ──────────
    - name: smoke test CI 변수
      ansible.builtin.include_tasks: ci_variable.yml
      loop:
        - {key: SMOKE_DB_HOST, value: "{{ smoke_db_host }}", masked: false}
        - {key: SMOKE_DB_PORT, value: "{{ smoke_db_port }}", masked: false}
        - {key: SMOKE_DB_USER, value: "{{ smoke_db_user }}", masked: false}
        - {key: SMOKE_DB_PASSWORD, value: "{{ smoke_db_password }}", masked: true}
        - {key: SMOKE_REDIS_PORT, value: "{{ smoke_redis_port }}", masked: false}
        - {key: SMOKE_REDIS_PASSWORD, value: "{{ smoke_redis_password }}", masked: true}
      loop_control:
        loop_var: civar
        label: "{{ civar.key }}"
      vars:
        var_project: "{{ gitlab_app_project_path }}"
        var_key: "{{ civar.key }}"
        var_value: "{{ civar.value }}"
        var_masked: "{{ civar.masked }}"
      when: smoke_db_host | length > 0 and smoke_db_password | length > 0

    - name: smoke test 변수 누락 안내
      ansible.builtin.debug:
        msg: "DB_TS_IP / CI_SMOKE_DB_PASSWORD 가 비어 있어 smoke test 변수를 건너뜁니다 — test:image job 이 실패합니다 (README 12-2)"
      when: smoke_db_host | length == 0 or smoke_db_password | length == 0

    # ── 레지스트리 cleanup: smoke 전 후보 태그(ci-*) 정리 ──────────
    # 승격된 최종 태그(<sha>)는 대상이 아님. GitLab registry 는 태그 단위로 지우므로
    # 같은 digest 를 가리키는 최종 태그는 남음
    - name: 레지스트리 cleanup policy
      vars:
        current: "{{ gl_projects[gitlab_app_project_path].container_expiration_policy | default({}) }}"
      ansible.builtin.uri:
        url: "{{ gl_api }}/projects/{{ gl_ids[gitlab_app_project_path] }}"
        method: PUT
        body:
          container_expiration_policy_attributes: "{{ gitlab_registry_cleanup_policy }}"
        status_code: 200
      when: >-
        (current.enabled | default(false)) != gitlab_registry_cleanup_policy.enabled
        or current.name_regex | default('') != gitlab_registry_cleanup_policy.name_regex_delete
        or current.older_than | default('') != gitlab_registry_cleanup_policy.older_than
      register: gl_cleanup_policy
      # 프로젝트 전체 업데이트 API 라 GitLab 이 느릴 때 puma 요청 제한(60초)에 걸려 500 이 날 수 있음 → 재시도
      until: gl_cleanup_policy.status | default(0) == 200
      retries: 2
      delay: 30
      # 정리 정책은 없어도 파이프라인이 동작하므로 실패해도 다른 결과(토큰 등)는 유지
      failed_when: false
      changed_when: gl_cleanup_policy.status | default(0) == 200

    - name: cleanup policy 설정 실패 안내
      ansible.builtin.debug:
        msg: >-
          레지스트리 cleanup policy 설정에 실패했습니다 (HTTP {{ gl_cleanup_policy.status | default('?') }}).
          나중에 --tags bootstrap 을 다시 실행하거나, GitLab {{ gitlab_app_project_path }} → Settings → Packages and registries
          → Cleanup policies 에서 직접 켜세요 (정리 대상 정규식 {{ gitlab_registry_cleanup_policy.name_regex_delete }}, 7일).
      when: gl_cleanup_policy is not skipped and gl_cleanup_policy.status | default(0) != 200

  always:
    - name: 부트스트랩 PAT 폐기
      ansible.builtin.uri:
        url: "{{ gl_api }}/personal_access_tokens/self"
        method: DELETE
        headers:
          PRIVATE-TOKEN: "{{ gl_token }}"
        status_code: 204
      changed_when: false
      failed_when: false

    # 중간에 실패해도 이미 새로 발급된 토큰(기존 것은 폐기됨)을 잃지 않도록 always 에서 저장
    # ── 로컬 .secrets 저장 ────────────────────────────────────
    - name: k8s-cicd.yml 용 gitlab-k8s.env 생성 (로컬)
      ansible.builtin.copy:
        dest: "{{ local_secrets_dir }}/gitlab-k8s.env"
        content: |
          # gitlab.yml --tags bootstrap 이 생성 — 커밋 금지, 팀 비밀 채널로만 공유
          # 값을 지우고 다시 실행하면 해당 토큰만 재발급 (기존 토큰은 폐기됨)
          GITLAB_URL={{ gitlab_url }}
          GITLAB_TS_IP={{ ts_ip }}
          GITLAB_REGISTRY={{ gitlab_fqdn }}:{{ gitlab_registry_port }}
          REGISTRY_DEPLOY_USER={{ gl_k8s_env.REGISTRY_DEPLOY_USER | default('') }}
          REGISTRY_DEPLOY_TOKEN={{ gl_k8s_env.REGISTRY_DEPLOY_TOKEN | default('') }}
          ARGOCD_REPO_USER={{ gl_k8s_env.ARGOCD_REPO_USER | default('') }}
          ARGOCD_REPO_TOKEN={{ gl_k8s_env.ARGOCD_REPO_TOKEN | default('') }}
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: payment.yml 용 payment-node.env 생성 (로컬)
      ansible.builtin.copy:
        dest: "{{ local_secrets_dir }}/payment-node.env"
        content: |
          # gitlab.yml --tags bootstrap 이 생성 — 커밋 금지, 결제 노드 담당자에게 비밀 채널로만 공유
          # PAYMENT_DEPLOY_TOKEN 을 지우고 다시 실행하면 재발급 (기존 토큰은 폐기됨)
          GITLAB_URL={{ gitlab_url }}
          GITLAB_TS_IP={{ ts_ip }}
          GITLAB_REGISTRY={{ gitlab_fqdn }}:{{ gitlab_registry_port }}
          PAYMENT_DEPLOY_USER={{ gl_payment_env.PAYMENT_DEPLOY_USER | default('') }}
          PAYMENT_DEPLOY_TOKEN={{ gl_payment_env.PAYMENT_DEPLOY_TOKEN | default('') }}
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: GitHub Secrets 용 github-mirror.env 생성 (로컬)
      ansible.builtin.copy:
        dest: "{{ local_secrets_dir }}/github-mirror.env"
        content: |
          # gitlab.yml --tags bootstrap 이 생성 — 커밋 금지
          # GitHub 레포 Settings → Secrets and variables → Actions 에 등록 (README 12-4)
          GITLAB_HOST={{ gitlab_fqdn }}
          GITLAB_MIRROR_REPO={{ gitlab_app_project_path }}
          GITLAB_MIRROR_TOKEN={{ gl_mirror_env.GITLAB_MIRROR_TOKEN | default('') }}
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    # 파일과 같은 값을 OpenBao 에도 (k8s-cicd.yml · payment.yml 이 OpenBao 에서 읽음)
    - name: OpenBao 저장 (gitlab-k8s · payment-node · github-mirror)
      ansible.builtin.include_role:
        name: openbao_kv
        tasks_from: write
      vars:
        openbao_write_path: "{{ gl_bundle.path }}"
        openbao_write_data: "{{ gl_bundle.data }}"
      loop:
        - path: gitlab-k8s
          data:
            GITLAB_URL: "{{ gitlab_url }}"
            GITLAB_TS_IP: "{{ ts_ip }}"
            GITLAB_REGISTRY: "{{ gitlab_fqdn }}:{{ gitlab_registry_port }}"
            REGISTRY_DEPLOY_USER: "{{ gl_k8s_env.REGISTRY_DEPLOY_USER | default('') }}"
            REGISTRY_DEPLOY_TOKEN: "{{ gl_k8s_env.REGISTRY_DEPLOY_TOKEN | default('') }}"
            ARGOCD_REPO_USER: "{{ gl_k8s_env.ARGOCD_REPO_USER | default('') }}"
            ARGOCD_REPO_TOKEN: "{{ gl_k8s_env.ARGOCD_REPO_TOKEN | default('') }}"
        - path: payment-node
          data:
            GITLAB_URL: "{{ gitlab_url }}"
            GITLAB_TS_IP: "{{ ts_ip }}"
            GITLAB_REGISTRY: "{{ gitlab_fqdn }}:{{ gitlab_registry_port }}"
            PAYMENT_DEPLOY_USER: "{{ gl_payment_env.PAYMENT_DEPLOY_USER | default('') }}"
            PAYMENT_DEPLOY_TOKEN: "{{ gl_payment_env.PAYMENT_DEPLOY_TOKEN | default('') }}"
        - path: github-mirror
          data:
            GITLAB_HOST: "{{ gitlab_fqdn }}"
            GITLAB_MIRROR_REPO: "{{ gitlab_app_project_path }}"
            GITLAB_MIRROR_TOKEN: "{{ gl_mirror_env.GITLAB_MIRROR_TOKEN | default('') }}"
      loop_control:
        loop_var: gl_bundle
        label: "{{ gl_bundle.path }}"

- name: 안내
  ansible.builtin.debug:
    msg:
      - "GitLab 프로젝트: {{ gitlab_url }}/{{ gitlab_app_project_path }} (미러), {{ gitlab_gitops_project_path }}"
      - "토큰은 OpenBao {{ openbao_kv_prefix }}/gitlab-k8s · payment-node · github-mirror 에도 저장 (OPENBAO_ADDR 이 있을 때)"
      - "k8s 용 토큰: {{ local_secrets_dir }}/gitlab-k8s.env → k8s-cicd.yml 실행 시 source"
      - "GitHub 용 토큰: {{ local_secrets_dir }}/github-mirror.env → GitHub Actions Secrets 등록"
      - "결제 노드 용 토큰: {{ local_secrets_dir }}/payment-node.env → payment.yml 실행 시 source"
