---
# MariaDB / Valkey 는 host 네트워크로 0.0.0.0 에 바인딩 → ufw 로 tailscale0 에서만 허용.
# (Docker 포트 publish 는 ufw 를 우회하므로 host 네트워크 + ufw 조합을 사용)
- name: ufw 현재 상태 조회
  ansible.builtin.command: ufw status verbose
  register: ufw_status
  changed_when: false

- name: ufw 규칙 추가
  ansible.builtin.command: "ufw {{ item }}"
  loop:
    - "allow {{ ansible_port | default(22) }}/tcp"                                   # SSH (Ansible: 사설 IP 경유)
    - "allow 41641/udp"                                                               # Tailscale direct 연결 (DERP 경유 방지)
    - "allow in on {{ tailscale_interface }} to any port {{ db_port }} proto tcp"     # MariaDB
    - "allow in on {{ tailscale_interface }} to any port {{ valkey_port }} proto tcp" # Valkey
  register: ufw_rules
  changed_when: "'Rule added' in ufw_rules.stdout or 'Rule updated' in ufw_rules.stdout"

- name: 기본 정책 (incoming deny)
  ansible.builtin.command: ufw default deny incoming
  when: "'deny (incoming)' not in ufw_status.stdout"
  changed_when: true

- name: ufw 활성화
  ansible.builtin.command: ufw --force enable
  when: "'Status: active' not in ufw_status.stdout"
  changed_when: true
