---
# 수직 경로(ALB → 워커 NodePort → Traefik → 파드) 검증용 테스트 백엔드
- name: whoami 매니페스트 생성
  ansible.builtin.template:
    src: whoami.yaml.j2
    dest: /etc/kubernetes/whoami.yaml
    mode: "0644"

- name: namespace / Deployment / Service / Ingress 적용
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/whoami.yaml
  environment: &kubeconfig
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: whoami_apply
  changed_when: "'configured' in whoami_apply.stdout or 'created' in whoami_apply.stdout"

- name: whoami Deployment Ready 대기
  ansible.builtin.command: >-
    kubectl rollout status deployment/whoami -n {{ whoami_namespace }} --timeout=180s
  environment: *kubeconfig
  changed_when: false
