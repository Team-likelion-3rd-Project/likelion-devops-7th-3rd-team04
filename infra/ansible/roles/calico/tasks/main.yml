---
# v3.30 부터 CRD 는 tigera-operator.yaml 에서 분리되어 operator-crds.yaml 로 제공됨.
# CRD / operator 를 각각 존재 여부로 판단해야 부분 설치 상태에서 재실행해도 이어서 진행됨.
- name: Calico operator CRD 설치 여부 확인
  ansible.builtin.command: kubectl get crd installations.operator.tigera.io
  environment: &kubeconfig
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: crd_check
  changed_when: false
  failed_when: false

- name: Calico operator CRD 설치
  # CRD 는 크기가 커서 apply 시 annotation 크기 제한에 걸리므로 create 사용
  ansible.builtin.command: >-
    kubectl create -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/operator-crds.yaml
  environment: *kubeconfig
  when: crd_check.rc != 0
  changed_when: true

- name: Operator CRD 등록 대기
  ansible.builtin.command: >-
    kubectl wait --for condition=established --timeout=120s
    crd/installations.operator.tigera.io crd/apiservers.operator.tigera.io crd/tigerastatuses.operator.tigera.io
  environment: *kubeconfig
  changed_when: false

- name: tigera-operator 설치 여부 확인
  ansible.builtin.command: kubectl get deployment tigera-operator -n tigera-operator
  environment: *kubeconfig
  register: operator_check
  changed_when: false
  failed_when: false

- name: tigera-operator 설치
  ansible.builtin.command: >-
    kubectl create -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  environment: *kubeconfig
  when: operator_check.rc != 0
  changed_when: true

- name: tigera-operator Ready 대기
  ansible.builtin.command: kubectl rollout status deployment/tigera-operator -n tigera-operator --timeout=180s
  environment: *kubeconfig
  changed_when: false

- name: Calico Installation 매니페스트 생성
  ansible.builtin.template:
    src: calico-installation.yaml.j2
    dest: /etc/kubernetes/calico-installation.yaml
    mode: "0644"

- name: Calico Installation 적용
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/calico-installation.yaml
  environment: *kubeconfig
  register: calico_apply
  changed_when: "'configured' in calico_apply.stdout or 'created' in calico_apply.stdout"

- name: control plane 의 calico-node Ready 대기
  # tigerastatus 의 Available 은 모든 노드의 calico-node 가 떠야 True 가 되는데, 워커는 팀원 PC 라
  # 꺼져 있는 경우가 많아 재실행 시 영원히 False 가 될 수 있음 → 이 노드의 calico-node 만 기다림
  ansible.builtin.command: >-
    kubectl get pods -n calico-system -l k8s-app=calico-node
    --field-selector spec.nodeName={{ node_name }}
    -o 'jsonpath={.items[0].status.conditions[?(@.type=="Ready")].status}'
  environment: *kubeconfig
  register: calico_status
  until: calico_status.stdout == "True"
  retries: 60
  delay: 10
  changed_when: false
  failed_when: false

- name: calico-node Ready 확인
  ansible.builtin.assert:
    that: calico_status.stdout == "True"
    fail_msg: >-
      {{ node_name }} 의 calico-node 가 Ready 가 되지 않았습니다.
      kubectl get tigerastatus / kubectl -n calico-system get pods -o wide 로 원인을 확인하세요.
    quiet: true

- name: Felix iptables mark 대역 조회
  ansible.builtin.command: >-
    kubectl get felixconfiguration default -o 'jsonpath={.spec.iptablesMarkMask}'
  environment: *kubeconfig
  register: felix_mark_mask
  until: felix_mark_mask.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Felix iptables mark 대역을 Tailscale 과 분리
  # Tailscale 의 ip rule(fwmark 0x80000/0xff0000 → main 테이블)에 Calico 의 mark 가 걸리지 않게 함.
  # Felix 가 설정 변경을 감지해 calico-node 를 스스로 재시작함
  ansible.builtin.command: >-
    kubectl patch felixconfiguration default --type merge
    -p '{{ {"spec": {"iptablesMarkMask": calico_iptables_mark_mask}} | to_json }}'
  environment: *kubeconfig
  when: felix_mark_mask.stdout != calico_iptables_mark_mask | string
  changed_when: true
