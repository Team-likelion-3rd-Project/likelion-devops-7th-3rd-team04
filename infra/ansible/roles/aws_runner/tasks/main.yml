---
# AWS GitLab Runner. 접속 정보를 Secrets Manager 에서 읽어 온프레미스와 같은 role(tailscale · docker · gitlab_runner)로 구성한다.
# 값은 Terraform 12-secrets 가 등록한다 (gitlab.yml 이 발급한 .secrets/aws-ci-runner.env, .env 의 TS_CI_RUNNER_OAUTH_CLIENT_SECRET)
- name: Runner 접속 정보 조회 (Secrets Manager)
  ansible.builtin.command: >-
    aws secretsmanager get-secret-value --region {{ aws_region }}
    --secret-id {{ item }} --query SecretString --output text
  loop:
    - "{{ ci_runner_tailscale_secret_name }}"
    - "{{ ci_runner_gitlab_secret_name }}"
  register: ci_runner_secrets
  changed_when: false
  no_log: true

- name: 접속 정보 fact 등록 (부모 그룹 gitlab_runner 의 환경변수 값을 덮어씀)
  ansible.builtin.set_fact:
    ts_oauth_secret: "{{ (ci_runner_secrets.results[0].stdout | from_json).oauth_client_secret }}"
    gitlab_url: "{{ (ci_runner_secrets.results[1].stdout | from_json).url }}"
    gitlab_runner_token: "{{ (ci_runner_secrets.results[1].stdout | from_json).token }}"
  no_log: true

- name: Tailscale (tag:ci-runner, ephemeral)
  ansible.builtin.include_role:
    name: tailscale

# 정상 종료(ASG 교체 · terraform destroy)되면 tailnet 에서 바로 빠진다. 신호 없이 꺼지면 ephemeral 이 나중에 지운다.
# After= 순서라 종료 때는 tailscaled · 네트워크보다 먼저 ExecStop 이 돈다
- name: 종료 시 Tailscale logout 유닛
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscale-logout.service
    content: |
      [Unit]
      Description=Tailscale logout on shutdown (ephemeral AWS Runner)
      After=network-online.target tailscaled.service
      Wants=network-online.target
      Requires=tailscaled.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/true
      ExecStop=/usr/bin/tailscale logout
      TimeoutStopSec=30

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: 종료 시 Tailscale logout 유닛 활성화
  ansible.builtin.systemd_service:
    name: tailscale-logout
    enabled: true
    state: started
    daemon_reload: true

# job 컨테이너의 extra_hosts 에 넣을 GitLab Tailscale IP. 저장하지 않고 tailnet 에서 조회한다 (GitLab 노드가 바뀌어도 그대로)
- name: GitLab Tailscale IP 조회
  ansible.builtin.command: tailscale ip -4 {{ gitlab_url | urlsplit('hostname') }}
  register: gitlab_ts_ip_out
  changed_when: false
  until: gitlab_ts_ip_out.rc == 0 and gitlab_ts_ip_out.stdout | length > 0
  retries: 10
  delay: 3

- name: gitlab_ts_ip fact 등록
  ansible.builtin.set_fact:
    gitlab_ts_ip: "{{ gitlab_ts_ip_out.stdout_lines | first }}"

- name: Docker
  ansible.builtin.include_role:
    name: docker

- name: GitLab Runner 등록
  ansible.builtin.include_role:
    name: gitlab_runner
