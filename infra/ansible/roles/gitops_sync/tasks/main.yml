---
# GitOps pull 배포 agent 설치 + 첫 실행. 클러스터 서비스(Traefik · whoami · backend ...)는 이 agent 가
# gitops 레포에서 설치한다 (infra/gitops/prod/README.md)
- name: 매니페스트 생성
  ansible.builtin.template:
    src: gitops-sync.yaml.j2
    dest: /etc/kubernetes/gitops-sync.yaml
    mode: "0644"

- name: namespace / RBAC / ConfigMap / CronJob(suspend) 적용
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/gitops-sync.yaml
  environment: &kubeconfig
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: gitops_sync_apply
  changed_when: "'configured' in gitops_sync_apply.stdout or 'created' in gitops_sync_apply.stdout"

# 첫 예약 실행(최대 1분)을 기다리지 않는다. CronJob 이 멈춰 있어 이 Job 과 겹치지 않는다
- name: 부트스트랩 Job 실행
  ansible.builtin.shell: |
    kubectl -n {{ gitops_sync_namespace }} delete job gitops-sync-bootstrap --ignore-not-found
    kubectl -n {{ gitops_sync_namespace }} create job gitops-sync-bootstrap --from=cronjob/gitops-sync
  environment: *kubeconfig
  changed_when: true

# 실패해도 play 를 실패시키지 않는다. CP user-data 는 실패 시 ASG 에 Unhealthy 를 보고해 CP 가 교체되는데,
# agent 실패는 대개 gitops 값 문제라 교체해도 같다. 가져오기 실패는 CronJob 이 재시도하고, 값 문제는 수정 커밋으로 반영된다
- name: 부트스트랩 Job 완료 대기
  ansible.builtin.command: >-
    kubectl -n {{ gitops_sync_namespace }} get job gitops-sync-bootstrap
    -o jsonpath='{range .status.conditions[*]}{.type}={.status} {end}'
  environment: *kubeconfig
  register: gitops_sync_bootstrap
  until: "'Complete=True' in gitops_sync_bootstrap.stdout or 'Failed=True' in gitops_sync_bootstrap.stdout"
  retries: "{{ gitops_sync_bootstrap_wait_retries }}"
  delay: 10
  changed_when: false
  # 대기 시간을 넘겨도(재시도 소진) 다음 태스크로 넘어간다
  ignore_errors: true

- name: 부트스트랩 Job 로그
  ansible.builtin.command: kubectl -n {{ gitops_sync_namespace }} logs job/gitops-sync-bootstrap --tail=-1
  environment: *kubeconfig
  register: gitops_sync_bootstrap_log
  changed_when: false
  failed_when: false

- name: 부트스트랩 결과
  ansible.builtin.debug:
    msg: "{{ ['결과: ' ~ (gitops_sync_bootstrap.stdout | default('') or '대기 시간 초과')] + (gitops_sync_bootstrap_log.stdout_lines | default([])) }}"

- name: 부트스트랩 실패 경고
  ansible.builtin.debug:
    msg: >-
      gitops-sync 부트스트랩이 끝나지 않았습니다. CronJob 이 이어서 처리합니다.
      상태: kubectl -n {{ gitops_sync_namespace }} get configmap gitops-sync-state -o yaml
  when: "'Complete=True' not in gitops_sync_bootstrap.stdout"

- name: CronJob 재개
  ansible.builtin.command: >-
    kubectl -n {{ gitops_sync_namespace }} patch cronjob gitops-sync --type merge -p '{"spec":{"suspend":false}}'
  environment: *kubeconfig
  changed_when: true
