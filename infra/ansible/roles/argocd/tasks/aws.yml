---
# AWS Main 클러스터 ArgoCD 설치 + root 앱 (aws-control-plane.yml 이 CP-a 부트스트랩 마지막에 실행, include_role tasks_from: aws).
# 클러스터 서비스(Traefik · backend ...)는 root 앱이 gitops 레포 envs/prod 에서 설치한다 (infra/gitops/prod/README.md).
# 온프레미스(main.yml)와 달리 레포 자격 증명 · tailscale serve · OpenBao 저장이 없다
- name: 작업 디렉토리
  ansible.builtin.file:
    path: "{{ argocd_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: values 파일
  ansible.builtin.template:
    src: argocd-values-aws.yaml.j2
    dest: "{{ argocd_manifest_dir }}/argocd-values.yaml"
    mode: "0644"

- name: ArgoCD 설치 / 업그레이드
  ansible.builtin.command: >-
    helm upgrade --install argocd argo-cd
    --repo {{ argocd_chart_repo }}
    --version {{ argocd_chart_version }}
    -n {{ argocd_namespace }} --create-namespace
    -f {{ argocd_manifest_dir }}/argocd-values.yaml
    --wait --timeout 10m
  environment: &kubeconfig
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

- name: ArgoCD Ready 대기
  ansible.builtin.command: >-
    kubectl rollout status {{ item }} -n {{ argocd_namespace }} --timeout=300s
  loop:
    - statefulset/argocd-application-controller
    - deployment/argocd-repo-server
    - deployment/argocd-server
    - deployment/argocd-redis
  environment: *kubeconfig
  changed_when: false

- name: AppProject bootstrap / root 앱 매니페스트
  ansible.builtin.template:
    src: argocd-root-aws.yaml.j2
    dest: "{{ argocd_manifest_dir }}/argocd-root.yaml"
    mode: "0600"

- name: AppProject bootstrap / root 앱 적용
  ansible.builtin.command: kubectl apply -f {{ argocd_manifest_dir }}/argocd-root.yaml
  environment: *kubeconfig
  register: argocd_root_apply
  changed_when: "'configured' in argocd_root_apply.stdout or 'created' in argocd_root_apply.stdout"

# 실패해도 play 를 실패시키지 않는다. CP user-data 는 실패 시 ASG 에 Unhealthy 를 보고해 CP 가 교체되는데,
# 첫 sync 실패는 대개 gitops 값 문제라 교체해도 같다. 하위 앱은 ArgoCD 가 계속 재시도한다
- name: root 앱 첫 sync 대기
  ansible.builtin.command: >-
    kubectl -n {{ argocd_namespace }} get application prod-apps
    -o jsonpath='{.status.sync.status}/{.status.health.status}/{.status.operationState.phase}'
  environment: *kubeconfig
  register: argocd_root_status
  until: >-
    argocd_root_status.stdout is match('Synced/Healthy/Succeeded')
    or argocd_root_status.stdout is search('/(Failed|Error)$')
  retries: "{{ argocd_prod_bootstrap_wait_retries }}"
  delay: 10
  changed_when: false
  # 대기 시간을 넘겨도(재시도 소진) 다음 태스크로 넘어간다
  ignore_errors: true

- name: 하위 앱 상태
  ansible.builtin.command: >-
    kubectl -n {{ argocd_namespace }} get applications
    -o custom-columns=NAME:.metadata.name,WAVE:.metadata.annotations.argocd\.argoproj\.io/sync-wave,SYNC:.status.sync.status,HEALTH:.status.health.status,MESSAGE:.status.operationState.message
  environment: *kubeconfig
  register: argocd_apps_status
  changed_when: false
  failed_when: false

- name: 첫 sync 결과
  ansible.builtin.debug:
    msg: "{{ ['root prod-apps: ' ~ (argocd_root_status.stdout | default('') or '조회 실패')] + (argocd_apps_status.stdout_lines | default([])) }}"

- name: 첫 sync 미완료 경고
  ansible.builtin.debug:
    msg: >-
      root 앱 prod-apps 첫 sync 가 끝나지 않았습니다. 하위 앱은 ArgoCD 가 계속 재시도합니다.
      상태: kubectl -n {{ argocd_namespace }} get applications
  when: argocd_root_status.stdout is not match('Synced/Healthy/Succeeded')
