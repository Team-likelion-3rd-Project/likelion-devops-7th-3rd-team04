# cp inventory/hosts.example.ini inventory/hosts.ini 후 자기 VM 정보로 수정 (hosts.ini 는 gitignore 대상)
#
# 호스트마다 VM 계정과 SSH 키가 다르다고 가정하고, 접속 정보를 호스트 줄에 각각 지정합니다.
#   ansible_host                 : 로컬 PC(WSL)에서 SSH 로 접근 가능한 VM 의 사설 IP (Tailscale IP 아님)
#   ansible_user                 : 해당 VM 의 접속 계정
#   ansible_ssh_private_key_file : WSL 에 있는 개인키 파일 경로 (키 내용이 아닌 경로, /mnt/* 가 아닌 ~/.ssh 권장)
#   node_name                    : Kubernetes 노드명 / Tailscale 호스트명 (팀 내 중복 금지)

[control_plane]
control-plane ansible_host=192.168.56.10 ansible_user=master ansible_ssh_private_key_file=~/.ssh/k8s_cp node_name=control-plane

[workers]
worker-taegyun  ansible_host=192.168.56.11 ansible_user=taegyun  ansible_ssh_private_key_file=~/.ssh/k8s_worker_taegyun  node_name=worker-taegyun
worker-sehun    ansible_host=192.168.57.20 ansible_user=sehun    ansible_ssh_private_key_file=~/.ssh/k8s_worker_sehun    node_name=worker-sehun
worker-jwahyung ansible_host=192.168.58.30 ansible_user=jwahyung ansible_ssh_private_key_file=~/.ssh/k8s_worker_jwahyung node_name=worker-jwahyung
worker-byeongho ansible_host=192.168.59.40 ansible_user=byeongho ansible_ssh_private_key_file=~/.ssh/k8s_worker_byeongho node_name=worker-byeongho

[db]
hotel-db ansible_host=192.168.56.20 ansible_user=master ansible_ssh_private_key_file=~/.ssh/k8s_db node_name=hotel-db

# 각자 PC 에서는 자기 VM 줄만 남기고 실행하거나, -l 옵션으로 대상 지정
#   ansible-playbook worker-join.yml -K -l worker-taegyun
