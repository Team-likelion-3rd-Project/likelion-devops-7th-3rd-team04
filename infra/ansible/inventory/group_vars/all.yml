---
# ── 버전 고정 ─────────────────────────────────────────────
kube_version: "1.33"
calico_version: "v3.30.7"
pause_image: "registry.k8s.io/pause:3.10"

# ── 네트워크 ──────────────────────────────────────────────
pod_subnet: "10.0.0.0/16"
service_subnet: "10.96.0.0/12"
# tailscale0 MTU(1280) - VXLAN 오버헤드(50)
calico_mtu: 1230
tailscale_interface: tailscale0
# Calico 노드 IP 감지 방법 (Installation spec.calicoNetwork.nodeAddressAutodetectionV4)
calico_node_address_autodetection:
  interface: "{{ tailscale_interface }}"
# Felix 가 쓰는 fwmark 비트. 기본값(0xffff0000)은 Tailscale(0xff0000)과 겹쳐서
# Pod 가 Tailnet 클라이언트에 보내는 응답이 ens33 으로 새어 나감 → 0xff000000 으로 분리 (README 6절)
calico_iptables_mark_mask: 4278190080  # 0xff000000

# ── 노드 ─────────────────────────────────────────────────
node_name: "{{ inventory_hostname }}"
# false 면 tailscale role 과 TS_OAUTH_CLIENT_SECRET 확인을 건너뛰고 기본 NIC IP 를 노드 IP 로 쓴다 (AWS)
use_tailscale: true
# kubelet node-ip / kube-apiserver advertiseAddress
node_ip: "{{ ts_ip if use_tailscale else ansible_default_ipv4.address }}"
# kubeadm controlPlaneEndpoint 호스트 (포트 6443). AWS 는 내부 NLB DNS
k8s_control_plane_endpoint: "{{ node_ip }}"
# 워커는 팀원 PC 라 꺼질 수 있음 → 클러스터 필수 애드온을 control plane 에 배치 (calico · addon_placement role)
#   Typha · coredns: CP 우선 / calico-kube-controllers · calico-apiserver · tigera-operator: CP 고정
addons_on_control_plane: true
# 꺼진 노드에서 Typha 를 축출하기까지 기다리는 시간(초). k8s 기본값 300 보다 짧게
addon_eviction_seconds: 120

# ── 비밀값: 환경변수에서만 읽음 (코드에 값 금지) ──────────────
ts_oauth_secret: "{{ lookup('env', 'TS_OAUTH_CLIENT_SECRET') }}"
ts_tags: "{{ lookup('env', 'TS_TAGS') | default('tag:k8s-node', true) }}"
# true 면 오프라인이 된 노드를 Tailscale 이 자동 삭제 (재생성마다 새로 뜨는 노드용). 온프레미스 노드는 false
ts_ephemeral: false

k8s_api_endpoint: "{{ lookup('env', 'K8S_API_ENDPOINT') }}"
k8s_join_token: "{{ lookup('env', 'K8S_JOIN_TOKEN') }}"
k8s_ca_cert_hash: "{{ lookup('env', 'K8S_CA_CERT_HASH') }}"

# ── join 정보 / kubeconfig 를 저장할 로컬 경로 (gitignore 대상) ──
local_secrets_dir: "{{ playbook_dir }}/.secrets"
kubeadm_token_ttl: "72h"

# ── 사설 CA (선택) ───────────────────────────────────────
# GitLab / KAS / Registry 가 사설 인증서를 쓸 때만 로컬 PEM 경로 지정 (README 12-7).
# 기본 구성(tailscale serve, *.ts.net Let's Encrypt)에서는 비워 둡니다.
# 지정하면: containerd certs.d(모든 k8s 노드), ArgoCD repo-server(configs.tls), Runner 의 /etc/gitlab-runner/certs 에 배포
private_ca_cert_file: "{{ lookup('env', 'PRIVATE_CA_CERT_FILE') }}"

# ── OpenBao: dev 비밀값 단일 소스 (DB 노드, README 16절) ─────
# db.yml 이 만든 .secrets/openbao.env 를 source 하면 채워짐 (ansible-dev 정책 토큰).
# 비어 있으면 OpenBao 를 읽거나 쓰지 않고 기존처럼 .env · backend/.env · .secrets/*.env 값을 씀
openbao_addr: "{{ lookup('env', 'OPENBAO_ADDR') }}"
openbao_token: "{{ lookup('env', 'OPENBAO_TOKEN') }}"
openbao_kv_mount: secret
# 운영 Secrets Manager 이름(team04-hotel/prod/<이름>)과 env 만 다름
openbao_kv_prefix: team04-hotel/dev
# roles/openbao_kv(read) 가 채움 — {경로 이름: {속성: 값}}
openbao_kv: {}
# ESO 가 로그인하는 OpenBao Kubernetes auth role (db.yml 의 ansible-dev 정책 · k8s-cicd.yml 의 external_secrets role)
openbao_eso_role: external-secrets

# ESO(eso-dev 정책)가 읽을 수 있는 OpenBao 경로 (team04-hotel/dev/<이름>). db.yml --tags openbao 가 정책에 반영 (README 16절)
# 어떤 경로 · 속성을 어느 Secret key 로 가져올지는 gitops 레포 envs/dev/backend-secrets.yaml (ArgoCD backend-secrets 앱)
#   backend-secrets: main-db ~ gcp-sa (기존 경로 — db.yml · gitlab.yml · payment.yml 도 직접 읽음), backend-env (새 backend 비밀값은 여기에)
#   seed-admin     : backend/seed-admin (차트 seed Job 의 관리자 계정, 7-5) — 속성을 모두 이름 그대로 가져옴(dataFrom.extract)
#   grafana        : monitoring/grafana-admin (17절)
# root 계정(main-db-root 등) · GitLab 토큰 경로는 넣지 않음. 경로를 새로 만들 때만 여기에 추가 — 기존 경로에 속성을 더할 때는 바꾸지 않음
eso_read_paths:
  - main-db
  - main-valkey
  - backend-app
  - kakao-login
  - minio-app
  - minio-rag
  - dynamodb
  - n8n
  - gcp-sa
  - backend-env
  - seed-admin
  - grafana

# ── 모니터링 (monitoring.yml · payment.yml · db.yml, README 17절) ──────
# 메트릭 라벨 env 값 (운영은 prod). 클러스터 Prometheus scrape class · 결제 노드 Alloy 가 함께 씀
monitoring_env: dev
# Prometheus NodePort — 결제 · DB 노드 Alloy 가 control plane Tailscale IP 로 remote_write (ACL tag:payment · tag:db → tag:k8s-node tcp:30909)
prometheus_nodeport: 30909
# control plane Tailscale IP (.env CLUSTER_ENTRY_IP) — 결제 노드의 NodePort 호출 · 결제/DB 노드 Alloy 의 remote_write 대상
cluster_entry_ip: "{{ lookup('env', 'CLUSTER_ENTRY_IP') }}"
collectors_remote_write_url: "http://{{ cluster_entry_ip }}:{{ prometheus_nodeport }}/api/v1/write"

# ── 로그 (Loki · Alloy, README 17-8) ──────────────────────────
# Loki 는 DB 노드(roles/loki). 클러스터 Alloy · 결제 노드 Alloy 의 push 대상, Grafana Loki 데이터소스
# (ACL tag:k8s-node · tag:payment → tag:db tcp:3100). DB 노드 Tailscale IP 는 OpenBao main-db(host), 없으면 .env 의 DB_TS_IP
loki_port: 3100
loki_host: "{{ openbao_kv['main-db'].host | default(lookup('env', 'DB_TS_IP'), true) }}"
loki_push_url: "http://{{ loki_host }}:{{ loki_port }}/loki/api/v1/push"
