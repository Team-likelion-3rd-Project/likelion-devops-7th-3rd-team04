---
# ── Tailscale: 결제 노드 전용 태그 / OAuth client (all.yml 값을 그룹 단위로 덮어씀) ──
ts_tags: "tag:payment"
ts_oauth_secret: "{{ lookup('env', 'TS_PAYMENT_OAUTH_CLIENT_SECRET') }}"

# ── 이미지 버전 고정 ──────────────────────────────────────
mariadb_image: "mariadb:11.4.13"          # DB 노드(db.yml) · CI smoke test 와 같은 버전
# JVM 이미지: 메시지 영속화(H2) 지원 + healthcheck 용 wget 포함 (native 이미지는 둘 다 보장 안 됨)
elasticmq_image: "softwaremill/elasticmq:1.7.1"

# ── 경로 ─────────────────────────────────────────────────
payment_base_dir: /opt/payment-node        # compose / 설정 / client 자격증명 (0700)
payment_data_dir: /var/lib/payment-node    # mariadb / elasticmq 데이터

# ── GitLab: gitlab.yml --tags bootstrap 이 만든 .secrets/payment-node.env 에서 ──
gitlab_url: "{{ lookup('env', 'GITLAB_URL') }}"
gitlab_ts_ip: "{{ lookup('env', 'GITLAB_TS_IP') }}"
gitlab_fqdn: "{{ gitlab_url | urlsplit('hostname') }}"
gitlab_registry: "{{ lookup('env', 'GITLAB_REGISTRY') }}"
# 결제 노드 전용 그룹 Deploy Token (read_registry + read_repository) — k8s 용 토큰과 별도로 폐기 가능
payment_deploy_user: "{{ lookup('env', 'PAYMENT_DEPLOY_USER') }}"
payment_deploy_token: "{{ lookup('env', 'PAYMENT_DEPLOY_TOKEN') }}"
# 이미지 = <gitlab_registry>/<payment_image_prefix>/<이름>:<태그>  (CI 가 push 하는 경로와 같음)
payment_image_prefix: team04/hotel

# ── 이미지 태그: gitops 의 dev 배포 태그를 따름 ───────────────
# PAYMENT_IMAGE_TAG 를 지정하면 그 값을 우선 사용 (롤백·검증용)
payment_image_tag_override: "{{ lookup('env', 'PAYMENT_IMAGE_TAG') }}"
payment_gitops_repo: team04/infra/backend-gitops
payment_gitops_branch: main
payment_gitops_values: envs/dev/values.yaml

# ── 결제 DB: backend/.env 를 단일 소스로 (db.yml 과 같은 방식) ──
backend_env_file: "{{ (lookup('env', 'BACKEND_ENV_FILE') | default(playbook_dir ~ '/../../backend/.env', true)) | expanduser | realpath }}"
backend_env: "{{ lookup('file', backend_env_file) | parse_dotenv }}"

payment_db_port: "{{ backend_env.PAYMENT_DB_PORT | default('3306', true) }}"
payment_db_database: "{{ backend_env.PAYMENT_DB_DATABASE | default('') }}"
payment_db_username: "{{ backend_env.PAYMENT_DB_USERNAME | default('') }}"
payment_db_password: "{{ backend_env.PAYMENT_DB_PASSWORD | default('') }}"
# 결제 DB root — 메인 DB(DB_ROOT_PASSWORD)와 분리. backend 서비스는 쓰지 않으므로 infra/ansible/.env 에 둠
payment_db_root_password: "{{ lookup('env', 'PAYMENT_DB_ROOT_PASSWORD') }}"

# 결제 노드 2 vCPU / 4 GB 기준 (ElasticMQ JVM · payment-service 몫을 남김)
payment_mariadb_max_connections: 100
payment_mariadb_buffer_pool_mb: "{{ (ansible_memtotal_mb * 0.25) | int }}"

# ── 클러스터 연결 (payment-service → booking-service / pg-mock-service) ──
# 클러스터 밖이라 ClusterIP 에 닿을 수 없음 → 차트의 nodePort 로 노출한 포트를 control plane Tailscale IP 로 호출
cluster_entry_ip: "{{ lookup('env', 'CLUSTER_ENTRY_IP') }}"
booking_nodeport: 30303     # booking-service gRPC 3003
pg_mock_nodeport: 30307     # pg-mock-service HTTP 3007

# ── payment-service ─────────────────────────────────────
payment_service_port: 3004  # gRPC (api-gateway / booking-service 가 호출)
payment_health_port: 3104   # GET /health (차트 values.yaml 의 healthPort 와 같음, 노드 내부 확인용)

# ── ElasticMQ (dev 용 SQS 대체 — prod 는 Terraform 43-messaging 의 SQS FIFO) ──
elasticmq_port: 9324        # SQS API (booking-service 가 tailnet 으로 수신)
elasticmq_region: ap-northeast-2
elasticmq_account_id: "000000000000"
elasticmq_heap: 256m
# 결제 결과 이벤트 (payment_outbox → booking-service payment_result_inbox)
# MessageDeduplicationId = outbox event_id, MessageGroupId = reservation_id (V3__create_outbox_and_webhook_inbox.sql)
# 큐는 메시지와 함께 디스크에 저장되고 저장된 설정이 우선 → 기존 큐의 설정 변경은 데이터 초기화 후 반영 (README 14-6)
payment_result_queue: payment-result.fifo
payment_result_dlq: payment-result-dlq.fifo
payment_result_max_receive: 5
payment_result_visibility_timeout: 30   # 초

# ── payment-service / booking-service 의 SQS 환경변수 이름 ──────
# 결제 결과 이벤트 SQS 연동 환경변수 (README 14-6 에서 확정한 이름 — 발행기 payment-service · 소비기 booking-service 공통)
# prod(AWS)는 SQS_ENDPOINT 를 비우고 IAM 자격증명을 쓰며, AWS_* 더미값은 dev(ElasticMQ) 전용
payment_sqs_env:
  SQS_ENDPOINT: "http://127.0.0.1:{{ elasticmq_port }}"
  SQS_REGION: "{{ elasticmq_region }}"
  PAYMENT_RESULT_QUEUE_URL: "{{ payment_result_queue_url }}"
  # ElasticMQ 는 서명을 검증하지 않음 — AWS SDK 가 자격증명을 요구하므로 더미값
  AWS_ACCESS_KEY_ID: elasticmq
  AWS_SECRET_ACCESS_KEY: elasticmq
payment_result_queue_url: "http://{{ ts_ip | default('') }}:{{ elasticmq_port }}/{{ elasticmq_account_id }}/{{ payment_result_queue }}"

# ── 방화벽: tailscale0 에서만 허용할 포트 (firewall role) ─────
# MariaDB(3306)·health(3104)는 열지 않음
firewall_tailnet_tcp_ports:
  - "{{ payment_service_port }}"
  - "{{ elasticmq_port }}"
