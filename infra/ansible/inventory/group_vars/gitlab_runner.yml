---
# ── Tailscale: Runner 노드 전용 태그 / OAuth client (all.yml 값을 그룹 단위로 덮어씀) ──
ts_tags: "tag:gitlab-runner"
ts_oauth_secret: "{{ lookup('env', 'TS_GITLAB_RUNNER_OAUTH_CLIENT_SECRET') }}"

# ── 버전 고정 (GitLab 이미지와 major.minor 를 맞춤, apt 버전 문자열) ──
gitlab_runner_version: "19.4.1-1"

# ── GitLab 접속 정보: gitlab.yml 이 생성한 .secrets/gitlab-runner.env 에서 ──
gitlab_url: "{{ lookup('env', 'GITLAB_URL') }}"
gitlab_ts_ip: "{{ lookup('env', 'GITLAB_TS_IP') }}"
gitlab_runner_token: "{{ lookup('env', 'GITLAB_RUNNER_TOKEN') }}"
gitlab_fqdn: "{{ gitlab_url | urlsplit('hostname') }}"

# ── Runner 설정 ───────────────────────────────────────────
gitlab_runner_concurrent: 2                    # 동시 job 수 (vCPU 수 이하 권장)
gitlab_runner_default_image: "alpine:3.22"     # .gitlab-ci.yml 에 image 미지정 시

# ── 방화벽: 인바운드 서비스 없음 (SSH / Tailscale 만) ─────────
firewall_tailnet_tcp_ports: []
