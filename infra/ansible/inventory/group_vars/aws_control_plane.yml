---
# AWS Main 클러스터 CP (aws-control-plane.yml). 공통값은 aws.yml, 온프레미스와 다른 값만 둔다.
#
# user-data 가 aws.yml 의 값 외에 넘기는 extra vars
#   k8s_cp_role                 init (CP-a) | join (CP-b · c)
#   nth_queue_url               NTH 가 받는 SQS 큐 URL (70 node-lifecycle.tf)
#   k8s_service_account_issuer  kube-apiserver --service-account-issuer = 10-global OIDC 버킷 URL (IRSA, 70 irsa.tf)
#   oidc_bucket_name            CP-a 가 init 후 keys.json 을 올리는 버킷

# VPC 점보 프레임 MTU(9001) - VXLAN 오버헤드(50)
calico_mtu: 8951
calico_node_address_autodetection:
  kubernetes: NodeInternalIP

# 접속은 SSM. kubeconfig 는 /etc/kubernetes/admin.conf 를 sudo 로 쓴다
copy_user_kubeconfig: false

# join token 갱신 (systemd timer). Terraform 이 만든 첫 token 은 kubeadm_token_ttl(72h) 후 만료되므로
# 당일 ASG 교체 · 확장에 대비해 CP 가 새 token 을 만들어 join-token 파라미터를 덮어쓴다
kubeadm_join_token_renew_interval: 12h
kubeadm_join_token_renew_ttl: 24h

# CP 교체 뒷정리 주기 (team04-cp-reconcile.timer). 사라진 CP 의 etcd 멤버 제거, kubeadm-certs Secret(2시간 후 삭제) 재업로드
kubeadm_cp_reconcile_interval: 1min

# ── 노드 수명주기 (CP-a 만 설치, aws_node_lifecycle role) ──
# CCM 이미지는 Kubernetes 마이너 버전(kube_version) 과 맞춘다. 차트 0.0.12 기본값(v1.35.0) 대신 최신 패치.
# 차트 0.0.12 부터 controller ServiceAccount token 권한이 kube-system Role 로 옮겨졌다 (clusterRoleRules 는 덮어쓰지 않음)
aws_ccm_chart_version: "0.0.12"
aws_ccm_image_tag: "v1.35.2"
aws_nth_chart_version: "0.27.6"   # NTH v1.25.6

# ── ArgoCD (CP-a 만 설치, roles/argocd aws.yml) ──
# 차트 버전 · 네임스페이스는 온프레미스와 같다 (control_plane.yml). Traefik · backend 등 클러스터 서비스의 원본은
# gitops 레포 envs/prod (모노레포 infra/gitops/prod) — root 앱 prod-apps 가 그 root 차트를 렌더링한다
# public 레포라 자격 증명 없이 읽는다. main 은 ruleset(PR · 승인 1 · validate)으로 보호
argocd_prod_repo_url: https://github.com/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team04-gitops.git
argocd_prod_apps_path: envs/prod
# 대상 브랜치. 작업 브랜치 검증은 이 값이 아니라 root 앱의 targetRevision 을 patch 한다 — 머지 시 main
argocd_prod_branch: main

# public gitops 레포에 두지 않는 클러스터 값. chart.yaml 에 clusterValues: true 인 앱에만 넘긴다 (root 차트).
# 계정 ID 는 IRSA Role ARN · ECR 주소에 쓴다. aws_account_id 는 aws-control-plane.yml 이 STS 로 조회
argocd_prod_cluster_values:
  global:
    awsAccountId: "{{ aws_account_id }}"

# 배포 결과 알림 (Slack #deploy, root 차트의 hook Job). 이름은 Terraform 과 같아야 한다 —
# 토픽 10-global deploy_topic_name, Role 70 irsa.tf deploy-notify
argocd_prod_deploy_topic_name: team04-hotel-deploy
argocd_prod_deploy_role_name: team04-hotel-deploy-notify

# root sync 시간 제한 (argocd-cmd-params-cm controller.sync.timeout.seconds). 넘으면 실패 알림, 하위 앱은 계속 재시도.
# 첫 sync(재생성, 전체 설치) 실측 약 5분(2026-10-27)의 3배. 아래 부트스트랩 대기와 같게 둔다 — 다음 실측으로 다시 정함
argocd_prod_sync_timeout_seconds: 900
# CP-a 부트스트랩이 root 첫 sync 를 기다리는 시간 = retries × 10초. 넘겨도 부트스트랩은 성공으로 끝난다
argocd_prod_bootstrap_wait_retries: 90
