---
# AWS GitLab Runner (aws-runner.yml). 공통값은 gitlab_runner.yml(부모 그룹), 온프레미스와 다른 값만 둔다.
#
# 40-cicd user-data 가 넘기는 extra vars
#   node_name                        ci-runner-<인스턴스 ID> (Tailscale · GitLab 에 보이는 이름)
#   aws_region
#   ci_runner_tailscale_secret_name  Secrets Manager {oauth_client_secret}  (Terraform 12-secrets)
#   ci_runner_gitlab_secret_name     Secrets Manager {url, token}           (Terraform 12-secrets)
#
# 접속 정보(ts_oauth_secret · gitlab_url · gitlab_runner_token · gitlab_ts_ip)는 부모 그룹의 환경변수 값 대신
# aws_runner role 이 Secrets Manager · Tailscale 에서 읽어 덮어쓴다

# ACL 은 tag:ci-runner → tag:gitlab tcp:443 만 (README 1-1). 온프레미스 Runner(tag:gitlab-runner)는 dev DB · Registry 도 접근
ts_tags: "tag:ci-runner"
# 매일 재생성되므로 꺼지면 tailnet 에서 자동 삭제
ts_ephemeral: true

# 이미지 빌드는 kaniko 라 docker.sock 이 필요 없다. job 에 호스트 root 권한을 주지 않는다
gitlab_runner_mount_docker_sock: false
# m7g.large(2 vCPU · 8 GiB, Terraform 40-cicd instance_type) 기준
gitlab_runner_concurrent: 2

# 온프레미스 GitLab 이 꺼져 있는 날도 부트스트랩을 실패시키지 않는다 (실패하면 ASG 가 Runner 를 계속 교체).
# Runner 는 GitLab 이 켜지면 스스로 다시 연결한다
gitlab_runner_verify_required: false
