---
# ── Tailscale: DB 노드 전용 태그 / OAuth client (all.yml 값을 그룹 단위로 덮어씀) ──
ts_tags: "tag:db"
ts_oauth_secret: "{{ lookup('env', 'TS_DB_OAUTH_CLIENT_SECRET') }}"

# ── 이미지 버전 고정 ──────────────────────────────────────
mariadb_image: "mariadb:11.4.13"
valkey_image: "valkey/valkey:9.1.2"
# 업스트림 minio/minio 는 커뮤니티 이미지 배포가 끝나 Docker Hub 에서 내려감 →
# 호환 포크(Silo, github.com/pgsty/minio) 사용. MINIO_* 환경변수 / RELEASE.* 태그 / entrypoint 동일, 클라이언트는 mcli
minio_image: "pgsty/minio:RELEASE.2026-08-04T00-00-00Z"
# chat-bot-service 대화 세션·이력 저장소 (AWS DynamoDB 대체, 로컬 backend/docker-compose.yml 의 dynamodb-local 과 같은 이미지)
dynamodb_image: "amazon/dynamodb-local:3.3.1"

# ── 경로 ─────────────────────────────────────────────────
db_base_dir: /opt/hotel-db        # compose / 설정 / client 자격증명 (0700)
db_data_dir: /var/lib/hotel-db    # mariadb / valkey / minio 데이터

# ── DB 값: backend/.env 를 단일 소스로 사용 ──────────────────
# backend 의 DB_* 를 바꾸고 db.yml 만 재실행하면 DB 계정/비밀번호가 맞춰집니다.
backend_env_file: "{{ (lookup('env', 'BACKEND_ENV_FILE') | default(playbook_dir ~ '/../../backend/.env', true)) | expanduser | realpath }}"
backend_env: "{{ lookup('file', backend_env_file) | parse_dotenv }}"

db_port: "{{ backend_env.DB_PORT | default('3306', true) }}"
db_database: "{{ backend_env.DB_DATABASE | default('hotel_service', true) }}"
db_username: "{{ backend_env.DB_USERNAME | default('') }}"
db_password: "{{ backend_env.DB_PASSWORD | default('') }}"
db_root_password: "{{ backend_env.DB_ROOT_PASSWORD | default('') }}"

# ── GitLab CI 이미지 smoke test 전용 계정 (선택, 비우면 만들지 않음) ──
# 권한은 ci\_% 이름의 database 에만 — dev 앱 DB(DB_DATABASE)·결제 DB 는 접근 불가.
# 같은 비밀번호를 gitlab.yml --tags bootstrap 이 team04/hotel CI 변수로 등록 (README 12-2)
ci_smoke_db_user: ci_smoke
ci_smoke_db_password: "{{ lookup('env', 'CI_SMOKE_DB_PASSWORD') }}"

# ── dev DB 시딩 (db_seed role, db.yml --tags seed — README 7-5) ──────
# backend/scripts/seed.ts 를 scripts/Dockerfile.seed 로 DB 노드에서 빌드해 실행. 관리자 계정 값은 backend/.env
seed_admin_email: "{{ backend_env.SEED_ADMIN_EMAIL | default('') }}"
seed_admin_password: "{{ backend_env.SEED_ADMIN_PASSWORD | default('') }}"
seed_admin_name: "{{ backend_env.SEED_ADMIN_NAME | default('관리자', true) }}"
db_seed_backend_dir: "{{ backend_env_file | dirname }}"   # backend/.env 가 있는 backend 디렉토리
db_seed_dir: "{{ db_base_dir }}/seed"                      # 빌드 소스 / seed.env (root 전용)
db_seed_image_name: hotel-db-seed
db_seed_local_archive: "{{ local_secrets_dir }}/db-seed-src.tar.gz"   # 업로드 후 삭제
# 이 테이블이 모두 있어야(= main-db-migration 이 적용돼야) 시딩
db_seed_required_tables: [flyway_schema_history, hotels, admins]

# ── Valkey: backend REDIS_* 연동은 추후 — 지금은 infra/ansible/.env 에서 ──
valkey_port: 6379
valkey_password: "{{ lookup('env', 'VALKEY_PASSWORD') }}"
valkey_maxmemory: "1gb"

# ── MinIO: dev 용 S3 (객실 이미지, README 7-6) ────────────────
# 비밀값은 infra/ansible/.env 에서 — backend S3_* 연동은 추후
# 버킷은 private. 브라우저 · Pod 모두 presigned URL 로 tailnet(:9000) 에 직접 접근
minio_api_port: 9000
minio_console_port: 9001
minio_region: ap-northeast-2   # SQS_REGION 과 같은 값
minio_bucket: room-images
minio_root_user: "{{ lookup('env', 'MINIO_ROOT_USER') }}"
minio_root_password: "{{ lookup('env', 'MINIO_ROOT_PASSWORD') }}"
# 앱 전용 계정 — minio_bucket 에만 읽기/쓰기 (root 키는 앱에 주지 않음)
minio_app_access_key: "{{ lookup('env', 'MINIO_APP_ACCESS_KEY') }}"
minio_app_secret_key: "{{ lookup('env', 'MINIO_APP_SECRET_KEY') }}"
minio_app_policy: hotel-app
minio_cors_allow_origin: "*"
# RAG 벡터 인덱스(llm-service VECTOR_STORE=object). 임베딩 JSON 파일 하나를 두고 llm-service 가 읽고,
# ingest(llm-service 의 scripts.ingest)가 씀 — room-images 와 분리된 전용 버킷 · 계정
minio_rag_bucket: rag-index
minio_rag_access_key: "{{ lookup('env', 'MINIO_RAG_ACCESS_KEY') }}"
minio_rag_secret_key: "{{ lookup('env', 'MINIO_RAG_SECRET_KEY') }}"
minio_rag_policy: hotel-rag
# ── DynamoDB Local: chat-bot-service 대화 이력 (README 7-7) ────────────
# -dbPath 로 파일에 저장 (로컬 compose 의 -inMemory 와 달리 재시작해도 이력 유지). 인증이 없으므로 tailnet 에서만 허용
dynamodb_port: 8000
dynamodb_uid: 1000        # 컨테이너 실행 사용자 = 데이터 디렉토리 소유자

# ── 방화벽: tailscale0 에서만 허용할 포트 (firewall role) ─────
firewall_tailnet_tcp_ports:
  - "{{ db_port }}"            # MariaDB
  - "{{ valkey_port }}"        # Valkey
  - "{{ minio_api_port }}"     # MinIO S3 API (presigned URL)
  - "{{ minio_console_port }}" # MinIO Console (팀원 PC)
  - "{{ dynamodb_port }}"      # DynamoDB Local (chat-bot-service)

# ── 튜닝 (k6 부하 테스트 대비) ─────────────────────────────
# 커넥션: DB 사용 서비스 5개 × replica × TypeORM(mysql2) 기본 풀 10 → replica 3 기준 150, 여유 포함
mariadb_max_connections: 500
# InnoDB buffer pool = VM 메모리의 50% (Valkey·OS 몫 남김)
mariadb_buffer_pool_mb: "{{ (ansible_memtotal_mb * 0.5) | int }}"
