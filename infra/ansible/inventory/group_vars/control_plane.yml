---
# ── Ingress Controller (ingress.yml) ──────────────────────
# 버전 고정 — 올릴 때는 Traefik chart Changelog 의 breaking change 확인
helm_version: "v3.22.0"
traefik_chart_version: "41.6.1"   # Traefik v3.7.13
traefik_chart_repo: "https://traefik.github.io/charts"
traefik_namespace: traefik

# 개발자 PC(Vite proxy) → http://<control-plane>.<tailnet>.ts.net:30080
# ACL 의 autogroup:member → tag:k8s-node tcp:30000-32767 범위 안이어야 함
traefik_http_nodeport: 30080

# api-gateway Ingress(/api, /api-docs)는 backend Helm 차트가 관리 (gitops envs/dev/values.yaml 의 ingress)

# ── CI/CD: backend 네임스페이스 · Secret (k8s-cicd.yml, README 12-3) ──
# GitLab 주소 / 토큰은 OpenBao gitlab-k8s (gitlab.yml --tags bootstrap 이 저장).
# OpenBao 도입 전에는 .secrets/gitlab-k8s.env 를 source 한 환경변수에서
gitlab_url: "{{ openbao_kv['gitlab-k8s'].GITLAB_URL | default(lookup('env', 'GITLAB_URL'), true) }}"
gitlab_ts_ip: "{{ openbao_kv['gitlab-k8s'].GITLAB_TS_IP | default(lookup('env', 'GITLAB_TS_IP'), true) }}"
gitlab_fqdn: "{{ gitlab_url | urlsplit('hostname') }}"
gitlab_registry: "{{ openbao_kv['gitlab-k8s'].GITLAB_REGISTRY | default(lookup('env', 'GITLAB_REGISTRY'), true) }}"
registry_deploy_user: "{{ openbao_kv['gitlab-k8s'].REGISTRY_DEPLOY_USER | default(lookup('env', 'REGISTRY_DEPLOY_USER'), true) }}"
registry_deploy_token: "{{ openbao_kv['gitlab-k8s'].REGISTRY_DEPLOY_TOKEN | default(lookup('env', 'REGISTRY_DEPLOY_TOKEN'), true) }}"

# 앱 네임스페이스 — dev(온프레미스)·prod(EKS) 모두 같은 이름 (클러스터로 환경 구분)
backend_namespace: backend
backend_secret_name: backend-secrets
# backend-secrets 는 ESO 가 OpenBao 에서 만듦 (ExternalSecret, key 목록은 group_vars/all.yml 의 backend_external_secret_data).
# 운영(infra/gitops/prod/backend-secrets)과 같은 주기 — 값을 바꾼 뒤 바로 반영하려면 force-sync annotation (README 16-4)
backend_secret_refresh_interval: 1h
# backend_external_secret_data 를 [{key, remote, property}] 로 편 것 (backend_namespace role 의 확인 · ExternalSecret data)
backend_external_secret_refs: >-
  {%- set out = [] -%}
  {%- for remote, keys in backend_external_secret_data.items() -%}
    {%- for key, property in keys.items() -%}
      {%- set _ = out.append({'key': key, 'remote': remote, 'property': property}) -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ out }}
# k8s-cicd.yml 이 읽는 OpenBao 경로 — GitLab 토큰 + backend-secrets 원본 (값 확인용)
k8s_cicd_openbao_paths: "{{ ['gitlab-k8s'] + (backend_external_secret_data.keys() | list) }}"

# ── External Secrets Operator (k8s-cicd.yml → roles/external_secrets, README 16절) ──
# 운영(infra/gitops/prod/external-secrets/chart.yaml)과 같은 버전. 올릴 때는 두 곳을 같이
external_secrets_chart_version: "2.13.0"
external_secrets_chart_repo: "https://charts.external-secrets.io"
external_secrets_namespace: external-secrets
# OpenBao Kubernetes auth role 의 bound service account (roles/openbao 의 ansible-dev 정책과 같은 이름)
external_secrets_service_account: external-secrets
external_secrets_manifest_dir: /etc/kubernetes/external-secrets
# 운영의 aws-secrets-manager 에 해당 — backend-secrets ExternalSecret 이 참조
cluster_secret_store_name: openbao

# ── ArgoCD (k8s-cicd.yml → roles/argocd, README 12-9) ──────────
# backend 차트를 gitops 레포(team04/infra/backend-gitops)에서 pull 배포. Traefik · ESO · Secret 은 계속 Ansible 이 관리
argocd_namespace: argocd
# 버전 고정 — 올릴 때는 argo-helm Changelog / ArgoCD upgrade 문서 확인 (chart 10.10.3 = ArgoCD v3.5.5)
argocd_chart_version: "10.10.3"
argocd_chart_repo: "https://argoproj.github.io/argo-helm"
argocd_manifest_dir: /etc/kubernetes/argocd
# UI/API: argocd-server(--insecure) NodePort ← CP 의 tailscale serve 가 HTTPS 로 노출
#   https://<control plane>.<tailnet>.ts.net:8443 (ACL: autogroup:member → tag:k8s-node tcp:8443, README 1-1)
argocd_server_nodeport_http: 30880
argocd_server_nodeport_https: 30881   # 차트가 함께 만드는 포트 (같은 컨테이너 포트) — 다른 NodePort 와 겹치지 않게만 고정
argocd_serve_https_port: 8443          # 443 은 Traefik HTTPS 용으로 비워 둠 (README 11-4)
# ArgoCD 가 읽는 GitLab 레포 (그룹 Deploy Token read_repository — gitlab.yml --tags bootstrap 이 발급)
argocd_repo_user: "{{ openbao_kv['gitlab-k8s'].ARGOCD_REPO_USER | default(lookup('env', 'ARGOCD_REPO_USER'), true) }}"
argocd_repo_token: "{{ openbao_kv['gitlab-k8s'].ARGOCD_REPO_TOKEN | default(lookup('env', 'ARGOCD_REPO_TOKEN'), true) }}"
# gitlab.yml(group_vars/gitlab.yml) 과 같은 값
gitlab_group: team04
gitlab_app_project_path: team04/hotel                     # 차트 (GitHub 모노레포 미러)
gitlab_gitops_project_path: team04/infra/backend-gitops   # values · 이미지 태그 · Application
gitlab_default_branch: main
