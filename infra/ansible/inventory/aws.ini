# AWS 노드가 user-data 에서 자기 자신에게 playbook 을 실행할 때 쓰는 inventory (사람이 쓰지 않음, README 12절)
# 모듈은 시스템 python 으로 실행해야 apt(python3-apt) · deb822_repository(python3-debian) 가 동작한다
# CP · 워커의 group_vars 가 섞이지 않도록 localhost 대신 역할별 별칭을 둔다
[aws_control_plane]
aws-cp ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[aws_worker]
aws-worker ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[aws:children]
aws_control_plane
aws_worker

# Ingress Controller 버전 · NodePort (group_vars/control_plane.yml) 를 온프레미스와 같이 쓴다
[control_plane:children]
aws_control_plane
