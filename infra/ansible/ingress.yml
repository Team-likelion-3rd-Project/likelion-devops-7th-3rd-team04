---
- name: Ingress Controller 구성 (Traefik, NodePort)
  hosts: control_plane
  become: true
  pre_tasks:
    - name: control plane 구성 여부 확인
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: admin.conf 확인
      ansible.builtin.assert:
        that: admin_conf.stat.exists
        fail_msg: "/etc/kubernetes/admin.conf 가 없습니다. control-plane.yml 을 먼저 실행하세요. (README 3절)"
        quiet: true

  # api-gateway Ingress 는 backend Helm 차트(ArgoCD backend 앱)가 관리 — README 12절
  roles:
    - helm
    - traefik
