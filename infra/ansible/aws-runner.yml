---
# 40-cicd 의 Runner Launch Template user-data 가 인스턴스 안에서 자기 자신에게 실행한다. 사람이 실행하지 않는다 (README 13절)
- name: AWS GitLab Runner 구성 (Tailscale → GitLab, docker executor, ECR push)
  hosts: aws_runner
  become: true
  vars:
    required_env: {}
  # 온프레미스 gitlab-runner.yml 과 같은 선행 패키지 (deb822_repository 는 python3-debian 필요). ufw 는 쓰지 않는다 (SG 로 제한)
  pre_tasks:
    - name: 선행 패키지 설치
      ansible.builtin.apt:
        name: [ca-certificates, curl, python3-debian]
        state: present
        update_cache: true
        cache_valid_time: 3600
  roles:
    - preflight
    - aws_runner
