---
- name: GitLab Runner 노드 구성 (docker executor + docker.sock 바인드)
  hosts: gitlab_runner
  become: true
  vars:
    # preflight(Tailnet 연결 전)는 Tailscale 값만
    required_env:
      TS_GITLAB_RUNNER_OAUTH_CLIENT_SECRET: "{{ ts_oauth_secret }}"
    # OpenBao gitlab-runner 를 읽은 뒤 확인 (도입 전: .secrets/gitlab-runner.env 를 source)
    required_values:
      GITLAB_URL: "{{ gitlab_url }}"
      GITLAB_TS_IP: "{{ gitlab_ts_ip }}"
      GITLAB_RUNNER_TOKEN: "{{ gitlab_runner_token }}"
  pre_tasks:
    - name: 선행 패키지 설치
      ansible.builtin.apt:
        name: [ca-certificates, curl, python3-debian, ufw]
        state: present
        update_cache: true
        cache_valid_time: 3600

  roles:
    - preflight
    - tailscale
    - docker
    - firewall

  # OpenBao 는 Tailnet 으로 읽으므로 tailscale role 뒤에서 (ACL: tag:gitlab-runner → tag:db tcp:8200)
  tasks:
    - name: OpenBao 값 읽기
      ansible.builtin.import_role:
        name: openbao_kv
        tasks_from: read
      vars:
        openbao_read_paths: [gitlab-runner]
      tags: [always]

    # 값 대신 [이름, 길이] 만 넘겨 no_log 없이 어떤 값이 비었는지 보여줌
    - name: 필수 값 확인
      ansible.builtin.assert:
        that: item.1 > 0
        fail_msg: >-
          {{ item.0 }} 가 비어 있습니다. OpenBao {{ openbao_kv_prefix }}/gitlab-runner 에 없으면 gitlab.yml 을 다시 실행하거나,
          도입 전이면 source .secrets/gitlab-runner.env 후 다시 실행하세요 (README 9-2, 16절).
        quiet: true
      loop: "{{ required_values | dict2items | map(attribute='key') | zip(required_values | dict2items | map(attribute='value') | map('length')) | list }}"
      loop_control:
        label: "{{ item.0 }}"
      run_once: true
      tags: [always]

    - name: GitLab Runner
      ansible.builtin.import_role:
        name: gitlab_runner
