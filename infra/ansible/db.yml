---
# DB 노드: OpenBao(dev 비밀값 단일 소스) → MariaDB + Valkey + MinIO + DynamoDB Local → 모니터링 수집기 (README 7절, 16절, 17절)
#   전체           : ansible-playbook db.yml -K
#   OpenBao 만     : ansible-playbook db.yml -K --tags openbao
#   .env 값 이관만 : ansible-playbook db.yml -K --tags openbao_import
#   수집기만       : ansible-playbook db.yml -K --tags collectors   (CLUSTER_ENTRY_IP 필요)
- name: DB 노드 구성 (OpenBao + MariaDB + Valkey + MinIO, Docker Compose)
  hosts: db
  become: true
  vars:
    # compose env_file / cnf / valkey.conf / SQL 에 따옴표 없이 들어가므로 특수문자 제한
    secret_charset_regex: '^[^\s''"\\$#`]+$'
    # MinIO 키는 MC_HOST_<alias>=http://<key>:<secret>@host URL 에 들어가므로 URL 에 안전한 문자만
    minio_key_charset_regex: '^[A-Za-z0-9._~-]+$'
    # preflight(OpenBao 기동 전)는 Tailscale 값만 확인
    required_env:
      TS_DB_OAUTH_CLIENT_SECRET: "{{ ts_oauth_secret }}"
    # OpenBao 를 읽은 뒤 확인 (OpenBao 도입 전에는 .env · backend/.env 값)
    required_values:
      VALKEY_PASSWORD: "{{ valkey_password }}"
      MINIO_ROOT_USER: "{{ minio_root_user }}"
      MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
      MINIO_APP_ACCESS_KEY: "{{ minio_app_access_key }}"
      MINIO_APP_SECRET_KEY: "{{ minio_app_secret_key }}"
      MINIO_RAG_ACCESS_KEY: "{{ minio_rag_access_key }}"
      MINIO_RAG_SECRET_KEY: "{{ minio_rag_secret_key }}"
      DB_USERNAME: "{{ db_username }}"
      DB_PASSWORD: "{{ db_password }}"
      DB_ROOT_PASSWORD: "{{ db_root_password }}"
  pre_tasks:
    - name: 선행 패키지 설치
      ansible.builtin.apt:
        name: [ca-certificates, curl, python3-debian, ufw]
        state: present
        update_cache: true
        cache_valid_time: 3600

  roles:
    - preflight
    - tailscale
    - docker
    - firewall
    - role: openbao
      tags: [openbao]

  tasks:
    - name: .env 값 → OpenBao 이관 (없는 경로만)
      ansible.builtin.import_role:
        name: openbao
        tasks_from: import
      tags: [openbao, openbao_import]

    # DB 서버 지표용 exporter 계정 비밀번호 — 처음 한 번만 만들고 이후에는 그대로 (README 17-6)
    - name: OpenBao 저장 (main-db-exporter, 없을 때만)
      ansible.builtin.include_role:
        name: openbao_kv
        tasks_from: write
      vars:
        openbao_write_path: main-db-exporter
        openbao_write_create_only: true
        openbao_write_data:
          password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      tags: [always]

    - name: OpenBao 값 읽기
      ansible.builtin.import_role:
        name: openbao_kv
        tasks_from: read
      vars:
        openbao_read_paths: "{{ db_openbao_paths }}"
      # --tags seed · openbao_import 단독 실행에서도 OpenBao 값을 쓰도록
      tags: [always]

    # 값 대신 [이름, 길이] 만 넘겨 no_log 없이 어떤 값이 비었는지 보여줌
    - name: 필수 값 확인
      ansible.builtin.assert:
        that: item.1 > 0
        fail_msg: >-
          {{ item.0 }} 가 비어 있습니다. OpenBao({{ openbao_kv_prefix }}/*)에 값을 넣거나,
          OpenBao 도입 전이면 infra/ansible/.env · backend/.env 를 채우고 다시 실행하세요 (README 7-2, 16-3).
        quiet: true
      loop: "{{ required_values | dict2items | map(attribute='key') | zip(required_values | dict2items | map(attribute='value') | map('length')) | list }}"
      loop_control:
        label: "{{ item.0 }}"
      run_once: true

    - name: DB 계정 정책 확인
      ansible.builtin.assert:
        that:
          - db_username != 'root'
          - db_password is regex(secret_charset_regex)
          - db_root_password is regex(secret_charset_regex)
          - valkey_password is regex(secret_charset_regex)
          - ci_smoke_db_password | length == 0 or ci_smoke_db_password is regex(secret_charset_regex)
        fail_msg: >-
          DB_USERNAME 은 root 를 쓸 수 없습니다(앱 전용 계정 사용). 비밀번호에는 공백, 따옴표, 역슬래시, $, #, ` 를 쓸 수 없습니다.
        quiet: true
      no_log: true
      run_once: true
      delegate_to: localhost
      become: false

    - name: MinIO 계정 정책 확인
      ansible.builtin.assert:
        that:
          - minio_root_user is regex(minio_key_charset_regex)
          - minio_root_password is regex(minio_key_charset_regex)
          - minio_app_access_key is regex(minio_key_charset_regex)
          - minio_app_secret_key is regex(minio_key_charset_regex)
          - minio_root_user | length >= 3
          - minio_app_access_key | length >= 3
          - minio_root_password | length >= 8
          - minio_app_secret_key | length >= 8
          - minio_app_access_key != minio_root_user
          - minio_rag_access_key is regex(minio_key_charset_regex)
          - minio_rag_secret_key is regex(minio_key_charset_regex)
          - minio_rag_access_key | length >= 3
          - minio_rag_secret_key | length >= 8
          - minio_rag_access_key not in [minio_root_user, minio_app_access_key]
        fail_msg: >-
          MINIO_* 값에는 영문, 숫자, . _ ~ - 만 쓸 수 있습니다. USER / ACCESS_KEY 는 3자 이상,
          PASSWORD / SECRET_KEY 는 8자 이상이어야 하고, 앱 계정(MINIO_APP_ACCESS_KEY)·RAG 계정(MINIO_RAG_ACCESS_KEY)은
          root 및 서로와 달라야 합니다.
        quiet: true
      no_log: true
      run_once: true
      delegate_to: localhost
      become: false

    - name: DB 스택
      ansible.builtin.import_role:
        name: db_stack

    # 호스트 · 컨테이너 + 메인 MariaDB · Valkey 서버 지표 → 클러스터 Prometheus (README 17-6). 단독: --tags collectors
    - name: 모니터링 수집기
      ansible.builtin.import_role:
        name: node_collectors
      vars:
        collectors_cluster: db
        collectors_namespace: db
        collectors_mysql: "{{ {'port': db_port, 'user': db_exporter_user, 'password': db_exporter_password} if db_exporter_password | length > 0 else {} }}"
        collectors_redis:
          port: "{{ valkey_port }}"
          password: "{{ valkey_password }}"
      tags: [collectors]

    # dev 초기 데이터 — 메인 DB 스키마(ArgoCD sync 때 main-db-migration hook 이 적용)가 있어야 실행, 없으면 건너뜀
    - name: dev DB 시딩
      ansible.builtin.import_role:
        name: db_seed
      tags: [seed]
