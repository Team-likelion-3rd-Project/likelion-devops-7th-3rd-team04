# 챗봇 AI 스택 로컬 테스트용: Ollama + llm-service + n8n.
# backend/docker-compose.yml과는 별개 프로젝트입니다. backend의 chat-bot-service는
# N8N_WEBHOOK_URL(backend/.env.example 참고)로 이 스택의 n8n 웹훅을 호출합니다.
#
# 사용법:
#   docker compose -f langchain_rag/docker-compose.yml up --build
#   curl localhost:8001/chat -X POST -H 'Content-Type: application/json' \
#       -d '{"message": "안녕하세요, 예약 가능한 방 있나요?", "history": []}'
#   curl localhost:5678/webhook/chat -X POST -H 'Content-Type: application/json' \
#       -d '{"message": "안녕하세요, 예약 가능한 방 있나요?", "history": []}'
#
# 전체 테스트 방법과 "웹훅이 404일 때" 대처는 langchain_rag/n8n/README.md를 참고하세요.

services:
  ollama:
    build:
      context: ./ollama
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
        OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    environment:
      # Ollama는 기본적으로 5분 동안 요청이 없으면 모델을 메모리에서 내리고, 다음 요청 때
      # 다시 올립니다(CPU 전용 로컬 환경에서 25~30초). 이것만으로도 n8n "Call llm-service"
      # 노드의 타임아웃을 넘길 수 있어 -1(컨테이너가 떠 있는 동안 계속 상주)로 둡니다.
      OLLAMA_KEEP_ALIVE: -1
    ports:
      - "11434:11434"

  llm-service:
    build:
      context: ./llm-service
    # llm-service/.env(.env.example 복사본)가 있으면 읽습니다. 아래 environment:에 적힌
    # 값이 우선하므로, 여기에 없는 변수(RAG_TOP_K 등)를 바꿀 때 씁니다.
    env_file:
      - path: ./llm-service/.env
        required: false
    environment:
      # 로컬 기본은 Ollama. Vertex AI로 돌리려면 호스트 셸에서 LLM_PROVIDER=vertex와
      # GCP_SA_KEY_JSON(서비스 계정 키 JSON 문자열)을 지정하세요(dev·prod 클러스터는 vertex).
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-likelion-devops-7th-3rd-team4}
      GCP_SA_KEY_JSON: ${GCP_SA_KEY_JSON:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # RAG 검색(app/retrieval.py) — 로컬 기본은 S3 Vectors(VECTOR_STORE=s3vectors).
      # 자격 증명이 없거나 조회가 실패하면 근거 없는 답변으로 넘어갑니다.
      VECTOR_STORE: ${VECTOR_STORE:-s3vectors}
      VECTOR_BUCKET_NAME: ${VECTOR_BUCKET_NAME:-team04-dev-vector-bucket}
      VECTOR_INDEX_NAME: ${VECTOR_INDEX_NAME:-team04-chatbot-vector-index}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # 호스트 셸에 AWS 자격 증명이 있으면 그대로 넘깁니다. 비어 있으면 boto3 호출이
      # 실패하고 retrieval.py가 context 없이 계속합니다.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      # 호스트 8001 -> 컨테이너 8000: backend/docker-compose.yml의 dynamodb-local이 호스트
      # 8000을 이미 쓰고 두 프로젝트를 동시에 띄울 수 있어서 옮겼습니다. 컨테이너끼리의
      # 호출(n8n -> llm-service)은 그대로 llm-service:8000을 씁니다.
      - "8001:8000"
    depends_on:
      - ollama

  # 오케스트레이션 워크플로(Webhook -> 역할 매핑 -> llm-service -> Respond to Webhook)를
  # 돌리는 n8n. RAG 검색은 llm-service 안에서 하므로 워크플로는 message/history만 넘깁니다.
  n8n:
    # 버전 고정 — backend 차트(n8n.image.tag)·CI(N8N_VERSION)와 같은 값. activate-workflow.js가 이 버전에서 검증됨
    image: n8nio/n8n:2.35.3
    ports:
      - "5678:5678"
    environment:
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    # n8n-init이 이 서비스와 같은 SQLite 파일(n8n_data 볼륨)을 직접 건드리는데,
    # depends_on만으로는 "컨테이너 시작"만 보장되고 "n8n이 자체 DB 마이그레이션을
    # 끝냈는지"는 보장이 안 돼서, 마이그레이션 도중 n8n-init이 같은 파일을 열려다
    # SQLITE_BUSY로 n8n 본체가 죽는 레이스가 실제로 발생했다. /healthz로 실제
    # 준비 완료를 확인해서 n8n-init이 그 이후에만 뜨도록 강제한다.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # 워크플로를 한 번 import하고 활성화한 뒤 종료하는 일회성 컨테이너입니다(backend의
  # dynamodb-init과 같은 패턴). `up`마다 다시 돌아도 안전합니다 — import는 workflow id로
  # upsert하고, activate-workflow.js는 이미 활성 상태면 건너뜁니다.
  #
  # 두 단계가 모두 필요한 이유(자세한 내용은 n8n/scripts/activate-workflow.js):
  #   1. `n8n import:workflow`는 n8n_data 볼륨의 SQLite에 워크플로를 직접 쓰지만, JSON의
  #      `active` 값과 상관없이 항상 비활성 상태로 import합니다(n8n CLI의 문서화된 동작:
  #      https://community.n8n.io/t/disable-deactivating-workflow-during-import/28217).
  #   2. 그래서 activate-workflow.js가 n8n REST API로 실제 활성화(웹훅 등록)를 합니다.
  #      최초 실행 시 로컬 owner 계정을 만들어 세션을 얻습니다
  #      (N8N_INIT_OWNER_EMAIL/N8N_INIT_OWNER_PASSWORD로 변경 가능, 로컬 전용이라 기본값으로 충분).
  n8n-init:
    image: n8nio/n8n:2.35.3
    entrypoint: ["sh", "-c"]
    command:
      - >
        n8n import:workflow --input=/workflows/chat-orchestration.json &&
        node /scripts/activate-workflow.js /workflows/chat-orchestration.json
    environment:
      N8N_URL: http://n8n:5678
      N8N_INIT_OWNER_EMAIL: ${N8N_INIT_OWNER_EMAIL:-admin@example.com}
      N8N_INIT_OWNER_PASSWORD: ${N8N_INIT_OWNER_PASSWORD:-ChangeMe123!}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/scripts:/scripts:ro
    depends_on:
      n8n:
        condition: service_healthy
    restart: "no"

volumes:
  n8n_data:
